<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — Personalizar perfil</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#222,#070707 60%);
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:25px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:25px;
    font-weight:900;
}

.header button{
    padding:10px 15px;
    border:1px solid #333;
    border-radius:10px;
    background:#111;
    color:#fff;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:1fr 420px;
    gap:20px;
}

.panel{
    background:rgba(15,15,15,.9);
    border:1px solid #292929;
    border-radius:18px;
    padding:20px;
}

.tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.tab{
    border:1px solid #292929;
    background:#111;
    color:#aaa;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
}

.tab.active{
    background:#fff;
    color:#000;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

h2{
    margin-top:0;
}

h3{
    margin-top:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    color:#aaa;
    font-size:13px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #303030;
    border-radius:9px;
    background:#0b0b0b;
    color:#fff;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#777;
}

input:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.check{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    margin-top:8px;
    border:1px solid #292929;
    border-radius:9px;
    background:#0d0d0d;
}

.check input{
    width:auto;
}

.color{
    height:45px;
    padding:4px;
}

.save{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-weight:800;
    cursor:pointer;
}

.save:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    min-height:20px;
    margin-top:12px;
    text-align:center;
    color:#aaa;
}

.preview-wrap{
    position:sticky;
    top:20px;
}

.preview-title{
    color:#aaa;
    font-size:13px;
    margin-bottom:10px;
}

.preview{
    min-height:500px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    background:#050505;
}

.preview-bg{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
}

.preview-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
}

.card{
    position:relative;
    z-index:2;
    width:88%;
    padding:30px 20px;
    text-align:center;
    border-radius:20px;
    background:rgba(10,10,10,.82);
    border:1px solid #333;
    backdrop-filter:blur(15px);
    transition:transform .15s ease;
}

.avatar{
    width:90px;
    height:90px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:50%;
    background:#191919;
    border:3px solid #fff;
    font-size:30px;
    font-weight:bold;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.pname{
    margin-top:15px;
    font-size:23px;
    font-weight:900;
}

.pusername{
    margin-top:4px;
    color:#777;
    font-size:12px;
}

.pbio{
    margin-top:14px;
    color:#aaa;
    font-size:13px;
}

.pviews{
    margin-top:10px;
    color:#777;
    font-size:11px;
}

.plinks{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.plink{
    padding:10px;
    border-radius:8px;
    background:#111;
    border:1px solid #292929;
}

@media(max-width:850px){

    .grid{
        grid-template-columns:1fr;
    }

    .preview-wrap{
        position:static;
    }
}
</style>
</head>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   ELEMENTOS
========================================== */

const $ = id =>
    document.getElementById(id);

let currentUser = null;
let currentProfile = null;


/* ==========================================
   TABS
========================================== */

document
.querySelectorAll(".tab")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".tab")
            .forEach(x =>
                x.classList.remove("active")
            );


            document
            .querySelectorAll(".section")
            .forEach(x =>
                x.classList.remove("active")
            );


            button.classList.add(
                "active"
            );


            $(
                button.dataset.tab
            ).classList.add(
                "active"
            );

        }
    );

});


/* ==========================================
   CARGAR USUARIO
========================================== */

async function loadEditor(){

    setMessage(
        "Cargando editor..."
    );


    const {
        data,
        error
    } =
    await supabase.auth.getUser();


    if(error){

        console.error(error);

        setMessage(
            "❌ " + error.message,
            true
        );

        return;
    }


    if(!data.user){

        window.location.href =
            "login.html";

        return;
    }


    currentUser =
        data.user;


    /*
       BUSCAR PERFIL
    */

    const {
        data:profile,
        error:profileError
    } =
    await supabase
    .from("profiles")
    .select("*")
    .eq(
        "id",
        currentUser.id
    )
    .maybeSingle();


    if(profileError){

        console.error(
            profileError
        );

        setMessage(
            "❌ " +
            profileError.message,
            true
        );

        return;
    }


    if(!profile){

        setMessage(
            "❌ No se encontró tu perfil.",
            true
        );

        return;
    }


    currentProfile =
        profile;


    fillEditor(
        profile
    );


    updatePreview();


    setMessage(
        "Editor listo ✓"
    );
}


/* ==========================================
   LLENAR EDITOR
========================================== */

function fillEditor(data){

    $("username").value =
        data.username || "";


    $("display_name").value =
        data.display_name || "";


    $("bio").value =
        data.bio || "";


    $("avatar_url").value =
        data.avatar_url || "";


    $("background_url").value =
        data.background_url || "";


    $("background_type").value =
        data.background_type || "image";


    $("music_url").value =
        data.music_url || "";


    $("cursor_url").value =
        data.cursor_url || "";


    $("font_url").value =
        data.font_url || "";


    $("accent_color").value =
        data.accent_color || "#ffffff";


    $("background_color").value =
        data.background_color || "#050505";


    $("text_color").value =
        data.text_color || "#ffffff";


    $("border_color").value =
        data.border_color || "#292929";


    $("typing_enabled").checked =
        Boolean(
            data.typing_enabled
        );


    $("typing_speed").value =
        data.typing_speed || 70;


    $("glitch_enabled").checked =
        Boolean(
            data.glitch_enabled
        );


    $("three_d_enabled").checked =
        Boolean(
            data.three_d_enabled
        );


    $("rain_enabled").checked =
        Boolean(
            data.rain_enabled
        );


    $("discord").value =
        data.discord || "";


    $("instagram").value =
        data.instagram || "";


    $("tiktok").value =
        data.tiktok || "";


    $("spotify").value =
        data.spotify || "";


    $("youtube").value =
        data.youtube || "";


    $("github").value =
        data.github || "";
}


/* ==========================================
   PREVIEW
========================================== */

function updatePreview(){

    const username =
        $("username").value.trim();


    const displayName =
        $("display_name").value.trim();


    const bio =
        $("bio").value.trim();


    const avatarURL =
        $("avatar_url").value.trim();


    $("previewName").textContent =
        displayName ||
        username ||
        "NØX User";


    $("previewUsername").textContent =
        "@" +
        (
            username ||
            "username"
