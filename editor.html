<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NØX — Editor</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 min-height:100%;
}

body{
 font-family:Arial,Helvetica,sans-serif;
 background:#050505;
 color:white;
 overflow-x:hidden;
}

button,
input,
textarea,
select{
 font:inherit;
}

button{
 cursor:pointer;
}

.app{
 min-height:100vh;
 display:grid;
 grid-template-columns:270px 1fr;
}

.sidebar{
 position:sticky;
 top:0;
 height:100vh;
 padding:20px;
 border-right:1px solid #202020;
 background:rgba(8,8,8,.92);
 backdrop-filter:blur(20px);
}

.logo{
 font-size:25px;
 font-weight:900;
 margin-bottom:5px;
}

.sub{
 color:#777;
 font-size:12px;
 margin-bottom:25px;
}

.nav{
 display:flex;
 flex-direction:column;
 gap:8px;
}

.nav button{
 border:1px solid transparent;
 border-radius:12px;
 padding:12px;
 text-align:left;
 color:#aaa;
 background:transparent;
 transition:.25s;
}

.nav button:hover,
.nav button.active{
 color:#fff;
 background:#151515;
 border-color:#292929;
 transform:translateX(3px);
}

.save{
 position:absolute;
 left:20px;
 right:20px;
 bottom:20px;
 padding:13px;
 border:0;
 border-radius:12px;
 color:white;
 background:#fff;
 color:#000;
 font-weight:800;
}

.main{
 min-width:0;
 padding:25px;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:20px;
}

.title{
 font-size:24px;
 font-weight:900;
}

.status{
 color:#777;
 font-size:12px;
}

.previewWrap{
 position:sticky;
 top:25px;
 float:right;
 width:42%;
 margin-left:25px;
}

.preview{
 min-height:600px;
 position:relative;
 overflow:hidden;
 border:1px solid #292929;
 border-radius:25px;
 background:#080808;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:25px;
}

.previewBg{
 position:absolute;
 inset:0;
 background:
 radial-gradient(circle at top,#282828,#050505 70%);
 background-size:cover;
 background-position:center;
 z-index:0;
}

.previewOverlay{
 position:absolute;
 inset:0;
 background:rgba(0,0,0,.4);
 z-index:1;
}

.card{
 position:relative;
 z-index:2;
 width:100%;
 max-width:390px;
 padding:30px 24px;
 border:1px solid #333;
 border-radius:24px;
 background:rgba(10,10,10,.72);
 backdrop-filter:blur(18px);
 box-shadow:0 25px 80px rgba(0,0,0,.5);
 text-align:center;
 transition:.2s;
}

.avatar{
 width:100px;
 height:100px;
 margin:auto;
 border-radius:50%;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#191919;
 border:3px solid #fff;
 font-size:35px;
 font-weight:900;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.pname{
 margin-top:17px;
 font-size:27px;
 font-weight:900;
}

.puser{
 margin-top:4px;
 color:#888;
 font-size:13px;
}

.pbio{
 margin-top:15px;
 color:#bbb;
 line-height:1.5;
 font-size:14px;
}

.badges{
 display:flex;
 justify-content:center;
 gap:7px;
 flex-wrap:wrap;
 margin-top:15px;
}

.badge{
 padding:6px 9px;
 border:1px solid #333;
 border-radius:999px;
 background:#111;
 font-size:11px;
}

.pviews{
 margin-top:13px;
 color:#777;
 font-size:12px;
}

.plinks{
 display:flex;
 flex-direction:column;
 gap:8px;
 margin-top:18px;
}

.plink{
 padding:11px;
 border:1px solid #292929;
 border-radius:11px;
 background:#111;
 color:#fff;
 text-decoration:none;
 transition:.2s;
}

.plink:hover{
 transform:translateY(-3px);
 box-shadow:0 0 25px rgba(255,255,255,.12);
}

.music{
 margin-top:17px;
 padding:12px;
 border:1px solid #292929;
 border-radius:13px;
 background:#111;
}

.music button{
 width:38px;
 height:38px;
 border-radius:50%;
 border:0;
 background:white;
 color:black;
 font-weight:900;
}

.controls{
 margin-top:20px;
 display:flex;
 gap:10px;
 flex-wrap:wrap;
}

.control{
 display:none;
 padding:20px;
 border:1px solid #242424;
 border-radius:18px;
 background:#0b0b0b;
}

.control.active{
 display:block;
 animation:panel .25s ease;
}

@keyframes panel{
 from{
  opacity:0;
  transform:translateY(8px);
 }
 to{
  opacity:1;
  transform:none;
 }
}

.field{
 margin-bottom:15px;
}

.field label{
 display:block;
 margin-bottom:7px;
 color:#aaa;
 font-size:12px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:12px;
 border:1px solid #292929;
 outline:none;
 border-radius:10px;
 background:#111;
 color:white;
}

.field textarea{
 min-height:90px;
 resize:vertical;
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.check{
 display:flex;
 align-items:center;
 gap:10px;
 padding:11px;
 border:1px solid #222;
 border-radius:10px;
 background:#0d0d0d;
 margin-bottom:8px;
 color:#bbb;
 font-size:13px;
}

.file{
 padding:15px;
 border:1px dashed #333;
 border-radius:12px;
 background:#0d0d0d;
}

.small{
 color:#666;
 font-size:11px;
 margin-top:6px;
}

.generate{
 display:block;
 margin-top:20px;
 padding:13px;
 border-radius:11px;
 background:white;
 color:black;
 text-align:center;
 text-decoration:none;
 font-weight:900;
}

@media(max-width:1000px){

 .app{
  grid-template-columns:1fr;
 }

 .sidebar{
  position:relative;
  height:auto;
  border-right:0;
  border-bottom:1px solid #202020;
 }

 .save{
  position:static;
  width:100%;
  margin-top:20px;
 }

 .previewWrap{
  float:none;
  width:100%;
  margin:0 0 25px;
  position:relative;
  top:auto;
 }

 .preview{
  min-height:500px;
 }

}

@media(max-width:600px){

 .main{
  padding:15px;
 }

 .row{
  grid-template-columns:1fr;
 }

 .preview{
  padding:15px;
 }

 .card{
  padding:25px 18px;
 }

}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

 <div class="logo">NØX</div>
 <div class="sub">Profile Studio</div>

 <div class="nav">

  <button class="active" data-tab="general">
   ✦ General
  </button>

  <button data-tab="appearance">
   🎨 Appearance
  </button>

  <button data-tab="background">
   🖼️ Background
  </button>

  <button data-tab="music">
   ♪ Music
  </button>

  <button data-tab="links">
   🔗 Links
  </button>

  <button data-tab="effects">
   ✨ Effects
  </button>

  <button data-tab="badges">
   🏅 Badges
  </button>

 </div>

 <button class="save" id="save">
  Guardar ahora
 </button>

</aside>


<main class="main">

 <div class="top">
  <div class="title">Personaliza tu perfil</div>
  <div class="status" id="status">Preparando...</div>
 </div>


 <div class="previewWrap">

  <div class="preview">

   <div id="previewBg" class="previewBg"></div>
   <div class="previewOverlay"></div>

   <div id="previewCard" class="card">

    <div id="avatar" class="avatar">
     N
    </div>

    <div id="pname" class="pname">
     NØX User
    </div>

    <div id="puser" class="puser">
     @username
    </div>

    <div id="pbio" class="pbio">
     Welcome to my NØX profile.
    </div>

    <div id="badges" class="badges"></div>

    <div id="pviews" class="pviews">
     👁️ 0 vistas
    </div>

    <div id="plinks" class="plinks"></div>

    <div id="pmusic" class="music">
     <button id="play">▶</button>
     <span id="songName">Sin música</span>
    </div>

   </div>

  </div>

 </div>


 <section id="general" class="control active">

  <h3>General</h3>

  <div class="field">
   <label>Username</label>
   <input id="username" disabled>
   <div class="small">
    El username no se puede cambiar.
   </div>
  </div>

  <div class="field">
   <label>Apodo / nombre visible</label>
   <input id="displayName" placeholder="Tu apodo">
  </div>

  <div class="field">
   <label>Biografía</label>
   <textarea id="bio" placeholder="Escribe algo sobre ti..."></textarea>
  </div>

  <div class="field">
   <label>Avatar</label>
   <input id="avatarUrl" placeholder="URL de imagen">
  </div>

  <div class="file">
   <label>O subir avatar desde archivos</label>
   <input id="avatarFile" type="file" accept="image/*">
  </div>

 </section>


 <section id="appearance" class="control">

  <h3>Apariencia</h3>

  <div class="row">

   <div class="field">
    <label>Color principal</label>
    <input id="accentColor" type="color" value="#ffffff">
   </div>

   <div class="field">
    <label>Color de fondo</label>
    <input id="backgroundColor" type="color" value="#050505">
   </div>

  </div>

  <div class="row">

   <div class="field">
    <label>Color texto</label>
    <input id="textColor" type="color" value="#ffffff">
   </div>

   <div class="field">
    <label>Color bordes</label>
    <input id="borderColor" type="color" value="#292929">
   </div>

  </div>

  <div class="field">
   <label>Opacidad del cristal</label>
   <input id="glassOpacity" type="range" min="0.2" max="0.95" step="0.05" value="0.72">
  </div>

  <div class="field">
   <label>Fuente</label>
   <select id="fontFamily">
    <option value="Arial">Arial</option>
    <option value="Verdana">Verdana</option>
    <option value="Trebuchet MS">Trebuchet MS</option>
    <option value="Georgia">Georgia</option>
    <option value="monospace">Monospace</option>
   </select>
  </div>

 </section>


 <section id="background" class="control">

  <h3>Fondo</h3>

  <div class="field">
   <label>URL del fondo</label>
   <input id="backgroundUrl" placeholder="https://...">
  </div>

  <div class="field">
   <label>Tipo</label>
   <select id="backgroundType">
    <option value="image">Imagen / GIF</option>
    <option value="video">Video MP4</option>
   </select>
  </div>

  <div class="file">
   <label>Subir fondo</label>
   <input id="backgroundFile" type="file" accept="image/*,video/mp4">
  </div>

  <div class="field">
   <label>Oscurecimiento</label>
   <input id="overlayOpacity" type="range" min="0" max="0.9" step="0.05" value="0.4">
  </div>

 </section>


 <section id="music" class="control">

  <h3>Música</h3>

  <div class="field">
   <label>Nombre de canción</label>
   <input id="musicName" placeholder="Mi canción">
  </div>

  <div class="field">
   <label>URL de audio</label>
   <input id="musicUrl" placeholder="https://...mp3">
  </div>

  <div class="file">
   <label>Subir audio</label>
   <input id="musicFile" type="file" accept="audio/*">
  </div>

 </section>


 <section id="links" class="control">

  <h3>Redes y enlaces</h3>

  <div class="field">
   <label>Discord</label>
   <input id="discord">
  </div>

  <div class="field">
   <label>Instagram</label>
   <input id="instagram">
  </div>

  <div class="field">
   <label>TikTok</label>
   <input id="tiktok">
  </div>

  <div class="field">
   <label>Spotify</label>
   <input id="spotify">
  </div>

  <div class="field">
   <label>YouTube</label>
   <input id="youtube">
  </div>

  <div class="field">
   <label>GitHub</label>
   <input id="github">
  </div>

 </section>


 <section id="effects" class="control">

  <h3>Efectos</h3>

  <label class="check">
   <input id="typingEnabled" type="checkbox">
   Máquina de escribir
  </label>

  <label class="check">
   <input id="glitchEnabled" type="checkbox">
   Glitch en username
  </label>

  <label class="check">
   <input id="threeDEnabled" type="checkbox" checked>
   Tarjeta 3D con el mouse
  </label>

  <label class="check">
   <input id="rainEnabled" type="checkbox">
   Lluvia / partículas
  </label>

  <label class="check">
   <input id="snowEnabled" type="checkbox">
   Nieve
  </label>

  <label class="check">
   <input id="cursorEnabled" type="checkbox">
   Cursor personalizado
  </label>

 </section>


 <section id="badges" class="control">

  <h3>Badges</h3>

  <div class="field">
   <label>Badges separados por coma</label>
   <input
    id="badgeInput"
    placeholder="OG, Verified, Developer"
   >
  </div>

 </section>


 <a
  id="profileLink"
  class="generate"
  href="#"
  target="_blank"
 >
  🚀 Generar / abrir mi perfil
 </a>

</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";

const supabase =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================
   ELEMENTOS
========================= */

const $ = id =>
 document.getElementById(id);


/* =========================
   DATOS
========================= */

let currentUser = null;
let profile = null;
let saveTimer = null;
let audio = null;


/* =========================
   TABS
========================= */

document
.querySelectorAll(".nav button")
.forEach(button => {

 button.addEventListener(
  "click",
  () => {

   document
   .querySelectorAll(".nav button")
   .forEach(x =>
    x.classList.remove("active")
   );

   button.classList.add("active");

   document
   .querySelectorAll(".control")
   .forEach(x =>
    x.classList.remove("active")
   );

   $(button.dataset.tab)
   .classList.add("active");

  }
 );

});


/* =========================
   AUTH
========================= */

async function load(){

 const result =
  await supabase.auth.getUser();

 if(result.error || !result.data.user){

  location.href =
   "login.html";

  return;

 }

 currentUser =
  result.data.user;


 const resultProfile =
  await supabase
  .from("profiles")
  .select("*")
  .eq(
   "id",
   currentUser.id
  )
  .maybeSingle();


 if(resultProfile.error){

  console.error(
   resultProfile.error
  );

  $("status").textContent =
   resultProfile.error.message;

  return;

 }


 if(!resultProfile.data){

  $("status").textContent =
   "No existe tu perfil.";

  return;

 }


 profile =
  resultProfile.data;


 fill(profile);

 $("status").textContent =
  "Editor listo ✓";

}


/* =========================
   RELLENAR
========================= */

function fill(p){

 $("username").value =
  p.username || "";

 $("displayName").value =
  p.display_name || "";

 $("bio").value =
  p.bio || "";

 $("avatarUrl").value =
  p.avatar_url || "";

 $("discord").value =
  p.discord || "";

 $("instagram").value =
  p.instagram || "";

 $("tiktok").value =
  p.tiktok || "";

 $("spotify").value =
  p.spotify || "";

 $("youtube").value =
  p.youtube || "";

 $("github").value =
  p.github || "";

 $("backgroundUrl").value =
  p.background_url || "";

 $("backgroundType").value =
  p.background_type || "image";

 $("musicUrl").value =
  p.music_url || "";

 $("musicName").value =
  p.music_name || "";

 $("accentColor").value =
  p.accent_color || "#ffffff";

 $("backgroundColor").value =
  p.background_color || "#050505";

 $("textColor").value =
  p.text_color || "#ffffff";

 $("borderColor").value =
  p.border_color || "#292929";

 $("glassOpacity").value =
  p.glass_opacity || .72;

 $("overlayOpacity").value =
  p.overlay_opacity || .4;

 $("fontFamily").value =
  p.font_family || "Arial";

 $("typingEnabled").checked =
  !!p.typing_enabled;

 $("glitchEnabled").checked =
  !!p.glitch_enabled;

 $("threeDEnabled").checked =
  p.three_d_enabled !== false;

 $("rainEnabled").checked =
  !!p.rain_enabled;

 $("snowEnabled").checked =
  !!p.snow_enabled;

 $("cursorEnabled").checked =
  !!p.cursor_enabled;

 $("badgeInput").value =
  p.badges || "";

 updatePreview();

}


/* =========================
   PREVIEW
========================= */

function updatePreview(){

 const username =
  $("username").value.trim();

 const displayName =
  $("displayName").value.trim();

 const bio =
  $("bio").value.trim();


 $("pname").textContent =
  displayName ||
  username ||
  "NØX User";


 $("puser").textContent =
  "@" +
  (
   username ||
   "username"
  );


 $("pbio").textContent =
  bio ||
  "Welcome to my NØX profile.";


 $("pviews").textContent =
  "👁️ " +
  (
   profile?.profile_views ||
   0
  ) +
  " vistas";


 /* COLORS */

 document.body.style.color =
  $("textColor").value;

 document.querySelector(
  ".card"
 ).style.background =
  `rgba(10,10,10,${$("glassOpacity").value})`;

 document.querySelector(
  ".card"
 ).style.borderColor =
  $("borderColor").value;

 document.querySelector(
  ".preview"
 ).style.background =
  $("backgroundColor").value;

 document.querySelector(
  ".previewOverlay"
 ).style.background =
  `rgba(0,0,0,${$("overlayOpacity").value})`;

 document.querySelector(
  ".preview"
 ).style.fontFamily =
  $("fontFamily").value;


 /* AVATAR */

 $("avatar").innerHTML = "";

 const avatarUrl =
  $("avatarUrl").value.trim();

 if(avatarUrl){

  const img =
   document.createElement("img");

  img.src =
   avatarUrl;

  img.onerror =
   () => {
    $("avatar").textContent =
     getLetter(
      displayName ||
      username
     );
   };

  $("avatar").appendChild(img);

 }else{

  $("avatar").textContent =
   getLetter(
    displayName ||
    username
   );

 }


 /* BADGES */

 $("badges").innerHTML = "";

 const badges =
  $("badgeInput")
  .value
  .split(",")
  .map(x => x.trim())
  .filter(Boolean);

 badges.forEach(text => {

  const badge =
   document.createElement("div");

  badge.className =
   "badge";

  badge.textContent =
   text;

  $("badges")
   .appendChild(badge);

 });


 /* LINKS */

 $("plinks").innerHTML = "";

 addPreviewLink(
  $("discord").value,
  "Discord"
 );

 addPreviewLink(
  $("instagram").value,
  "Instagram"
 );

 addPreviewLink(
  $("tiktok").value,
  "TikTok"
 );

 addPreviewLink(
  $("spotify").value,
  "Spotify"
 );

 addPreviewLink(
  $("youtube").value,
  "YouTube"
 );

 addPreviewLink(
  $("github").value,
  "GitHub"
 );


 /* BACKGROUND */

 const bg =
  $("backgroundUrl")
  .value
  .trim();

 if(bg){

  $("previewBg").style.backgroundImage =
   `url("${bg}")`;

 }


 /* MUSIC */

 $("songName").textContent =
  $("musicName").value ||
  "Sin música";


 /* 3D */

 if(
  $("threeDEnabled").checked
 ){

  $("preview").onmousemove =
   tilt;

  $("preview").onmouseleave =
   resetTilt;

 }else{

  $("preview").onmousemove =
   null;

  $("preview").onmouseleave =
   null;

  resetTilt();

 }


 /* GLITCH */

 if(
  $("glitchEnabled").checked
 ){

  $("puser").style.textShadow =
   "2px 0 #f00,-2px 0 #0ff";

 }else{

  $("puser").style.textShadow =
   "none";

 }


 /* AUTOSAVE */

 scheduleSave();

}


/* =========================
   LINKS
========================= */

function addPreviewLink(
 url,
 text
){

 if(!url.trim())
  return;

 const a =
  document.createElement("a");

 a.className =
  "plink";

 a.textContent =
  text +
  " ↗";

 a.href =
  normalizeUrl(
   url.trim()
  );

 a.target =
  "_blank";

 a.rel =
  "noopener noreferrer";

 $("plinks")
  .appendChild(a);

}


/* =========================
   3D
========================= */

function tilt(event){

 const rect =
  $("preview").getBoundingClientRect();

 const x =
  event.clientX -
  rect.left;

 const y =
  event.clientY -
  rect.top;

 const rotateY =
  ((x / rect.width) - .5) * 10;

 const rotateX =
  ((y / rect.height) - .5) * -10;

 $("previewCard").style.transform =
  `perspective(900px)
   rotateX(${rotateX}deg)
   rotateY(${rotateY}deg)
   translateY(-2px)`;

}

function resetTilt(){

 $("previewCard").style.transform =
  "";

}


/* =========================
   AUTOSAVE
========================= */

function scheduleSave(){

 clearTimeout(
  saveTimer
 );

 saveTimer =
  setTimeout(
   save,
   900
  );

 $("status").textContent =
  "Guardando...";

}


/* =========================
   GUARDAR SUPABASE
========================= */

async function save(){

 if(!currentUser)
  return;

 const values = {

  display_name:
   $("displayName").value.trim(),

  bio:
   $("bio").value.trim(),

  avatar_url:
   $("avatarUrl").value.trim(),

  discord:
   $("discord").value.trim(),

  instagram:
   $("instagram").value.trim(),

  tiktok:
   $("tiktok").value.trim(),

  spotify:
   $("spotify").value.trim(),

  youtube:
   $("youtube").value.trim(),

  github:
   $("github").value.trim(),

  background_url:
