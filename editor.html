<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Editor</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    background:#050505;

    color:white;

    font-family:Arial,sans-serif;

    padding:25px;

}

.container{

    width:100%;

    max-width:900px;

    margin:auto;

}

h1{

    margin:0;

    font-size:30px;

}

.subtitle{

    color:#777;

    margin-top:6px;

}

.grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:20px;

    margin-top:25px;

}

.card{

    padding:20px;

    border:1px solid #292929;

    border-radius:18px;

    background:#101010;

}

.card h2{

    margin-top:0;

    font-size:18px;

}

label{

    display:block;

    margin-top:15px;

    margin-bottom:6px;

    color:#aaa;

    font-size:13px;

}

input,
textarea,
select{

    width:100%;

    padding:12px;

    border:1px solid #292929;

    border-radius:10px;

    outline:none;

    background:#080808;

    color:white;

}

textarea{

    min-height:100px;

    resize:vertical;

}

input:focus,
textarea:focus,
select:focus{

    border-color:#666;

}

input[readonly]{

    color:#777;

    cursor:not-allowed;

}

button{

    width:100%;

    margin-top:20px;

    padding:14px;

    border:0;

    border-radius:11px;

    background:white;

    color:black;

    font-weight:bold;

    cursor:pointer;

}

button:disabled{

    opacity:.5;

    cursor:not-allowed;

}

.message{

    margin-top:15px;

    text-align:center;

    color:#888;

}

.success{

    color:#70ff9b;

}

.error{

    color:#ff7070;

}

.preview{

    position:sticky;

    top:20px;

}

.preview-box{

    padding:30px 20px;

    text-align:center;

    border-radius:20px;

    background:
        radial-gradient(
            circle at top,
            #292929,
            #080808 70%
        );

    border:1px solid #292929;

    overflow:hidden;

}

.avatar{

    width:100px;

    height:100px;

    margin:auto;

    border-radius:50%;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#222;

    border:3px solid white;

    font-size:35px;

    font-weight:bold;

}

.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.preview-name{

    margin-top:17px;

    font-size:25px;

    font-weight:bold;

}

.preview-username{

    margin-top:5px;

    color:#888;

}

.preview-bio{

    margin-top:15px;

    color:#aaa;

    line-height:1.5;

}

.preview-links{

    display:flex;

    flex-direction:column;

    gap:8px;

    margin-top:20px;

}

.preview-link{

    padding:10px;

    border-radius:9px;

    background:#151515;

    color:white;

    text-decoration:none;

}

@media(max-width:750px){

    .grid{

        grid-template-columns:1fr;

    }

    .preview{

        position:static;

    }

}

</style>

</head>


<body>


<div class="container">

    <h1>NØX Editor</h1>

    <div class="subtitle">
        Personaliza tu perfil
    </div>


    <div class="grid">


        <!-- =========================
             EDITOR
        ========================== -->

        <section class="card">

            <h2>⚙️ Perfil</h2>


            <label>
                Username
            </label>

            <input
                id="username"
                readonly
            >


            <label>
                Apodo
            </label>

            <input
                id="displayName"
                placeholder="Tu apodo"
            >


            <label>
                Biografía
            </label>

            <textarea
                id="bio"
                placeholder="Escribe algo sobre ti..."
            ></textarea>


            <label>
                Avatar URL
            </label>

            <input
                id="avatarUrl"
                placeholder="https://..."
            >


            <h2 style="margin-top:25px">
                🎨 Apariencia
            </h2>


            <label>
                Fondo URL
            </label>

            <input
                id="backgroundUrl"
                placeholder="https://..."
            >


            <label>
                Tipo de fondo
            </label>

            <select id="backgroundType">

                <option value="image">
                    Imagen
                </option>

                <option value="video">
                    Video
                </option>

            </select>


            <label>
                Música URL
            </label>

            <input
                id="musicUrl"
                placeholder="https://..."
            >


            <h2 style="margin-top:25px">
                🔗 Redes
            </h2>


            <label>
                Discord
            </label>

            <input
                id="discord"
                placeholder="discord.gg/..."
            >


            <label>
                YouTube
            </label>

            <input
                id="youtube"
                placeholder="youtube.com/..."
            >


            <label>
                GitHub
            </label>

            <input
                id="github"
                placeholder="github.com/..."
            >


            <label>
                Instagram
            </label>

            <input
                id="instagram"
                placeholder="instagram.com/..."
            >


            <label>
                TikTok
            </label>

            <input
                id="tiktok"
                placeholder="tiktok.com/@..."
            >


            <label>
                Spotify
            </label>

            <input
                id="spotify"
                placeholder="open.spotify.com/..."
            >


            <button id="saveButton">
                Guardar cambios
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </section>


        <!-- =========================
             PREVIEW
        ========================== -->

        <section class="card preview">

            <h2>
                👁️ Vista previa
            </h2>


            <div class="preview-box">

                <div
                    id="previewAvatar"
                    class="avatar"
                >
                    N
                </div>


                <div
                    id="previewName"
                    class="preview-name"
                >
                    NØX User
                </div>


                <div
                    id="previewUsername"
                    class="preview-username"
                >
                    @username
                </div>


                <div
                    id="previewBio"
                    class="preview-bio"
                >
                    Welcome to my NØX profile.
                </div>


                <div
                    id="previewLinks"
                    class="preview-links"
                ></div>

            </div>

        </section>

    </div>

</div>


<!-- =================================
     SUPABASE
================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =================================
   CONFIGURACIÓN
================================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   ELEMENTOS
================================= */

const usernameInput =
document.getElementById(
    "username"
);

const displayNameInput =
document.getElementById(
    "displayName"
);

const bioInput =
document.getElementById(
    "bio"
);

const avatarInput =
document.getElementById(
    "avatarUrl"
);

const backgroundInput =
document.getElementById(
    "backgroundUrl"
);

const backgroundTypeInput =
document.getElementById(
    "backgroundType"
);

const musicInput =
document.getElementById(
    "musicUrl"
);

const discordInput =
document.getElementById(
    "discord"
);

const youtubeInput =
document.getElementById(
    "youtube"
);

const githubInput =
document.getElementById(
    "github"
);

const instagramInput =
document.getElementById(
    "instagram"
);

const tiktokInput =
document.getElementById(
    "tiktok"
);

const spotifyInput =
document.getElementById(
    "spotify"
);

const saveButton =
document.getElementById(
    "saveButton"
);

const message =
document.getElementById(
    "message"
);


/* PREVIEW */

const previewAvatar =
document.getElementById(
    "previewAvatar"
);

const previewName =
document.getElementById(
    "previewName"
);

const previewUsername =
document.getElementById(
    "previewUsername"
);

const previewBio =
document.getElementById(
    "previewBio"
);

const previewLinks =
document.getElementById(
    "previewLinks"
);


let currentUser = null;


/* =================================
   CARGAR PERFIL
================================= */

async function loadProfile(){

    message.textContent =
        "Cargando...";


    const {
        data,
        error
    } =
    await supabase.auth.getUser();


    if(error){

        showError(
            error.message
        );

        return;
    }


    if(!data.user){

        message.textContent =
            "❌ Debes iniciar sesión.";

        return;
    }


    currentUser =
        data.user;


    const result =
        await supabase
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


    if(result.error){

        showError(
            result.error.message
        );

        return;
    }


    if(!result.data){

        message.textContent =
            "❌ No se encontró tu perfil.";

        return;
    }


    const profile =
        result.data;


    /* ==========================
       DATOS
    ========================== */


    /*
       USERNAME BLOQUEADO
    */

    usernameInput.value =
        profile.username || "";


    usernameInput.readOnly =
        true;


    displayNameInput.value =
        profile.display_name || "";


    bioInput.value =
        profile.bio || "";


    avatarInput.value =
        profile.avatar_url || "";


    backgroundInput.value =
        profile.background_url || "";


    backgroundTypeInput.value =
        profile.background_type ||
        "image";


    musicInput.value =
        profile.music_url || "";


    discordInput.value =
        profile.discord || "";


    youtubeInput.value =
        profile.youtube || "";


    githubInput.value =
        profile.github || "";


    instagramInput.value =
        profile.instagram || "";


    tiktokInput.value =
        profile.tiktok || "";


    spotifyInput.value =
        profile.spotify || "";


    updatePreview();


    message.textContent =
        "";

}


/* =================================
   PREVIEW
================================= */

function updatePreview(){

    const username =
        usernameInput.value.trim();


    const displayName =
        displayNameInput.value.trim();


    const bio =
        bioInput.value.trim();


    const avatar =
        avatarInput.value.trim();


    previewName.textContent =
        displayName ||
        username ||
        "NØX User";


    previewUsername.textContent =
        "@" +
        (
            username ||
            "username"
        );


    previewBio.textContent =
        bio ||
        "Welcome to my NØX profile.";


    /* AVATAR */

    previewAvatar.innerHTML =
        "";


    if(avatar){

        const img =
            document.createElement(
                "img"
            );


        img.src =
            avatar;


        img.onerror =
            function(){

                previewAvatar.textContent =
                    firstLetter(
                        displayName ||
                        username
                    );

            };


        previewAvatar.appendChild(
            img
        );

    }else{

        previewAvatar.textContent =
            firstLetter(
                displayName ||
                username
            );

    }


    /* LINKS */

    previewLinks.innerHTML =
        "";


    addPreviewLink(
        discordInput.value.trim(),
        "Discord"
    );


    addPreviewLink(
        youtubeInput.value.trim(),
        "YouTube"
    );


    addPreviewLink(
        githubInput.value.trim(),
        "GitHub"
    );


    addPreviewLink(
        instagramInput.value.trim(),
        "Instagram"
    );


    addPreviewLink(
        tiktokInput.value.trim(),
        "TikTok"
    );


    addPreviewLink(
        spotifyInput.value.trim(),
        "Spotify"
    );

}


/* =================================
   LINK PREVIEW
================================= */

function addPreviewLink(
    url,
    name
){

    if(!url){
        return;
    }


    const a =
        document.createElement(
            "a"
        );


    a.className =
        "preview-link";


    a.textContent =
        name;


    a.href =
        normalizeUrl(
            url
        );


    a.target =
        "_blank";


    a.rel =
        "noopener noreferrer";


    previewLinks.appendChild(
        a
    );

}


/* =================================
   NORMALIZAR URL
================================= */

function normalizeUrl(
    url
){

    if(
        url.startsWith(
            "http://"
        ) ||
        url.startsWith(
            "https://"
        )
    ){

        return url;

    }


    return "https://" +
        url;

}


/* =================================
   PRIMERA LETRA
================================= */

function firstLetter(
    text
){

    return (
        text ||
        "N"
    )
    .charAt(0)
    .toUpperCase();

}


/* =================================
   LIVE PREVIEW
================================= */

[
    displayNameInput,
    bioInput,
    avatarInput,
    discordInput,
    youtubeInput,
    githubInput,
    instagramInput,
    tiktokInput,
    spotifyInput
]
.forEach(
    function(input){

        input.addEventListener(
            "input",
            updatePreview
        );

    }
);


/* =================================
   GUARDAR
================================= */

saveButton.addEventListener(
    "click",
    async function(){

        if(!currentUser){

            return;
        }


        saveButton.disabled =
            true;


        saveButton.textContent =
            "Guardando...";


        message.className =
            "message";


        message.textContent =
            "Guardando cambios...";


        const updateData = {

            /*
               IMPORTANTE:

               NO incluimos username.
               Por eso el editor no puede
               modificarlo.
            */

            display_name:
                displayNameInput
                    .value
                    .trim(),

            bio:
                bioInput
                    .value
                    .trim(),

            avatar_url:
                avatarInput
                    .value
                    .trim(),

            background_url:
                backgroundInput
                    .value
                    .trim(),

            background_type:
                backgroundTypeInput
                    .value,

            music_url:
                musicInput
                    .value
                    .trim(),

            discord:
                discordInput
                    .value
                    .trim(),

            youtube:
                youtubeInput
                    .value
                    .trim(),

            github:
                githubInput
                    .value
                    .trim(),

            instagram:
                instagramInput
                    .value
                    .trim(),

            tiktok:
                tiktokInput
                    .value
                    .trim(),

            spotify:
                spotifyInput
                    .value
                    .trim()

        };


        const {
            error
        } =
        await supabase
            .from("profiles")
            .update(
                updateData
            )
            .eq(
                "id",
                currentUser.id
            );


        if(error){

            console.error(
                error
            );


            message.className =
                "message error";


            message.textContent =
                "❌ " +
                error.message;


            saveButton.disabled =
                false;


            saveButton.textContent =
                "Guardar cambios";


            return;
        }


        message.className =
            "message success";


        message.textContent =
            "✓ Cambios guardados";


        saveButton.textContent =
            "✓ Guardado";


        setTimeout(
            function(){

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "Guardar cambios";

            },
            1500
        );

    }
);


/* =================================
   ERROR
================================= */

function showError(
    text
){

    message.className =
        "message error";


    message.textContent =
        "❌ " +
        text;
}


/* =================================
   START
================================= */

loadProfile();

</script>

</body>

</html>
