<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Login</title>


<style>

*{
    box-sizing:border-box;
}


html,
body{
    margin:0;
    min-height:100%;
}


body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #252525,
            #090909 45%,
            #020202
        );

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


/* BACKGROUND */

.glow{

    position:fixed;

    width:450px;
    height:450px;

    border-radius:50%;

    background:#fff;

    filter:blur(150px);

    opacity:.05;

    pointer-events:none;

}


.glow.one{

    top:-250px;
    left:-250px;

}


.glow.two{

    right:-250px;
    bottom:-250px;

}


/* CONTAINER */

.auth{

    width:100%;

    max-width:420px;

    position:relative;

}


/* LOGO */

.logo{

    display:block;

    margin-bottom:25px;

    color:#fff;

    text-decoration:none;

    font-size:25px;

    font-weight:950;

    letter-spacing:-1px;

}


/* BOX */

.auth-box{

    padding:35px 28px;

    background:
        rgba(10,10,10,.94);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:22px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.7);

}


h1{

    margin:0;

    font-size:30px;

    letter-spacing:-1px;

}


.subtitle{

    margin-top:8px;

    margin-bottom:28px;

    color:#777;

    font-size:13px;

}


/* LABEL */

label{

    display:block;

    margin:
        17px
        0
        7px;

    color:#aaa;

    font-size:11px;

    font-weight:bold;

}


/* INPUT */

input{

    width:100%;

    padding:14px;

    background:#111;

    color:#fff;

    border:
        1px solid
        #292929;

    border-radius:9px;

    outline:none;

    font-size:14px;

    transition:.2s;

}


input:focus{

    border-color:#666;

    background:#151515;

}


/* LOGIN BUTTON */

#loginButton{

    width:100%;

    margin-top:22px;

    padding:15px;

    border:0;

    border-radius:9px;

    background:#fff;

    color:#050505;

    font-weight:900;

    cursor:pointer;

    transition:.2s;

}


#loginButton:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 30px
        rgba(255,255,255,.12);

}


#loginButton:disabled{

    opacity:.5;

    cursor:not-allowed;

    transform:none;

}


/* MESSAGE */

#message{

    min-height:20px;

    margin-top:17px;

    text-align:center;

    color:#777;

    font-size:12px;

    line-height:1.5;

}


.success{

    color:#65ff91 !important;

}


.error{

    color:#ff6565 !important;

}


/* REGISTER */

.register{

    margin-top:25px;

    color:#666;

    text-align:center;

    font-size:12px;

}


.register a{

    color:#fff;

    font-weight:bold;

    text-decoration:none;

}


@media(max-width:500px){

    .auth-box{

        padding:30px 20px;

    }

    h1{

        font-size:26px;

    }

}

</style>

</head>


<body>


<div class="glow one"></div>

<div class="glow two"></div>


<main class="auth">


<a
    href="index.html"
    class="logo"
>
    NØX
</a>


<section class="auth-box">


<h1>
    Welcome back.
</h1>


<p class="subtitle">
    Sign in to your NØX profile.
</p>


<label for="email">
    Email
</label>


<input
    id="email"
    type="email"
    placeholder="you@email.com"
    autocomplete="email"
>


<label for="password">
    Password
</label>


<input
    id="password"
    type="password"
    placeholder="••••••••"
    autocomplete="current-password"
>


<button
    id="loginButton"
    type="button"
>
    Sign in
</button>


<p
    id="message"
>
    Cargando...
</p>


<p class="register">

    Don't have an account?

    <a href="register.html">
        Create one
    </a>

</p>


</section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   CONFIG
========================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* =========================
   ELEMENTS
========================= */

const emailInput =
document.getElementById(
    "email"
);


const passwordInput =
document.getElementById(
    "password"
);


const loginButton =
document.getElementById(
    "loginButton"
);


const message =
document.getElementById(
    "message"
);


/* =========================
   START
========================= */

message.textContent =
"JAVASCRIPT FUNCIONA ✓";


/* =========================
   LOGIN
========================= */

loginButton.onclick =
async function(){

    const email =
    emailInput.value.trim();


    const password =
    passwordInput.value;


    if(!email){

        showError(
            "Escribe tu email."
        );

        return;

    }


    if(!password){

        showError(
            "Escribe tu contraseña."
        );

        return;

    }


    loginButton.disabled =
    true;


    loginButton.textContent =
    "Signing in...";


    message.className = "";


    message.textContent =
    "Iniciando sesión...";


    try{

        /* CREATE CLIENT */

        const supabase =
        window.supabase.createClient(

            SUPABASE_URL,

            SUPABASE_KEY

        );


        /* LOGIN */

        const {
            data,
            error
        } =
        await supabase.auth
        .signInWithPassword({

            email:
            email,

            password:
            password

        });


        console.log(
            "LOGIN:",
            data,
            error
        );


        /* ERROR */

        if(error){

            showError(
                getErrorMessage(
                    error
                )
            );


            resetButton();

            return;

        }


        /* NO USER */

        if(!data.user){

            showError(
                "No se pudo iniciar sesión."
            );


            resetButton();

            return;

        }


        /* SUCCESS */

        message.className =
        "success";


        message.textContent =
        "✓ Login correcto. Entrando...";


        loginButton.textContent =
        "Success ✓";


        /*
           Redirección.
        */

        setTimeout(
        function(){

            window.location.href =
            "profile.html";

        },
        700
        );

    }


    catch(error){

        console.error(
            error
        );


        showError(
            error.message
        );


        resetButton();

    }

};


/* =========================
   ENTER
========================= */

emailInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            loginButton.click();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            loginButton.click();

        }

    }
);


/* =========================
   ERROR
========================= */

function getErrorMessage(
    error
){

    const text =
    String(
        error.message ||
        ""
    ).toLowerCase();


    if(
        text.includes(
            "invalid login credentials"
        )
    ){

        return (
            "Email o contraseña incorrectos."
        );

    }


    if(
        text.includes(
            "email not confirmed"
        )
    ){

        return (
            "Debes confirmar tu email antes de iniciar sesión."
        );

    }


    if(
        text.includes(
            "rate limit"
        )
    ){

        return (
            "Demasiados intentos. Espera un momento y vuelve a intentarlo."
        );

    }


    return (
        error.message ||
        "Error iniciando sesión."
    );

}


/* =========================
   SHOW ERROR
========================= */

function showError(
    text
){

    message.className =
    "error";


    message.textContent =
    "❌ " +
    text;

}


/* =========================
   RESET
========================= */

function resetButton(){

    loginButton.disabled =
    false;


    loginButton.textContent =
    "Sign in";

}

</script>


</body>

</html>
