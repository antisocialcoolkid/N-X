<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Login</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:#050505;

    color:white;

    font-family:Arial,sans-serif;

}

.card{

    width:100%;

    max-width:400px;

    padding:30px;

    background:#101010;

    border:1px solid #292929;

    border-radius:20px;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.5);

}

.logo{

    text-align:center;

    font-size:32px;

    font-weight:900;

    letter-spacing:3px;

}

.subtitle{

    margin-top:8px;

    text-align:center;

    color:#777;

}

label{

    display:block;

    margin-top:20px;

    margin-bottom:7px;

    color:#aaa;

    font-size:13px;

}

input{

    width:100%;

    padding:13px;

    border-radius:10px;

    border:1px solid #292929;

    outline:none;

    background:#080808;

    color:white;

}

input:focus{

    border-color:#666;

}

button{

    width:100%;

    margin-top:22px;

    padding:14px;

    border:0;

    border-radius:10px;

    background:white;

    color:black;

    font-weight:bold;

    cursor:pointer;

}

button:disabled{

    opacity:.5;

    cursor:not-allowed;

}

.message{

    margin-top:15px;

    text-align:center;

    white-space:pre-wrap;

    font-size:14px;

}

.error{

    color:#ff7070;

}

.success{

    color:#70ff9b;

}

.register{

    margin-top:20px;

    text-align:center;

    color:#777;

    font-size:14px;

}

.register a{

    color:white;

    text-decoration:none;

}

</style>

</head>


<body>


<div class="card">


    <div class="logo">
        NØX
    </div>


    <div class="subtitle">
        Inicia sesión
    </div>


    <form id="loginForm">


        <label for="email">
            Email
        </label>


        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="tu@email.com"
            required
        >


        <label for="password">
            Contraseña
        </label>


        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
        >


        <button
            id="loginButton"
            type="submit"
        >
            Iniciar sesión
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="register">

        ¿No tienes cuenta?

        <a href="register.html">
            Crear cuenta
        </a>

    </div>


</div>


<!-- =================================
     SUPABASE
================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =================================
   CONFIGURACIÓN
   PRIMERO DECLARAMOS LAS VARIABLES
================================= */

const SUPABASE_URL =
    "https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* =================================
   CREAR CLIENTE
   DESPUÉS DE LAS VARIABLES
================================= */

if(
    typeof window.supabase ===
    "undefined"
){

    document.getElementById(
        "message"
    ).textContent =
        "❌ No se pudo cargar Supabase.";

    throw new Error(
        "Supabase JS no está disponible."
    );
}


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =================================
   ELEMENTOS
================================= */

const form =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


/* =================================
   LOGIN
================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(
            !email ||
            !password
        ){

            message.className =
                "message error";


            message.textContent =
                "❌ Completa todos los campos.";


            return;
        }


        loginButton.disabled =
            true;


        loginButton.textContent =
            "Iniciando sesión...";


        message.className =
            "message";


        message.textContent =
            "Conectando con NØX...";


        try{

            const result =
                await supabase.auth
                    .signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


            if(result.error){

                console.error(
                    result.error
                );


                message.className =
                    "message error";


                message.textContent =
                    "❌ " +
                    result.error.message;


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "Iniciar sesión";


                return;
            }


            if(
                !result.data ||
                !result.data.user
            ){

                throw new Error(
                    "Supabase no devolvió el usuario."
                );

            }


            message.className =
                "message success";


            message.textContent =
                "✓ Inicio de sesión correcto.\n\n" +
                "Entrando al editor...";


            setTimeout(
                function(){

                    window.location.href =
                        "editor.html";

                },
                700
            );


        }catch(error){

            console.error(
                error
            );


            message.className =
                "message error";


            message.textContent =
                "❌ ERROR GENERAL\n\n" +
                (
                    error.message ||
                    "Error desconocido."
                );


            loginButton.disabled =
                false;


            loginButton.textContent =
                "Iniciar sesión";

        }

    }
);

</script>

</body>

</html>
