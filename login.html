<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Perfil</title>


<style>

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    min-height:100%;

}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:#050505;

    color:white;

    font-family:Arial,sans-serif;

}


#app{

    width:100%;

    max-width:480px;

    padding:30px;

    border:1px solid #292929;

    border-radius:22px;

    background:#101010;

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.6);

}


#status{

    text-align:center;

    color:#aaa;

    white-space:pre-wrap;

    line-height:1.6;

}


#error{

    display:none;

    margin-top:15px;

    padding:15px;

    border-radius:10px;

    background:#190909;

    color:#ff7070;

    white-space:pre-wrap;

}


#profile{

    display:none;

    text-align:center;

}


#avatar{

    width:110px;

    height:110px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    border:3px solid white;

    background:#222;

    font-size:38px;

    font-weight:bold;

}


#avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}


#name{

    margin-top:18px;

    font-size:28px;

    font-weight:800;

}


#username{

    margin-top:5px;

    color:#888;

}


#bio{

    margin-top:18px;

    color:#aaa;

    line-height:1.5;

}


#views{

    margin-top:15px;

    color:#777;

}


#links{

    display:flex;

    flex-direction:column;

    gap:10px;

    margin-top:22px;

}


.link{

    display:block;

    padding:13px;

    border-radius:10px;

    border:1px solid #292929;

    background:#151515;

    color:white;

    text-decoration:none;

}


.link:hover{

    background:#202020;

}


</style>

</head>


<body>


<div id="app">


    <div id="status">

        NØX — iniciando...

    </div>


    <div id="error"></div>


    <div id="profile">


        <div id="avatar">

            N

        </div>


        <div id="name"></div>


        <div id="username"></div>


        <div id="bio"></div>


        <div id="views"></div>


        <div id="links"></div>


    </div>


</div>


<!-- =====================================
     SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =================================================
   IMPORTANTE:
   LAS CONSTANTES VAN PRIMERO
================================================= */


const SUPABASE_URL =
    "https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* =================================================
   ELEMENTOS
================================================= */


const statusElement =
    document.getElementById(
        "status"
    );


const errorElement =
    document.getElementById(
        "error"
    );


const profileElement =
    document.getElementById(
        "profile"
    );


const avatarElement =
    document.getElementById(
        "avatar"
    );


const nameElement =
    document.getElementById(
        "name"
    );


const usernameElement =
    document.getElementById(
        "username"
    );


const bioElement =
    document.getElementById(
        "bio"
    );


const viewsElement =
    document.getElementById(
        "views"
    );


const linksElement =
    document.getElementById(
        "links"
    );


/* =================================================
   ERROR
================================================= */


function showError(message){

    statusElement.style.display =
        "none";


    profileElement.style.display =
        "none";


    errorElement.style.display =
        "block";


    errorElement.textContent =
        message;

}


/* =================================================
   INICIAR SUPABASE
================================================= */


async function start(){

    try{


        statusElement.textContent =
            "NØX — conectando con Supabase...";


        if(
            typeof window.supabase ===
            "undefined"
        ){

            showError(
                "❌ Supabase JS no cargó."
            );

            return;

        }


        const client =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        statusElement.textContent =
            "NØX — leyendo perfil...";


        /* =================================================
           USERNAME DE LA URL
        ================================================= */


        const params =
            new URLSearchParams(
                window.location.search
            );


        const username =
            params
                .get("username");


        if(!username){

            showError(
                "❌ La URL no tiene ?username=...\n\n" +

                "Ejemplo:\n" +

                "u.html?username=pan"
            );

            return;

        }


        const cleanUsername =
            username
                .trim()
                .toLowerCase();


        statusElement.textContent =
            "NØX — buscando @" +
            cleanUsername +
            "...";


        /* =================================================
           BUSCAR PERFIL
        ================================================= */


        const result =
            await client
                .from("profiles")
                .select("*")
                .eq(
                    "username",
                    cleanUsername
                )
                .maybeSingle();


        if(result.error){

            showError(
                "❌ ERROR SUPABASE\n\n" +
                result.error.message
            );

            return;

        }


        if(!result.data){

            showError(
                "❌ PERFIL NO ENCONTRADO\n\n" +
                "@" +
                cleanUsername
            );

            return;

        }


        const data =
            result.data;


        /* =================================================
           NOMBRE
        ================================================= */


        nameElement.textContent =
            data.display_name ||
            data.username ||
            "NØX User";


        /* =================================================
           USERNAME
        ================================================= */


        usernameElement.textContent =
            "@" +
            data.username;


        /* =================================================
           BIO
        ================================================= */


        bioElement.textContent =
            data.bio ||
            "Welcome to my NØX profile.";


        /* =================================================
           VISTAS
        ================================================= */


        const oldViews =
            Number(
                data.profile_views || 0
            );


        viewsElement.textContent =
            "👁️ " +
            oldViews +
            (
                oldViews === 1
                ? " vista"
                : " vistas"
            );


        /* =================================================
           AVATAR
        ================================================= */


        if(data.avatar_url){

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                data.avatar_url;


            img.alt =
                "Avatar";


            img.onerror =
                function(){

                    avatarElement.textContent =
                        getFirstLetter(
                            data.username
                        );

                };


            avatarElement.innerHTML =
                "";


            avatarElement.appendChild(
                img
            );

        }else{

            avatarElement.textContent =
                getFirstLetter(
                    data.username
                );

        }


        /* =================================================
           REDES
        ================================================= */


        linksElement.innerHTML =
            "";


        addLink(
            data.discord,
            "Discord"
        );


        addLink(
            data.youtube,
            "YouTube"
        );


        addLink(
            data.github,
            "GitHub"
        );


        addLink(
            data.instagram,
            "Instagram"
        );


        addLink(
            data.tiktok,
            "TikTok"
        );


        addLink(
            data.spotify,
            "Spotify"
        );


        /* =================================================
           MOSTRAR PERFIL
        ================================================= */


        statusElement.style.display =
            "none";


        profileElement.style.display =
            "block";


        /* =================================================
           SUMAR VISTA
        ================================================= */


        const viewResult =
            await client.rpc(
                "increment_profile_views",
                {
                    profile_uuid:
                        data.id
                }
            );


        if(
            !viewResult.error
        ){

            const newViews =
                oldViews + 1;


            viewsElement.textContent =
                "👁️ " +
                newViews +
                (
                    newViews === 1
                    ? " vista"
                    : " vistas"
                );

        }else{

            console.warn(
                "No se pudo sumar la vista:",
                viewResult.error
            );

        }


    }catch(error){

        console.error(
            error
        );


        showError(
            "❌ ERROR GENERAL\n\n" +
            error.message
        );

    }

}


/* =================================================
   PRIMERA LETRA
================================================= */


function getFirstLetter(
    text
){

    return (
        text ||
        "N"
    )
    .charAt(0)
    .toUpperCase();

}


/* =================================================
   LINKS
================================================= */


function addLink(
    url,
    name
){

    if(!url){

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.className =
        "link";


    link.textContent =
        name +
        " ↗";


    if(
        url.startsWith("http://") ||
        url.startsWith("https://")
    ){

        link.href =
            url;

    }else{

        link.href =
            "https://" +
            url;

    }


    link.target =
        "_blank";


    link.rel =
        "noopener noreferrer";


    linksElement.appendChild(
        link
    );

}


/* =================================================
   INICIAR
================================================= */


start();

</script>


</body>

</html>
