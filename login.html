
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — Login</title>

<style>

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:90%;
    max-width:400px;
    padding:30px;
    background:#111;
    border:1px solid #292929;
    border-radius:20px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0 15px;
    box-sizing:border-box;
    background:#181818;
    color:white;
    border:1px solid #333;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#message{
    margin-top:15px;
    color:#aaa;
}

</style>

</head>


<body>


<div class="box">

<h1>Welcome back.</h1>

<p>Sign in to your NØX profile.</p>


<label>Email</label>

<input
    id="email"
    type="email"
    autocomplete="email"
>


<label>Password</label>

<input
    id="password"
    type="password"
    autocomplete="current-password"
>


<button
    id="loginButton"
    type="button"
>
    Sign in
</button>


<p id="message">
    JS cargando...
</p>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const message =
document.getElementById(
    "message"
);


const button =
document.getElementById(
    "loginButton"
);


const email =
document.getElementById(
    "email"
);


const password =
document.getElementById(
    "password"
);


message.textContent =
"JAVASCRIPT FUNCIONA ✓";


button.addEventListener(
    "click",
    login
);


async function login(){

    const emailValue =
    email.value.trim();

    const passwordValue =
    password.value;


    if(!emailValue){

        message.textContent =
        "❌ Escribe tu email.";

        return;

    }


    if(!passwordValue){

        message.textContent =
        "❌ Escribe tu contraseña.";

        return;

    }


    button.disabled =
    true;

    button.textContent =
    "Signing in...";


    message.textContent =
    "Conectando con Supabase...";


    try{

        const supabase =
        window.supabase.createClient(

            "https://asgowauvzfnsszstvzqi.supabase.co",

            "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS"

        );


        const result =
        await supabase.auth.signInWithPassword({

            email:
            emailValue,

            password:
            passwordValue

        });


        console.log(
            result
        );


        if(result.error){

            message.textContent =
            "❌ " +
            result.error.message;

            button.disabled =
            false;

            button.textContent =
            "Sign in";

            return;

        }


        message.textContent =
        "✓ Login correcto. Entrando...";


        setTimeout(
            function(){

                window.location.href =
                "profile.html";

            },
            500
        );

    }

    catch(error){

        console.error(
            error
        );


        message.textContent =
        "❌ " +
        error.message;


        button.disabled =
        false;

        button.textContent =
        "Sign in";

    }

}

</script>


</body>

</html>
