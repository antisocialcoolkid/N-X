<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Login</title>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #292929 0%,
            #0b0b0b 42%,
            #020202 100%
        );

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}


/* =========================
   BACKGROUND
========================= */

.bg{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-1;

}

.bg::before{

    content:"";

    position:absolute;

    width:500px;

    height:500px;

    left:-250px;

    top:-250px;

    border-radius:50%;

    background:#fff;

    filter:blur(160px);

    opacity:.06;

}

.bg::after{

    content:"";

    position:absolute;

    width:500px;

    height:500px;

    right:-250px;

    bottom:-250px;

    border-radius:50%;

    background:#fff;

    filter:blur(160px);

    opacity:.05;

}


/* =========================
   AUTH
========================= */

.auth{

    width:100%;

    max-width:430px;

}


/* =========================
   LOGO
========================= */

.logo{

    display:inline-block;

    margin-bottom:22px;

    color:#fff;

    text-decoration:none;

    font-size:26px;

    font-weight:900;

    letter-spacing:-1px;

}


/* =========================
   CARD
========================= */

.card{

    width:100%;

    padding:35px 30px;

    background:
        rgba(10,10,10,.94);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:22px;

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.7);

}


/* =========================
   TITLE
========================= */

h1{

    margin:0;

    font-size:31px;

    letter-spacing:-1.2px;

}

.subtitle{

    margin:
        8px
        0
        28px;

    color:#777;

    font-size:13px;

}


/* =========================
   LABEL
========================= */

label{

    display:block;

    margin:
        16px
        0
        7px;

    color:#aaa;

    font-size:11px;

    font-weight:800;

}


/* =========================
   INPUT
========================= */

input{

    width:100%;

    height:50px;

    padding:
        0
        14px;

    background:#151515;

    border:
        1px solid
        #292929;

    border-radius:9px;

    color:#fff;

    outline:none;

    font-size:14px;

    transition:
        border-color .2s,
        background .2s;

}

input:focus{

    background:#181818;

    border-color:#666;

}

input::placeholder{

    color:#555;

}


/* =========================
   BUTTON
========================= */

#loginButton{

    width:100%;

    height:50px;

    margin-top:22px;

    border:0;

    border-radius:9px;

    background:#fff;

    color:#050505;

    font-size:13px;

    font-weight:900;

    cursor:pointer;

    transition:
        transform .2s,
        box-shadow .2s,
        opacity .2s;

}

#loginButton:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 35px
        rgba(255,255,255,.12);

}

#loginButton:active{

    transform:
        translateY(0);

}

#loginButton:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* =========================
   MESSAGE
========================= */

#message{

    min-height:20px;

    margin:
        16px
        0
        0;

    text-align:center;

    color:#777;

    font-size:12px;

    line-height:1.5;

}

.success{

    color:#64ff91 !important;

}

.error{

    color:#ff6565 !important;

}


/* =========================
   REGISTER
========================= */

.register{

    margin:
        25px
        0
        0;

    text-align:center;

    color:#666;

    font-size:12px;

}

.register a{

    color:#fff;

    text-decoration:none;

    font-weight:700;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    body{

        padding:15px;

    }

    .card{

        padding:
            30px
            20px;

    }

    h1{

        font-size:27px;

    }

}

</style>

</head>


<body>


<div class="bg"></div>


<main class="auth">


<a
    href="index.html"
    class="logo"
>
    NØX
</a>


<section class="card">


<h1>
    Welcome back.
</h1>


<p class="subtitle">
    Sign in to your NØX profile.
</p>


<label for="email">
    Email
</label>


<input
    id="email"
    type="email"
    placeholder="you@email.com"
    autocomplete="email"
>


<label for="password">
    Password
</label>


<input
    id="password"
    type="password"
    placeholder="••••••••"
    autocomplete="current-password"
>


<button
    id="loginButton"
    type="button"
>
    Sign in
</button>


<p
    id="message"
>
    Preparando NØX...
</p>


<p class="register">

    Don't have an account?

    <a href="register.html">
        Create one
    </a>

</p>


</section>

</main>


<!-- =========================
     SUPABASE
========================= -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================
   CONFIG
========================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* =========================
   ELEMENTS
========================= */

const emailInput =
document.getElementById(
    "email"
);

const passwordInput =
document.getElementById(
    "password"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const message =
document.getElementById(
    "message"
);


/* =========================
   SUPABASE CLIENT
========================= */

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   READY
========================= */

message.textContent =
"JAVASCRIPT FUNCIONA ✓";


/* =========================
   LOGIN CLICK
========================= */

loginButton.addEventListener(
    "click",
    login
);


/* =========================
   ENTER
========================= */

emailInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            login();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            login();

        }

    }
);


/* =========================
   LOGIN
========================= */

async function login(){

    const email =
    emailInput.value.trim();

    const password =
    passwordInput.value;


    /* VALIDATION */

    if(!email){

        showError(
            "Escribe tu email."
        );

        return;

    }


    if(!password){

        showError(
            "Escribe tu contraseña."
        );

        return;

    }


    /* LOADING */

    loginButton.disabled =
    true;

    loginButton.textContent =
    "Signing in...";

    message.className = "";

    message.textContent =
    "Conectando con NØX...";


    try{

        console.log(
            "NØX LOGIN START"
        );


        /* =========================
           SUPABASE LOGIN
        ========================= */

        const {
            data,
            error
        } =
        await supabase.auth
        .signInWithPassword({

            email:
            email,

            password:
            password

        });


        console.log(
            "NØX LOGIN RESULT",
            data,
            error
        );


        /* =========================
           ERROR
        ========================= */

        if(error){

            showError(
                error.message
            );


            resetButton();

            return;

        }


        /* =========================
           CHECK SESSION
        ========================= */

        const {
            data: sessionData,
            error: sessionError
        } =
        await supabase.auth
        .getSession();


        if(sessionError){

            showError(
                sessionError.message
            );


            resetButton();

            return;

        }


        if(
            !sessionData ||
            !sessionData.session
        ){

            showError(
                "La sesión no se creó."
            );


            resetButton();

            return;

        }


        /* =========================
           SUCCESS
        ========================= */

        message.className =
        "success";

        message.textContent =
        "✓ Login correcto.";


        loginButton.textContent =
        "Entrando...";


        /* =========================
           REDIRECT
        ========================= */

        setTimeout(
        function(){

            window.location.href =
            "profile.html";

        },
        700
        );

    }


    catch(error){

        console.error(
            "NØX LOGIN ERROR",
            error
        );


        showError(
            error.message ||
            "Error desconocido."
        );


        resetButton();

    }

}


/* =========================
   ERROR
========================= */

function showError(
    text
){

    message.className =
    "error";

    message.textContent =
    "❌ " +
    text;

}


/* =========================
   RESET
========================= */

function resetButton(){

    loginButton.disabled =
    false;

    loginButton.textContent =
    "Sign in";

}

</script>


</body>

</html>
