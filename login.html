<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — Login</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

.login{
    width:92%;
    max-width:400px;
    padding:30px;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:18px;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:25px;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#aaa;
    font-size:12px;
}

input{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #292929;
    background:#151515;
    color:white;
    outline:none;
}

input:focus{
    border-color:#666;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:9px;
    background:white;
    color:black;
    font-weight:900;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

#message{
    margin-top:15px;
    text-align:center;
    font-size:13px;
    line-height:1.5;
}

.error{
    color:#ff6565;
}

.success{
    color:#5cff8d;
}

</style>

</head>

<body>

<div class="login">

    <div class="logo">
        NØX
    </div>

    <div class="subtitle">
        Inicia sesión en tu cuenta
    </div>


    <form id="loginForm">

        <label for="email">
            Correo electrónico
        </label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="tu@email.com"
            required
        >


        <label for="password">
            Contraseña
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
        >


        <button
            id="loginButton"
            type="submit"
        >
            Iniciar sesión
        </button>

    </form>


    <div id="message"></div>

</div>


<!-- SUPABASE DEBE CARGARSE ANTES DEL CÓDIGO DEL LOGIN -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   ELEMENTOS
================================= */

const form =
document.getElementById(
    "loginForm"
);

const emailInput =
document.getElementById(
    "email"
);

const passwordInput =
document.getElementById(
    "password"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const message =
document.getElementById(
    "message"
);


/* =================================
   MENSAJE
================================= */

function showMessage(
    text,
    type
){

    message.className =
    type || "";

    message.textContent =
    text;

}


/* =================================
   LOGIN
================================= */

form.addEventListener(
    "submit",
    async function(event){

        /*
           EVITA QUE EL FORMULARIO
           RECARGUE LA PÁGINA
        */

        event.preventDefault();


        const email =
        emailInput.value.trim();


        const password =
        passwordInput.value;


        if(!email){

            showMessage(
                "❌ Escribe tu correo.",
                "error"
            );

            return;

        }


        if(!password){

            showMessage(
                "❌ Escribe tu contraseña.",
                "error"
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "Iniciando sesión...";


        showMessage(
            "Comprobando cuenta..."
        );


        try{

            const {
                data,
                error
            } =
            await supabase.auth.signInWithPassword({

                email:email,

                password:password

            });


            if(error){

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                showMessage(
                    "❌ " +
                    getLoginError(
                        error
                    ),
                    "error"
                );


                loginButton.disabled =
                false;

                loginButton.textContent =
                "Iniciar sesión";

                return;

            }


            if(
                !data ||
                !data.user
            ){

                showMessage(
                    "❌ No se pudo iniciar sesión.",
                    "error"
                );


                loginButton.disabled =
                false;

                loginButton.textContent =
                "Iniciar sesión";

                return;

            }


            showMessage(
                "✓ Sesión iniciada. Entrando a NØX...",
                "success"
            );


            /*
               IMPORTANTE:
               NO usamos ?username=
               aquí.

               El username se obtiene
               posteriormente desde Supabase.
            */

            setTimeout(
                function(){

                    window.location.href =
                    "profile.html";

                },
                500
            );

        }

        catch(error){

            console.error(
                error
            );


            showMessage(
                "❌ Error inesperado: " +
                error.message,
                "error"
            );


            loginButton.disabled =
            false;

            loginButton.textContent =
            "Iniciar sesión";

        }

    }
);


/* =================================
   ERRORES MÁS CLAROS
================================= */

function getLoginError(
    error
){

    const message =
    String(
        error.message ||
        ""
    ).toLowerCase();


    if(
        message.includes(
            "invalid login credentials"
        )
    ){

        return "Correo o contraseña incorrectos.";

    }


    if(
        message.includes(
            "email not confirmed"
        )
    ){

        return "Tu correo todavía no está confirmado.";

    }


    if(
        message.includes(
            "rate limit"
        )
    ){

        return "Demasiados intentos. Espera un momento.";

    }


    return (
        error.message ||
        "No se pudo iniciar sesión."
    );

}


/* =================================
   COMPROBAR SESIÓN AL ABRIR
================================= */

async function checkExistingSession(){

    try{

        const {
            data
        } =
        await supabase.auth.getSession();


        if(
            data &&
            data.session
        ){

            /*
               Ya está conectado.
               Lo mandamos directamente
               al editor.
            */

            window.location.href =
            "profile.html";

        }

    }

    catch(error){

        console.error(
            error
        );

    }

}


checkExistingSession();

</script>

</body>
</html>
