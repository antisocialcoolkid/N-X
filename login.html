<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — Editor</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    padding:20px;
    border-bottom:1px solid #222;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.logout{
    border:1px solid #333;
    background:#111;
    color:#fff;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
}

.container{
    width:94%;
    max-width:1100px;
    margin:30px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    background:#0d0d0d;
    border:1px solid #252525;
    border-radius:18px;
    padding:25px;
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:16px;
    margin-bottom:7px;
    color:#aaa;
    font-size:13px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #292929;
    background:#151515;
    color:#fff;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#666;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 16px;
    cursor:pointer;
    font-weight:bold;
}

.save{
    width:100%;
    margin-top:22px;
    background:#fff;
    color:#000;
}

.save:disabled{
    opacity:.5;
}

.generate{
    width:100%;
    margin-top:10px;
    background:#1b1b1b;
    color:#fff;
    border:1px solid #333;
}

.preview{
    min-height:450px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.preview-box{
    width:100%;
    max-width:400px;
    padding:30px 20px;
    text-align:center;
    border-radius:22px;
    background:#111;
    border:1px solid #292929;
}

.avatar{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:18px;
    font-size:27px;
    font-weight:900;
}

.username{
    margin-top:5px;
    color:#777;
    font-size:13px;
}

.bio{
    margin-top:18px;
    color:#aaa;
    line-height:1.5;
}

.links{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:20px;
}

.preview-link{
    padding:10px;
    background:#181818;
    border:1px solid #292929;
    border-radius:9px;
    color:#fff;
    text-decoration:none;
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:13px;
}

.success{
    color:#55ff88;
}

.error{
    color:#ff6666;
}

.url-box{
    margin-top:15px;
    padding:12px;
    background:#080808;
    border:1px solid #222;
    border-radius:8px;
    word-break:break-all;
    color:#aaa;
    font-size:12px;
}

@media(max-width:800px){

    .container{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        NØX
    </div>

    <button
        id="logout"
        class="logout">
        Cerrar sesión
    </button>

</header>


<div class="container">

    <!-- EDITOR -->

    <section class="card">

        <h2>
            Personalizar perfil
        </h2>


        <form id="profileForm">

            <label>
                Username
            </label>

            <!-- NO SE PUEDE CAMBIAR -->

            <input
                id="username"
                type="text"
                disabled
            >


            <label>
                Apodo
            </label>

            <input
                id="displayName"
                type="text"
                placeholder="Tu apodo"
            >


            <label>
                Biografía
            </label>

            <textarea
                id="bio"
                placeholder="Escribe tu bio..."
            ></textarea>


            <label>
                URL del avatar
            </label>

            <input
                id="avatarUrl"
                type="url"
                placeholder="https://..."
            >


            <label>
                Discord
            </label>

            <input
                id="discord"
                type="text"
                placeholder="discord.gg/..."
            >


            <label>
                YouTube
            </label>

            <input
                id="youtube"
                type="text"
                placeholder="youtube.com/..."
            >


            <label>
                GitHub
            </label>

            <input
                id="github"
                type="text"
                placeholder="github.com/..."
            >


            <label>
                Instagram
            </label>

            <input
                id="instagram"
                type="text"
                placeholder="instagram.com/..."
            >


            <label>
                TikTok
            </label>

            <input
                id="tiktok"
                type="text"
                placeholder="tiktok.com/@..."
            >


            <label>
                Spotify
            </label>

            <input
                id="spotify"
                type="text"
                placeholder="open.spotify.com/..."
            >


            <label>
                Color principal
            </label>

            <input
                id="accentColor"
                type="color"
                value="#ffffff"
            >


            <button
                id="saveButton"
                class="save"
                type="submit">

                Guardar cambios

            </button>

        </form>


        <button
            id="generateButton"
            class="generate">

            Generar link del perfil

        </button>


        <div
            id="profileUrl"
            class="url-box">

            Guarda tu perfil para generar el link.

        </div>


        <div
            id="message"
            class="message">
        </div>

    </section>


    <!-- PREVIEW -->

    <section class="card preview">

        <div
            id="previewBox"
            class="preview-box">

            <div
                id="previewAvatar"
                class="avatar">

                N

            </div>


            <div
                id="previewName"
                class="name">

                NØX User

            </div>


            <div
                id="previewUsername"
                class="username">

                @username

            </div>


            <div
                id="previewBio"
                class="bio">

                Welcome to my NØX profile.

            </div>


            <div
                id="previewLinks"
                class="links">
            </div>

        </div>

    </section>

</div>


<!-- SUPABASE PRIMERO -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   ELEMENTOS
================================= */

const form =
document.getElementById(
    "profileForm"
);

const usernameInput =
document.getElementById(
    "username"
);

const displayNameInput =
document.getElementById(
    "displayName"
);

const bioInput =
document.getElementById(
    "bio"
);

const avatarInput =
document.getElementById(
    "avatarUrl"
);

const discordInput =
document.getElementById(
    "discord"
);

const youtubeInput =
document.getElementById(
    "youtube"
);

const githubInput =
document.getElementById(
    "github"
);

const instagramInput =
document.getElementById(
    "instagram"
);

const tiktokInput =
document.getElementById(
    "tiktok"
);

const spotifyInput =
document.getElementById(
    "spotify"
);

const accentColorInput =
document.getElementById(
    "accentColor"
);

const saveButton =
document.getElementById(
    "saveButton"
);

const generateButton =
document.getElementById(
    "generateButton"
);

const profileUrl =
document.getElementById(
    "profileUrl"
);

const message =
document.getElementById(
    "message"
);

const logout =
document.getElementById(
    "logout"
);


/* PREVIEW */

const previewBox =
document.getElementById(
    "previewBox"
);

const previewAvatar =
document.getElementById(
    "previewAvatar"
);

const previewName =
document.getElementById(
    "previewName"
);

const previewUsername =
document.getElementById(
    "previewUsername"
);

const previewBio =
document.getElementById(
    "previewBio"
);

const previewLinks =
document.getElementById(
    "previewLinks"
);


let currentUser = null;


/* =================================
   CARGAR USUARIO
================================= */

async function loadProfile(){

    message.textContent =
    "Cargando editor...";


    const {
        data,
        error
    } =
    await supabase.auth.getUser();


    if(error){

        console.error(error);

        showError(
            error.message
        );

        return;

    }


    if(!data.user){

        window.location.href =
        "login.html";

        return;

    }


    currentUser =
    data.user;


    console.log(
        "USUARIO:",
        currentUser.id
    );


    /*
       IMPORTANTE:

       Aquí NO usamos:

       ?username=

       El usuario se identifica
       mediante su sesión.
    */


    const {
        data:profile,
        error:profileError
    } =
    await supabase
    .from("profiles")
    .select("*")
    .eq(
        "id",
        currentUser.id
    )
    .maybeSingle();


    if(profileError){

        console.error(
            profileError
        );

        showError(
            profileError.message
        );

        return;

    }


    if(!profile){

        showError(
            "❌ No se encontró tu perfil en Supabase."
        );

        return;

    }


    /*
       USERNAME NO EDITABLE
    */

    usernameInput.value =
    profile.username ||
    "";


    displayNameInput.value =
    profile.display_name ||
    "";


    bioInput.value =
    profile.bio ||
    "";


    avatarInput.value =
    profile.avatar_url ||
    "";


    discordInput.value =
    profile.discord ||
    "";


    youtubeInput.value =
    profile.youtube ||
    "";


    githubInput.value =
    profile.github ||
    "";


    instagramInput.value =
    profile.instagram ||
    "";


    tiktokInput.value =
    profile.tiktok ||
    "";


    spotifyInput.value =
    profile.spotify ||
    "";


    if(profile.accent_color){

        accentColorInput.value =
        profile.accent_color;

    }


    updatePreview();


    message.className =
    "message success";

    message.textContent =
    "✓ Editor listo";

}


/* =================================
   PREVIEW
================================= */

function updatePreview(){

    const username =
    usernameInput.value.trim();

    const displayName =
    displayNameInput.value.trim();

    const bio =
    bioInput.value.trim();

    const avatar =
    avatarInput.value.trim();


    previewName.textContent =
    displayName ||
    username ||
    "NØX User";


    /*
       USERNAME SIEMPRE SE MUESTRA
       Y NO SE PUEDE EDITAR
    */

    previewUsername.textContent =
    "@" +
    (
        username ||
        "username"
    );


    previewBio.textContent =
    bio ||
    "Welcome to my NØX profile.";


    /*
       AVATAR
    */

    previewAvatar.innerHTML =
    "";


    if(avatar){

        const img =
        document.createElement(
            "img"
        );


        img.src =
        avatar;


        img.onerror =
        function(){

            previewAvatar.textContent =
            getLetter(
                displayName ||
                username
            );

        };


        previewAvatar.appendChild(
            img
        );

    }else{

        previewAvatar.textContent =
        getLetter(
            displayName ||
            username
        );

    }


    /*
       LINKS
    */

    previewLinks.innerHTML =
    "";


    addPreviewLink(
        discordInput.value.trim(),
        "Discord"
    );

    addPreviewLink(
        youtubeInput.value.trim(),
        "YouTube"
    );

    addPreviewLink(
        githubInput.value.trim(),
        "GitHub"
    );

    addPreviewLink(
        instagramInput.value.trim(),
        "Instagram"
    );

    addPreviewLink(
        tiktokInput.value.trim(),
        "TikTok"
    );

    addPreviewLink(
        spotifyInput.value.trim(),
        "Spotify"
    );


    /*
       COLOR
    */

    previewBox.style.borderColor =
    accentColorInput.value;

}


/* =================================
   LINKS
================================= */

function addPreviewLink(
    url,
    text
){

    if(!url)
        return;


    const a =
    document.createElement(
        "a"
    );


    a.className =
    "preview-link";


    a.textContent =
    text +
    " ↗";


    a.href =
    normalizeUrl(url);


    a.target =
    "_blank";


    a.rel =
    "noopener noreferrer";


    previewLinks.appendChild(
        a
    );

}


function normalizeUrl(
    url
){

    if(
        url.startsWith(
            "http://"
        ) ||
        url.startsWith(
            "https://"
        )
    ){

        return url;

    }


    return "https://" +
    url;

}


/* =================================
   LETRA
================================= */

function getLetter(
    text
){

    return (
        text ||
        "N"
    )
    .charAt(0)
    .toUpperCase();

}


/* =================================
   LIVE PREVIEW
================================= */

[
    displayNameInput,
    bioInput,
    avatarInput,
    discordInput,
    youtubeInput,
    githubInput,
    instagramInput,
    tiktokInput,
    spotifyInput,
    accentColorInput
]
.forEach(
    function(input){

        input.addEventListener(
            "input",
            updatePreview
        );

    }
);


/* =================================
   GUARDAR
================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!currentUser){

            showError(
                "❌ No hay sesión iniciada."
            );

            return;

        }


        const username =
        usernameInput.value
        .trim()
        .toLowerCase();


        if(!username){

            showError(
                "❌ Tu perfil no tiene username."
            );

            return;

        }


        saveButton.disabled =
        true;

        saveButton.textContent =
        "Guardando...";


        message.className =
        "message";

        message.textContent =
        "Guardando cambios...";


        const updateData = {

            display_name:
            displayNameInput.value.trim(),

            bio:
            bioInput.value.trim(),

            avatar_url:
            avatarInput.value.trim(),

            discord:
            discordInput.value.trim(),

            youtube:
            youtubeInput.value.trim(),

            github:
            githubInput.value.trim(),

            instagram:
            instagramInput.value.trim(),

            tiktok:
            tiktokInput.value.trim(),

            spotify:
            spotifyInput.value.trim(),

            accent_color:
            accentColorInput.value

        };


        const {
            error
        } =
        await supabase
        .from("profiles")
        .update(
            updateData
        )
        .eq(
            "id",
            currentUser.id
        );


        if(error){

            console.error(
                error
            );

            showError(
                error.message
            );

            saveButton.disabled =
            false;

            saveButton.textContent =
            "Guardar cambios";

            return;

        }


        message.className =
        "message success";

        message.textContent =
        "✓ Cambios guardados";


        saveButton.textContent =
        "Guardado ✓";


        setTimeout(
            function(){

                saveButton.disabled =
                false;

                saveButton.textContent =
                "Guardar cambios";

            },
            1200
        );

    }
);


/* =================================
   GENERAR LINK
================================= */

generateButton.addEventListener(
    "click",
    async function(){

        if(!currentUser){

            showError(
                "❌ Inicia sesión primero."
            );

            return;

        }


        const username =
        usernameInput.value.trim();


        if(!username){

            showError(
                "❌ No tienes username."
            );

            return;

        }


        /*
           Guarda antes de generar
           el link.
        */

        const {
            error
        } =
        await supabase
        .from("profiles")
        .update({

            display_name:
            displayNameInput.value.trim(),

            bio:
            bioInput.value.trim(),

            avatar_url:
            avatarInput.value.trim(),

            discord:
            discordInput.value.trim(),

            youtube:
            youtubeInput.value.trim(),

            github:
            githubInput.value.trim(),

            instagram:
            instagramInput.value.trim(),

            tiktok:
            tiktokInput.value.trim(),

            spotify:
            spotifyInput.value.trim(),

            accent_color:
            accentColorInput.value

        })
        .eq(
            "id",
            currentUser.id
        );


        if(error){

            showError(
                error.message
            );

            return;

        }


        const url =
        window.location.origin +
        "/N-X/u.html?username=" +
        encodeURIComponent(
            username
        );


        profileUrl.textContent =
        url;


        try{

            await navigator.clipboard.writeText(
                url
            );


            generateButton.textContent =
            "Link copiado ✓";


            setTimeout(
                function(){

                    generateButton.textContent =
                    "Generar link del perfil";

                },
                1500
            );

        }

        catch(error){

            generateButton.textContent =
            "Link generado ✓";

        }

    }
);


/* =================================
   LOGOUT
================================= */

logout.addEventListener(
    "click",
    async function(){

        await supabase.auth.signOut();

        window.location.href =
        "login.html";

    }
);


/* =================================
   ERROR
================================= */

function showError(
    text
){

    message.className =
    "message error";

    message.textContent =
    "❌ " +
    text;

}


/* =================================
   INICIO
================================= */

loadProfile();

</script>

</body>
</html>
