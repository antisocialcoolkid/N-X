<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Login</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #252525,
            #080808 45%,
            #020202
        );

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.auth{

    width:100%;

    max-width:430px;

}

.logo{

    display:block;

    margin-bottom:22px;

    color:white;

    text-decoration:none;

    font-size:27px;

    font-weight:900;

}

.card{

    padding:35px 30px;

    background:#0d0d0d;

    border:
        1px solid
        #252525;

    border-radius:22px;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.7);

}

h1{

    margin:0;

    font-size:31px;

}

.subtitle{

    color:#777;

    font-size:13px;

    margin:
        8px
        0
        28px;

}

label{

    display:block;

    margin:
        16px
        0
        7px;

    color:#aaa;

    font-size:11px;

    font-weight:bold;

}

input{

    width:100%;

    height:50px;

    padding:
        0
        14px;

    background:#151515;

    border:
        1px solid
        #292929;

    border-radius:9px;

    color:white;

    outline:none;

    font-size:14px;

}

input:focus{

    border-color:#666;

}

button{

    width:100%;

    height:50px;

    margin-top:22px;

    border:0;

    border-radius:9px;

    background:white;

    color:#050505;

    font-weight:900;

    cursor:pointer;

}

button:disabled{

    opacity:.5;

    cursor:not-allowed;

}

#message{

    min-height:22px;

    margin-top:16px;

    text-align:center;

    color:#888;

    font-size:12px;

}

.success{

    color:#64ff91 !important;

}

.error{

    color:#ff6060 !important;

}

.register{

    margin-top:25px;

    text-align:center;

    color:#666;

    font-size:12px;

}

.register a{

    color:white;

}

</style>

</head>


<body>


<main class="auth">


<a
    href="index.html"
    class="logo"
>
    NØX
</a>


<section class="card">


<h1>
    Welcome back.
</h1>


<p class="subtitle">
    Sign in to your NØX profile.
</p>


<label for="email">
    Email
</label>


<input
    id="email"
    type="email"
    placeholder="you@email.com"
    autocomplete="email"
>


<label for="password">
    Password
</label>


<input
    id="password"
    type="password"
    placeholder="••••••••"
    autocomplete="current-password"
>


<button
    id="loginButton"
    type="button"
>
    Sign in
</button>


<p id="message">
    Cargando NØX...
</p>


<p class="register">

Don't have an account?

<a href="register.html">
Create one
</a>

</p>


</section>

</main>


<!-- SUPABASE -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const message =
document.getElementById(
    "message"
);

const email =
document.getElementById(
    "email"
);

const password =
document.getElementById(
    "password"
);

const button =
document.getElementById(
    "loginButton"
);


/* =========================
   CHECK SUPABASE
========================= */

if(
    typeof window.supabase ===
    "undefined"
){

    message.className =
    "error";

    message.textContent =
    "❌ No se pudo cargar Supabase.";

}else{

    message.textContent =
    "Supabase cargado ✓";

}


/* =========================
   CREATE CLIENT
========================= */

let client = null;


try{

    client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

}catch(error){

    message.className =
    "error";

    message.textContent =
    "❌ " +
    error.message;

}


/* =========================
   LOGIN
========================= */

button.addEventListener(
    "click",
    login
);


async function login(){

    const emailValue =
    email.value.trim();

    const passwordValue =
    password.value;


    if(!emailValue){

        showError(
            "Escribe tu email."
        );

        return;

    }


    if(!passwordValue){

        showError(
            "Escribe tu contraseña."
        );

        return;

    }


    if(!client){

        showError(
            "Supabase no está disponible."
        );

        return;

    }


    button.disabled =
    true;

    button.textContent =
    "Signing in...";


    message.className = "";

    message.textContent =
    "Iniciando sesión...";


    try{

        const result =
        await client.auth
        .signInWithPassword({

            email:
            emailValue,

            password:
            passwordValue

        });


        console.log(
            "NØX LOGIN",
            result
        );


        if(result.error){

            showError(
                result.error.message
            );

            resetButton();

            return;

        }


        if(
            !result.data ||
            !result.data.session
        ){

            showError(
                "No se creó la sesión."
            );

            resetButton();

            return;

        }


        message.className =
        "success";

        message.textContent =
        "✓ Login correcto. Entrando...";


        button.textContent =
        "Success ✓";


        setTimeout(
        function(){

            window.location.href =
            "profile.html";

        },
        700
        );

    }

    catch(error){

        console.error(
            error
        );


        showError(
            error.message
        );


        resetButton();

    }

}


/* =========================
   ENTER
========================= */

email.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            login();

        }

    }
);


password.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            login();

        }

    }
);


/* =========================
   ERROR
========================= */

function showError(
    text
){

    message.className =
    "error";

    message.textContent =
    "❌ " +
    text;

}


/* =========================
   RESET
========================= */

function resetButton(){

    button.disabled =
    false;

    button.textContent =
    "Sign in";

}

</script>


</body>

</html>
