<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Login</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #252525,
            #090909 45%,
            #020202
        );

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.auth{

    width:100%;

    max-width:430px;

}

.logo{

    display:inline-block;

    margin-bottom:22px;

    color:#fff;

    text-decoration:none;

    font-size:26px;

    font-weight:900;

}

.card{

    padding:35px 30px;

    background:
        rgba(10,10,10,.95);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:22px;

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.7);

}

h1{

    margin:0;

    font-size:31px;

}

.subtitle{

    margin:
        8px
        0
        28px;

    color:#777;

    font-size:13px;

}

label{

    display:block;

    margin:
        16px
        0
        7px;

    color:#aaa;

    font-size:11px;

    font-weight:800;

}

input{

    width:100%;

    height:50px;

    padding:0 14px;

    background:#151515;

    border:
        1px solid
        #292929;

    border-radius:9px;

    color:#fff;

    outline:none;

    font-size:14px;

}

input:focus{

    border-color:#666;

}

button{

    width:100%;

    height:50px;

    margin-top:22px;

    border:0;

    border-radius:9px;

    background:#fff;

    color:#050505;

    font-weight:900;

    cursor:pointer;

}

button:disabled{

    opacity:.5;

    cursor:not-allowed;

}

#message{

    min-height:20px;

    margin-top:16px;

    text-align:center;

    color:#777;

    font-size:12px;

}

.success{

    color:#64ff91 !important;

}

.error{

    color:#ff6565 !important;

}

.register{

    margin-top:25px;

    text-align:center;

    color:#666;

    font-size:12px;

}

.register a{

    color:#fff;

}

</style>

</head>


<body>


<main class="auth">


<a
    href="index.html"
    class="logo"
>
    NØX
</a>


<section class="card">


<h1>
    Welcome back.
</h1>


<p class="subtitle">
    Sign in to your NØX profile.
</p>


<label for="email">
    Email
</label>


<input
    id="email"
    type="email"
    placeholder="you@email.com"
    autocomplete="email"
>


<label for="password">
    Password
</label>


<input
    id="password"
    type="password"
    placeholder="••••••••"
    autocomplete="current-password"
>


<button
    id="loginButton"
    type="button"
>
    Sign in
</button>


<p id="message">
    Cargando...
</p>


<p class="register">

    Don't have an account?

    <a href="register.html">
        Create one
    </a>

</p>


</section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* =========================
   CREATE CLIENT
========================= */

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const email =
document.getElementById(
    "email"
);

const password =
document.getElementById(
    "password"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const message =
document.getElementById(
    "message"
);


/* =========================
   READY
========================= */

message.textContent =
"JAVASCRIPT FUNCIONA ✓";


/* =========================
   LOGIN
========================= */

loginButton.addEventListener(
    "click",
    login
);


async function login(){

    const emailValue =
    email.value.trim();

    const passwordValue =
    password.value;


    if(!emailValue){

        showError(
            "Escribe tu email."
        );

        return;

    }


    if(!passwordValue){

        showError(
            "Escribe tu contraseña."
        );

        return;

    }


    loginButton.disabled =
    true;

    loginButton.textContent =
    "Signing in...";


    message.className = "";

    message.textContent =
    "Iniciando sesión...";


    try{

        const {
            data,
            error
        } =
        await supabase.auth
        .signInWithPassword({

            email:
            emailValue,

            password:
            passwordValue

        });


        console.log(
            "LOGIN DATA:",
            data
        );


        console.log(
            "LOGIN ERROR:",
            error
        );


        if(error){

            showError(
                getError(
                    error
                )
            );

            resetButton();

            return;

        }


        if(
            !data ||
            !data.session
        ){

            showError(
                "No se pudo crear la sesión."
            );

            resetButton();

            return;

        }


        message.className =
        "success";

        message.textContent =
        "✓ Login correcto. Entrando...";


        loginButton.textContent =
        "Success ✓";


        setTimeout(
        function(){

            window.location.href =
            "profile.html";

        },
        700
        );

    }

    catch(error){

        console.error(
            error
        );


        showError(
            error.message
        );


        resetButton();

    }

}


/* =========================
   ENTER
========================= */

email.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            login();

        }

    }
);


password.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            login();

        }

    }
);


/* =========================
   ERRORS
========================= */

function getError(
    error
){

    const text =
    String(
        error.message ||
        ""
    ).toLowerCase();


    if(
        text.includes(
            "invalid login credentials"
        )
    ){

        return (
            "Email o contraseña incorrectos."
        );

    }


    if(
        text.includes(
            "email not confirmed"
        )
    ){

        return (
            "Debes confirmar tu email antes de iniciar sesión."
        );

    }


    if(
        text.includes(
            "rate limit"
        )
    ){

        return (
            "Demasiados intentos. Espera un momento."
        );

    }


    return (
        error.message ||
        "Error al iniciar sesión."
    );

}


/* =========================
   ERROR MESSAGE
========================= */

function showError(
    text
){

    message.className =
    "error";

    message.textContent =
    "❌ " +
    text;

}


/* =========================
   RESET BUTTON
========================= */

function resetButton(){

    loginButton.disabled =
    false;

    loginButton.textContent =
    "Sign in";

}

</script>


</body>

</html>
