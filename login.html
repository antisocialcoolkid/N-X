<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NØX — Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth">

        <a href="index.html" class="logo">
            NØX
        </a>

        <div class="auth-box">

            <h1>Welcome back.</h1>

            <p>Sign in to your NØX profile.</p>

            <form id="loginForm">

                <label>Email</label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@email.com"
                    required
                >

                <label>Password</label>

                <input
                    id="password"
                    type="password"
                    placeholder="••••••••"
                    required
                >

                <button type="submit">
                    Sign in
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button id="discordLogin" class="discord">
                Continue with Discord
            </button>

            <p class="register">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

            <p id="message"></p>

        </div>

    </main>

    <script type="module" src="auth.js"></script>

</body>
</html>
