<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — Login</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #292929,
            #080808 45%,
            #020202
        );

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.auth{

    width:100%;

    max-width:430px;

}

.logo{

    display:block;

    margin-bottom:22px;

    color:#fff;

    text-decoration:none;

    font-size:27px;

    font-weight:900;

}

.card{

    padding:35px 30px;

    background:#0d0d0d;

    border:
        1px solid
        #292929;

    border-radius:22px;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.7);

}

h1{

    margin:0;

    font-size:31px;

}

.subtitle{

    margin:
        8px
        0
        28px;

    color:#777;

    font-size:13px;

}

label{

    display:block;

    margin:
        16px
        0
        7px;

    color:#aaa;

    font-size:11px;

    font-weight:800;

}

input{

    width:100%;

    height:50px;

    padding:
        0
        14px;

    background:#151515;

    color:#fff;

    border:
        1px solid
        #292929;

    border-radius:9px;

    outline:none;

    font-size:14px;

}

input:focus{

    border-color:#666;

}

button{

    width:100%;

    height:50px;

    margin-top:22px;

    border:0;

    border-radius:9px;

    background:#fff;

    color:#050505;

    font-weight:900;

    cursor:pointer;

}

button:disabled{

    opacity:.5;

    cursor:not-allowed;

}

#message{

    min-height:22px;

    margin-top:16px;

    text-align:center;

    color:#888;

    font-size:12px;

}

.success{

    color:#62ff91 !important;

}

.error{

    color:#ff6060 !important;

}

.register{

    margin-top:25px;

    text-align:center;

    color:#666;

    font-size:12px;

}

.register a{

    color:#fff;

    text-decoration:none;

}

.version{

    margin-top:18px;

    text-align:center;

    color:#333;

    font-size:9px;

    letter-spacing:2px;

}

</style>

</head>


<body>


<main class="auth">


<a
    href="index.html"
    class="logo"
>
    NØX
</a>


<section class="card">


<h1>
    Welcome back.
</h1>


<p class="subtitle">
    Sign in to your NØX profile.
</p>


<label for="email">
    Email
</label>


<input
    id="email"
    type="email"
    placeholder="you@email.com"
    autocomplete="email"
>


<label for="password">
    Password
</label>


<input
    id="password"
    type="password"
    placeholder="••••••••"
    autocomplete="current-password"
>


<button
    id="loginButton"
    type="button"
>
    Sign in
</button>


<p id="message">
    Cargando NØX...
</p>


<p class="register">

Don't have an account?

<a href="register.html">
Create one
</a>

</p>


<div class="version">
    NOX_LOGIN_FINAL_2026
</div>


</section>

</main>


<!-- SUPABASE -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

"use strict";


/* =========================
   CONFIG
========================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* =========================
   ELEMENTS
========================= */

const message =
document.getElementById(
    "message"
);

const emailInput =
document.getElementById(
    "email"
);

const passwordInput =
document.getElementById(
    "password"
);

const loginButton =
document.getElementById(
    "loginButton"
);


/* =========================
   START CHECK
========================= */

message.textContent =
"1/4 — JavaScript funciona ✓";


/* =========================
   CHECK SUPABASE
========================= */

if(
    !window.supabase
){

    message.className =
    "error";

    message.textContent =
    "❌ 2/4 — Supabase no cargó.";

}else{

    message.textContent =
    "2/4 — Supabase cargado ✓";

}


/* =========================
   CLIENT
========================= */

let supabaseClient =
null;


if(
    window.supabase
){

    try{

        supabaseClient =
        window.supabase.createClient(

            SUPABASE_URL,

            SUPABASE_KEY

        );


        message.textContent =
        "3/4 — Supabase conectado ✓";


    }catch(error){

        message.className =
        "error";

        message.textContent =
        "❌ " +
        error.message;

    }

}


/* =========================
   READY
========================= */

if(
    supabaseClient
){

    loginButton.disabled =
    false;

    message.textContent =
    "4/4 — LOGIN LISTO ✓";

}else{

    loginButton.disabled =
    true;

}


/* =========================
   LOGIN CLICK
========================= */

loginButton.addEventListener(
    "click",
    login
);


/* =========================
   LOGIN
========================= */

async function login(){

    const email =
    emailInput.value.trim();

    const password =
    passwordInput.value;


    if(!email){

        showError(
            "Escribe tu email."
        );

        return;

    }


    if(!password){

        showError(
            "Escribe tu contraseña."
        );

        return;

    }


    if(!supabaseClient){

        showError(
            "Supabase no está disponible."
        );

        return;

    }


    loginButton.disabled =
    true;

    loginButton.textContent =
    "Signing in...";


    message.className = "";

    message.textContent =
    "Iniciando sesión...";


    try{

        const result =
        await supabaseClient
        .auth
        .signInWithPassword({

            email:
            email,

            password:
            password

        });


        console.log(
            "NØX LOGIN RESULT:",
            result
        );


        if(
            result.error
        ){

            showError(
                result.error.message
            );

            resetButton();

            return;

        }


        if(
            !result.data ||
            !result.data.session
        ){

            showError(
                "No se creó la sesión."
            );

            resetButton();

            return;

        }


        message.className =
        "success";

        message.textContent =
        "✓ Login correcto";


        loginButton.textContent =
        "Entrando...";


        setTimeout(
        function(){

            window.location.href =
            "profile.html";

        },
        700
        );

    }

    catch(error){

        console.error(
            error
        );


        showError(
            error.message
        );


        resetButton();

    }

}


/* =========================
   ENTER
========================= */

emailInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            login();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            login();

        }

    }
);


/* =========================
   ERROR
========================= */

function showError(
    text
){

    message.className =
    "error";

    message.textContent =
    "❌ " +
    text;

}


/* =========================
   RESET
========================= */

function resetButton(){

    loginButton.disabled =
    false;

    loginButton.textContent =
    "Sign in";

}

</script>


</body>

</html>
