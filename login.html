<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NØX — Test</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            background:#050505;
            color:white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .box{
            width:90%;
            max-width:420px;

            padding:35px;

            text-align:center;

            background:#101010;

            border:1px solid #292929;

            border-radius:20px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,.7);
        }

        h1{
            margin:0 0 10px;

            font-size:30px;
        }

        p{
            color:#888;

            font-size:14px;
        }

        button{

            width:100%;

            margin-top:20px;

            padding:15px;

            border:0;

            border-radius:10px;

            background:white;

            color:black;

            font-weight:900;

            cursor:pointer;
        }

        #resultado{

            min-height:25px;

            margin-top:20px;

            color:#64ff91;

        }

    </style>

</head>


<body>


<div class="box">


    <h1>
        NØX
    </h1>


    <p>
        PRUEBA DEFINITIVA
    </p>


    <button
        id="testButton"
        type="button"
    >
        PROBAR
    </button>


    <p id="resultado">
        Esperando...
    </p>


</div>


<script>

console.log(
    "NØX TEST: JavaScript cargado"
);


const button =
document.getElementById(
    "testButton"
);


const resultado =
document.getElementById(
    "resultado"
);


button.addEventListener(
    "click",
    function(){

        resultado.textContent =
        "JAVASCRIPT FUNCIONA ✓";

        console.log(
            "NØX TEST: botón funcionando"
        );

    }
);

</script>


</body>

</html>
