<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>NØX — Create Profile</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #242424 0%,
            #080808 45%,
            #020202 100%
        );

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;
}

.card{

    width:92%;
    max-width:430px;

    padding:32px;

    background:
        linear-gradient(
            145deg,
            #141414,
            #070707
        );

    border:
        1px solid
        #292929;

    border-radius:20px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.7);
}

.logo{

    margin-bottom:25px;

    font-size:30px;

    font-weight:900;

    letter-spacing:-1px;
}

h1{

    font-size:28px;
}

.subtitle{

    margin-top:8px;

    color:#666;

    font-size:12px;

    line-height:1.6;
}

.field{

    margin-top:18px;
}

label{

    display:block;

    margin-bottom:8px;

    color:#777;

    font-size:10px;

    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:1px;
}

input{

    width:100%;

    height:52px;

    padding:0 15px;

    background:#050505;

    color:white;

    border:
        1px solid
        #292929;

    border-radius:9px;

    outline:none;

    font-size:13px;
}

input:focus{

    border-color:#777;
}

button{

    width:100%;

    height:52px;

    margin-top:23px;

    border:0;

    border-radius:9px;

    background:white;

    color:black;

    font-weight:900;

    cursor:pointer;
}

button:disabled{

    opacity:.5;

    cursor:not-allowed;
}

#message{

    min-height:40px;

    margin-top:18px;

    text-align:center;

    color:#aaa;

    font-size:12px;

    line-height:1.5;

    word-break:break-word;
}

.success{
    color:#76ffad !important;
}

.error{
    color:#ff7070 !important;
}

.back{

    display:block;

    margin-top:20px;

    color:#666;

    text-align:center;

    text-decoration:none;

    font-size:11px;
}

.back:hover{
    color:white;
}

</style>
</head>


<body>


<div class="card">


<div class="logo">
NØX
</div>


<h1>
Create your profile
</h1>


<p class="subtitle">
Choose your unique NØX username.
</p>


<form id="noxForm">


<div class="field">

<label for="username">
Username
</label>

<input
    id="username"
    type="text"
    placeholder="maxiii"
    maxlength="24"
    required>

</div>


<div class="field">

<label for="email">
Email
</label>

<input
    id="email"
    type="email"
    placeholder="you@email.com"
    required>

</div>


<div class="field">

<label for="password">
Password
</label>

<input
    id="password"
    type="password"
    placeholder="••••••••"
    minlength="6"
    required>

</div>


<button
    id="submitButton"
    type="submit">

Create account

</button>


</form>


<div id="message"></div>


<a
    class="back"
    href="index.html">

← Back to NØX

</a>


</div>


<!--
====================================================
SUPABASE
====================================================
-->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        /*
        ==============================================
        SUPABASE
        ==============================================
        */

        const SUPABASE_URL =
        "https://asgowauvzfnsszstvzqi.supabase.co";

        const SUPABASE_KEY =
        "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


        const supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        /*
        ==============================================
        ELEMENTOS
        ==============================================
        */

        const form =
        document.getElementById(
            "noxForm"
        );

        const message =
        document.getElementById(
            "message"
        );

        const button =
        document.getElementById(
            "submitButton"
        );


        /*
        ==============================================
        SUBMIT
        ==============================================
        */

        form.addEventListener(
            "submit",
            async function(event){

                /*
                ESTO IMPIDE
                QUE LA PÁGINA SE RECARGUE.
                */

                event.preventDefault();

                event.stopPropagation();


                /*
                DATOS
                */

                const username =
                document
                .getElementById("username")
                .value
                .trim()
                .toLowerCase();


                const email =
                document
                .getElementById("email")
                .value
                .trim();


                const password =
                document
                .getElementById("password")
                .value;


                /*
                VALIDACIÓN
                */

                if(username.length < 3){

                    message.className =
                        "error";

                    message.textContent =
                        "❌ Username mínimo: 3 caracteres.";

                    return;
                }


                if(
                    !/^[a-z0-9_]+$/
                    .test(username)
                ){

                    message.className =
                        "error";

                    message.textContent =
                        "❌ Usa solamente letras, números y _.";

                    return;
                }


                if(password.length < 6){

                    message.className =
                        "error";

                    message.textContent =
                        "❌ La contraseña necesita mínimo 6 caracteres.";

                    return;
                }


                /*
                LOADING
                */

                button.disabled =
                    true;

                button.textContent =
                    "Creating...";


                message.className = "";

                message.textContent =
                    "Conectando con NØX...";


                try{


                    /*
                    ==================================
                    1. COMPROBAR USERNAME
                    ==================================
                    */

                    message.textContent =
                        "Comprobando username...";


                    const {
                        data:existing,
                        error:checkError
                    } =
                    await supabase
                    .from("profiles")
                    .select("username")
                    .eq(
                        "username",
                        username
                    )
                    .maybeSingle();


                    if(checkError){

                        throw new Error(
                            "Error comprobando username: " +
                            checkError.message
                        );
                    }


                    if(existing){

                        throw new Error(
                            "Ese username ya está ocupado."
                        );
                    }


                    /*
                    ==================================
                    2. CREAR USUARIO
                    ==================================
                    */

                    message.textContent =
                        "Creando cuenta...";


                    const {
                        data,
                        error
                    } =
                    await supabase
                    .auth
                    .signUp({

                        email:email,

                        password:password,

                        options:{
                            data:{
                                username:username
                            }
                        }

                    });


                    if(error){

                        throw new Error(
                            "Error creando cuenta: " +
                            error.message
                        );
                    }


                    /*
                    ==================================
                    3. VERIFICAR USUARIO
                    ==================================
                    */

                    if(!data.user){

                        throw new Error(
                            "Supabase no devolvió el usuario."
                        );
                    }


                    /*
                    ==================================
                    4. CREAR PERFIL
                    ==================================
                    */

                    message.textContent =
                        "Guardando perfil...";


                    const {
                        error:profileError
                    } =
                    await supabase
                    .from("profiles")
                    .insert({

                        id:data.user.id,

                        username:username

                    });


                    if(profileError){

                        throw new Error(
                            "Error creando perfil: " +
                            profileError.message
                        );
                    }


                    /*
                    ==================================
                    5. TODO CORRECTO
                    ==================================
                    */

                    message.className =
                        "success";

                    message.textContent =
                        "✓ ¡NØX profile creado correctamente!";


                    button.textContent =
                        "Created ✓";


                    /*
                    REDIRECCIÓN
                    SOLO DESPUÉS
                    DE CREAR TODO
                    */

                    setTimeout(
                        function(){

                            window.location.href =
                                "profile.html";

                        },
                        1200
                    );


                }
                catch(error){

                    /*
                    ==================================
                    ERROR
                    ==================================
                    */

                    console.error(
                        "NØX:",
                        error
                    );


                    message.className =
                        "error";

                    message.textContent =
                        "❌ " +
                        error.message;


                    button.disabled =
                        false;

                    button.textContent =
                        "Create account";

                }

            }
        );

    }
);

</script>

</body>
</html>
