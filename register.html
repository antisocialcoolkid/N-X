<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX TEST</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

.card{
    width:92%;
    max-width:420px;
    padding:30px;

    background:#0d0d0d;

    border:1px solid #292929;
    border-radius:18px;

    box-shadow:0 30px 80px #000;
}

.logo{
    margin-bottom:25px;

    font-size:30px;
    font-weight:900;
}

h1{
    font-size:28px;
}

p{
    margin-top:8px;
    color:#666;
    font-size:13px;
}

.field{
    margin-top:18px;
}

label{
    display:block;

    margin-bottom:7px;

    color:#777;

    font-size:10px;
    font-weight:bold;
    text-transform:uppercase;
}

input{
    width:100%;
    height:50px;

    padding:0 14px;

    background:#050505;
    color:white;

    border:1px solid #292929;
    border-radius:9px;

    outline:none;
}

input:focus{
    border-color:#777;
}

button{
    width:100%;
    height:52px;

    margin-top:22px;

    border:0;
    border-radius:9px;

    background:white;
    color:black;

    font-weight:900;

    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

#message{
    min-height:25px;

    margin-top:18px;

    text-align:center;

    color:#aaa;

    font-size:12px;
}

.back{
    display:block;

    margin-top:20px;

    color:#666;

    text-align:center;

    font-size:11px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
NØX
</div>

<h1>
Create your profile
</h1>

<p>
Choose your NØX username.
</p>

<form id="noxForm">

<div class="field">

<label>
Username
</label>

<input
id="username"
type="text"
placeholder="maxiii"
required>

</div>


<div class="field">

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="you@email.com"
required>

</div>


<div class="field">

<label>
Password
</label>

<input
id="password"
type="password"
placeholder="••••••••"
required>

</div>


<button
id="submitButton"
type="submit">

Create account

</button>

</form>


<div id="message"></div>


<a
class="back"
href="index.html">

← Back to NØX

</a>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const form =
            document.getElementById(
                "noxForm"
            );

        const message =
            document.getElementById(
                "message"
            );

        const button =
            document.getElementById(
                "submitButton"
            );


        form.addEventListener(
            "submit",
            function(event){

                event.preventDefault();

                event.stopPropagation();


                const username =
                    document
                    .getElementById(
                        "username"
                    )
                    .value
                    .trim();


                const email =
                    document
                    .getElementById(
                        "email"
                    )
                    .value
                    .trim();


                const password =
                    document
                    .getElementById(
                        "password"
                    )
                    .value;


                message.textContent =
                    "✓ FORMULARIO FUNCIONANDO";


                button.textContent =
                    "FUNCIONA ✓";

                button.disabled = true;


                console.log(
                    "NØX FORM OK",
                    username,
                    email,
                    password.length
                );

            }
        );

    }
);

</script>

</body>
</html>
