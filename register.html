<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — PRUEBA FINAL</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 0%,
            #252525,
            #080808 45%,
            #020202
        );

    color:#fff;

    font-family:Arial,Helvetica,sans-serif;
}

.card{
    width:92%;
    max-width:430px;

    padding:32px;

    background:#0d0d0d;

    border:1px solid #292929;

    border-radius:18px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.7);
}

.logo{
    margin-bottom:25px;

    font-size:30px;

    font-weight:900;
}

h1{
    font-size:27px;
}

.subtitle{
    margin-top:8px;

    color:#666;

    font-size:12px;
}

.field{
    margin-top:18px;
}

label{
    display:block;

    margin-bottom:8px;

    color:#777;

    font-size:10px;

    font-weight:bold;

    text-transform:uppercase;
}

input{
    width:100%;

    height:52px;

    padding:0 15px;

    background:#050505;

    color:#fff;

    border:1px solid #292929;

    border-radius:9px;

    outline:none;

    font-size:13px;
}

input:focus{
    border-color:#777;
}

button{
    width:100%;

    height:52px;

    margin-top:22px;

    border:0;

    border-radius:9px;

    background:#fff;

    color:#000;

    font-weight:900;

    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

#message{
    min-height:30px;

    margin-top:18px;

    text-align:center;

    color:#aaa;

    font-size:12px;
}

.back{
    display:block;

    margin-top:20px;

    color:#666;

    text-align:center;

    text-decoration:none;

    font-size:11px;
}

</style>
</head>


<body>


<div class="card">


<div class="logo">
NØX
</div>


<h1>
Create your profile
</h1>


<p class="subtitle">
PRUEBA FINAL — SIN SUPABASE
</p>


<form id="noxForm">


<div class="field">

<label for="username">
Username
</label>

<input
    id="username"
    type="text"
    placeholder="maxiii"
    required>

</div>


<div class="field">

<label for="email">
Email
</label>

<input
    id="email"
    type="email"
    placeholder="you@email.com"
    required>

</div>


<div class="field">

<label for="password">
Password
</label>

<input
    id="password"
    type="password"
    placeholder="••••••••"
    required>

</div>


<button
    id="submitButton"
    type="submit">

Create account

</button>


</form>


<div id="message"></div>


<a
    class="back"
    href="index.html">

← Back to NØX

</a>


</div>


<script>

const form =
document.getElementById("noxForm");

const message =
document.getElementById("message");

const button =
document.getElementById("submitButton");


form.addEventListener(
    "submit",
    function(event){

        /*
        EVITA LA RECARGA
        */

        event.preventDefault();

        event.stopPropagation();


        /*
        MENSAJE
        */

        message.textContent =
            "✓ FORMULARIO FUNCIONANDO";

        button.textContent =
            "FUNCIONA ✓";

        button.disabled = true;

    }
);

</script>


</body>
</html>
