<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #252525 0%,
            #090909 45%,
            #020202 100%
        );

    color:#fff;

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;
}

.background{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    pointer-events:none;
}

.glow{
    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:#fff;

    filter:blur(150px);

    opacity:.055;

    animation:
        glowMove
        12s
        ease-in-out
        infinite;
}

.glow.one{
    top:-300px;
    left:-250px;
}

.glow.two{
    right:-300px;
    bottom:-300px;

    animation-delay:-6s;
}

@keyframes glowMove{

    0%,100%{
        transform:
            translate(0,0)
            scale(1);
    }

    50%{
        transform:
            translate(50px,40px)
            scale(1.15);
    }
}


/* LOGO */

.logo{
    position:fixed;

    top:25px;
    left:30px;

    color:#fff;

    text-decoration:none;

    font-size:24px;

    font-weight:950;

    letter-spacing:-1px;

    transition:.2s;
}

.logo:hover{
    opacity:.6;
}


/* PROFILE */

.profile{

    width:min(
        520px,
        100%
    );

    padding:
        45px
        28px
        30px;

    background:
        rgba(8,8,8,.94);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:25px;

    backdrop-filter:
        blur(20px);

    box-shadow:

        0 40px 120px
        rgba(0,0,0,.7),

        inset
        0 1px
        rgba(255,255,255,.03);

    text-align:center;

    animation:
        profileIn
        .6s
        ease
        both;
}

@keyframes profileIn{

    from{
        opacity:0;

        transform:
            translateY(25px)
            scale(.97);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* AVATAR */

.avatar{

    width:110px;
    height:110px;

    margin:auto;

    border-radius:50%;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #292929,
            #080808
        );

    border:
        1px solid
        #3b3b3b;

    font-size:38px;

    font-weight:950;

    box-shadow:

        0 20px 60px
        rgba(0,0,0,.6),

        0 0 50px
        rgba(255,255,255,.035);
}

.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}


/* USERNAME */

.username{

    margin-top:22px;

    font-size:30px;

    font-weight:950;

    letter-spacing:-1px;
}


/* HANDLE */

.handle{

    margin-top:7px;

    color:#555;

    font-size:12px;
}


/* BIO */

.bio{

    max-width:430px;

    margin:
        20px
        auto
        0;

    color:#777;

    font-size:13px;

    line-height:1.7;
}


/* LINKS */

.links{

    display:grid;

    gap:10px;

    margin-top:28px;
}

.link{

    display:block;

    padding:15px;

    border:
        1px solid
        #222;

    border-radius:11px;

    background:
        rgba(255,255,255,.025);

    color:#aaa;

    text-decoration:none;

    font-size:11px;

    font-weight:800;

    transition:
        .25s ease;
}

.link:hover{

    color:#fff;

    border-color:#555;

    background:#111;

    transform:
        translateY(-3px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);
}


/* LOADING */

.loading{

    color:#555;

    font-size:10px;

    font-weight:800;

    letter-spacing:3px;

    animation:
        pulse
        1.5s
        infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:.35;
    }

    50%{
        opacity:1;
    }
}


/* ERROR */

.error{

    color:#ff7070;

    font-size:13px;

    line-height:1.7;
}


/* MOBILE */

@media(max-width:600px){

    body{
        padding:20px;
    }

    .logo{
        top:20px;
        left:20px;
        font-size:21px;
    }

    .profile{
        padding:
            35px
            20px
            28px;

        border-radius:20px;
    }

    .avatar{
        width:90px;
        height:90px;
        font-size:30px;
    }

    .username{
        font-size:25px;
    }

}

</style>

</head>


<body>


<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

</div>


<a
    href="index.html"
    class="logo"
>
    NØX
</a>


<main
    id="app"
    class="profile"
>

    <div class="loading">
        LOADING PROFILE...
    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const app =
document.getElementById("app");


/* =========================
   USERNAME
========================= */

const params =
new URLSearchParams(
    window.location.search
);


const username =
params.get("username");


if(!username){

    showError(
        "Falta el username."
    );

}else{

    loadProfile(
        username
    );

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(
    username
){

    try{

        const result =
        await supabase

        .from("profiles")

        .select(`
            id,
            username,
            avatar_url,
            bio,
            github,
            youtube,
            theme,
            discord_id,
            discord_username,
            created_at,
            discord
        `)

        .eq(
            "username",
            username
            .trim()
            .toLowerCase()
        )

        .maybeSingle();


        if(result.error){

            showError(
                result.error.message
            );

            return;
        }


        if(!result.data){

            showError(
                "Perfil no encontrado."
            );

            return;
        }


        renderProfile(
            result.data
        );


    }catch(error){

        showError(
            error.message
        );

    }

}


/* =========================
   RENDER
========================= */

function renderProfile(
    profile
){

    const username =
    profile.username ||
    "user";


    const bio =
    profile.bio ||
    "Welcome to my NØX profile.";


    let avatarHTML;


    if(profile.avatar_url){

        avatarHTML = `

            <img
                src="${escapeHTML(
                    profile.avatar_url
                )}"
                alt="Avatar"
                onerror="
                    this.style.display='none';
                    this.parentElement.textContent='${escapeHTML(
                        username
                        .charAt(0)
                        .toUpperCase()
                    )}';
                "
            >

        `;

    }else{

        avatarHTML =
        escapeHTML(
            username
            .charAt(0)
            .toUpperCase()
        );

    }


    let linksHTML = "";


    /* DISCORD */

    if(profile.discord_username){

        linksHTML += createLink(
            profile.discord_username,
            "Discord ↗"
        );

    }
    else if(profile.discord){

        linksHTML += createLink(
            profile.discord,
            "Discord ↗"
        );

    }


    /* GITHUB */

    if(profile.github){

        linksHTML += createLink(
            profile.github,
            "GitHub ↗"
        );

    }


    /* YOUTUBE */

    if(profile.youtube){

        linksHTML += createLink(
            profile.youtube,
            "YouTube ↗"
        );

    }


    /* THEME */

    if(
        profile.theme ===
        "light"
    ){

        document.body.style.background =
        "#eeeeee";

        document.body.style.color =
        "#111";

    }


    document.title =
    "@" +
    username +
    " — NØX";


    app.innerHTML = `

        <div class="avatar">

            ${avatarHTML}

        </div>


        <h1 class="username">

            @${escapeHTML(
                username
            )}

        </h1>


        <div class="handle">

            NØX Profile

        </div>


        <p class="bio">

            ${escapeHTML(
                bio
            )}

        </p>


        ${
            linksHTML
            ?
            `
            <div class="links">

                ${linksHTML}

            </div>
            `
            :
            ""
        }

    `;

}


/* =========================
   CREATE LINK
========================= */

function createLink(
    url,
    text
){

    let clean =
    String(url)
    .trim();


    if(
        !clean.startsWith(
            "http://"
        ) &&
        !clean.startsWith(
            "https://"
        )
    ){

        clean =
        "https://" +
        clean;

    }


    return `

        <a
            class="link"
            href="${escapeHTML(
                clean
            )}"
            target="_blank"
            rel="noopener noreferrer"
        >

            ${text}

        </a>

    `;

}


/* =========================
   ERROR
========================= */

function showError(
    text
){

    app.innerHTML = `

        <div class="error">

            ❌ ${escapeHTML(
                text
            )}

        </div>

    `;

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(
    value
){

    const div =
    document.createElement(
        "div"
    );

    div.textContent =
    value ?? "";

    return div.innerHTML;

}

</script>


</body>

</html>
