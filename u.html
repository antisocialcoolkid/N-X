<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NØX — Perfil</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

#app{
    width:100%;
    max-width:480px;
    padding:30px;
    border:1px solid #292929;
    border-radius:22px;
    background:#101010;
    box-shadow:0 20px 80px rgba(0,0,0,.6);
}

#status{
    text-align:center;
    color:#aaa;
    white-space:pre-wrap;
    line-height:1.6;
}

#error{
    display:none;
    padding:15px;
    border-radius:10px;
    background:#190909;
    color:#ff7070;
    white-space:pre-wrap;
}

#profile{
    display:none;
    text-align:center;
}

#avatar{
    width:110px;
    height:110px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:50%;
    border:3px solid white;
    background:#222;
    font-size:38px;
    font-weight:bold;
}

#avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

#name{
    margin-top:18px;
    font-size:28px;
    font-weight:800;
}

#username{
    margin-top:5px;
    color:#888;
}

#bio{
    margin-top:18px;
    color:#aaa;
    line-height:1.5;
}

#views{
    margin-top:15px;
    color:#777;
}

#links{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:22px;
}

.link{
    display:block;
    padding:13px;
    border-radius:10px;
    border:1px solid #292929;
    background:#151515;
    color:white;
    text-decoration:none;
}

</style>

</head>

<body>

<div id="app">

    <div id="status">
        NØX — iniciando...
    </div>

    <div id="error"></div>

    <div id="profile">

        <div id="avatar">N</div>

        <div id="name"></div>

        <div id="username"></div>

        <div id="bio"></div>

        <div id="views"></div>

        <div id="links"></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/*
==================================================
NØX PROFILE
NO USAMOS SUPABASE_URL NI SUPABASE_KEY
PARA EVITAR CONFLICTOS CON OTROS SCRIPTS.
==================================================
*/


var NX_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";


var NX_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


var NX_STATUS =
document.getElementById("status");


var NX_ERROR =
document.getElementById("error");


var NX_PROFILE =
document.getElementById("profile");


var NX_AVATAR =
document.getElementById("avatar");


var NX_NAME =
document.getElementById("name");


var NX_USERNAME =
document.getElementById("username");


var NX_BIO =
document.getElementById("bio");


var NX_VIEWS =
document.getElementById("views");


var NX_LINKS =
document.getElementById("links");


function NX_error(text){

    NX_STATUS.style.display =
        "none";

    NX_PROFILE.style.display =
        "none";

    NX_ERROR.style.display =
        "block";

    NX_ERROR.textContent =
        text;

}


function NX_letter(text){

    return (
        text ||
        "N"
    )
    .charAt(0)
    .toUpperCase();

}


function NX_link(url,name){

    if(!url){
        return;
    }

    var a =
    document.createElement("a");

    a.className =
        "link";

    a.textContent =
        name + " ↗";

    if(
        url.indexOf("http://") === 0 ||
        url.indexOf("https://") === 0
    ){

        a.href =
            url;

    }else{

        a.href =
            "https://" + url;

    }

    a.target =
        "_blank";

    a.rel =
        "noopener noreferrer";

    NX_LINKS.appendChild(a);

}


async function NX_start(){

    try{

        NX_STATUS.textContent =
            "NØX — comprobando Supabase...";


        if(
            typeof window.supabase ===
            "undefined"
        ){

            NX_error(
                "❌ Supabase JS no cargó."
            );

            return;

        }


        NX_STATUS.textContent =
            "NØX — conectando...";


        var client =
            window.supabase.createClient(
                NX_URL,
                NX_KEY
            );


        var params =
            new URLSearchParams(
                window.location.search
            );


        var username =
            params.get("username");


        if(!username){

            NX_error(
                "❌ La URL no tiene ?username=...\n\n" +
                "Ejemplo:\n" +
                "u.html?username=pan"
            );

            return;

        }


        username =
            username
                .trim()
                .toLowerCase();


        NX_STATUS.textContent =
            "NØX — buscando @" +
            username +
            "...";


        var result =
            await client
                .from("profiles")
                .select("*")
                .eq(
                    "username",
                    username
                )
                .maybeSingle();


        if(result.error){

            NX_error(
                "❌ ERROR SUPABASE\n\n" +
                result.error.message
            );

            return;

        }


        if(!result.data){

            NX_error(
                "❌ PERFIL NO ENCONTRADO\n\n" +
                "@" + username
            );

            return;

        }


        var profile =
            result.data;


        /*
        ==========================================
        MOSTRAR PERFIL
        ==========================================
        */


        NX_NAME.textContent =
            profile.display_name ||
            profile.username ||
            "NØX User";


        NX_USERNAME.textContent =
            "@" +
            profile.username;


        NX_BIO.textContent =
            profile.bio ||
            "Welcome to my NØX profile.";


        var oldViews =
            Number(
                profile.profile_views || 0
            );


        NX_VIEWS.textContent =
            "👁️ " +
            oldViews +
            (
                oldViews === 1
                ? " vista"
                : " vistas"
            );


        /*
        ==========================================
        AVATAR
        ==========================================
        */


        if(profile.avatar_url){

            var img =
                document.createElement("img");

            img.src =
                profile.avatar_url;

            img.alt =
                "Avatar";

            img.onerror =
                function(){

                    NX_AVATAR.textContent =
                        NX_letter(
                            profile.username
                        );

                };

            NX_AVATAR.innerHTML =
                "";

            NX_AVATAR.appendChild(img);

        }else{

            NX_AVATAR.textContent =
                NX_letter(
                    profile.username
                );

        }


        /*
        ==========================================
        REDES
        ==========================================
        */


        NX_LINKS.innerHTML =
            "";


        NX_link(
            profile.discord,
            "Discord"
        );


        NX_link(
            profile.youtube,
            "YouTube"
        );


        NX_link(
            profile.github,
            "GitHub"
        );


        NX_link(
            profile.instagram,
            "Instagram"
        );


        NX_link(
            profile.tiktok,
            "TikTok"
        );


        NX_link(
            profile.spotify,
            "Spotify"
        );


        /*
        ==========================================
        MOSTRAR
        ==========================================
        */


        NX_STATUS.style.display =
            "none";

        NX_PROFILE.style.display =
            "block";


        /*
        ==========================================
        SUMAR VISTA
        ==========================================
        */

        try{

            var view =
                await client.rpc(
                    "increment_profile_views",
                    {
                        profile_uuid:
                            profile.id
                    }
                );


            if(
                !view.error
            ){

                NX_VIEWS.textContent =
                    "👁️ " +
                    (oldViews + 1) +
                    (
                        oldViews + 1 === 1
                        ? " vista"
                        : " vistas"
                    );

            }

        }catch(viewError){

            console.log(
                "Contador de vistas:",
                viewError
            );

        }


    }catch(error){

        console.error(
            "NØX ERROR:",
            error
        );


        NX_error(
            "❌ ERROR GENERAL\n\n" +
            error.message
        );

    }

}


NX_start();

</script>

</body>

</html>
