<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Perfil</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#050505;

    color:white;

    font-family:Arial,sans-serif;

}

#app{

    width:90%;

    max-width:450px;

    padding:30px;

    text-align:center;

    background:#111;

    border:1px solid #292929;

    border-radius:20px;

}

#loading{

    color:#aaa;

}

#error{

    display:none;

    color:#ff6b6b;

    white-space:pre-wrap;

}

#profile{

    display:none;

}

#avatar{

    width:100px;

    height:100px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    background:#222;

    border:3px solid white;

    font-size:35px;

    font-weight:bold;

}

#avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}

#name{

    margin-top:18px;

    font-size:27px;

    font-weight:bold;

}

#username{

    margin-top:5px;

    color:#888;

}

#bio{

    margin-top:18px;

    color:#aaa;

}

#views{

    margin-top:15px;

    color:#777;

}

</style>

</head>


<body>


<div id="app">

    <div id="loading">

        NØX — cargando...

    </div>


    <div id="error"></div>


    <div id="profile">

        <div id="avatar">

            N

        </div>


        <div id="name">

        </div>


        <div id="username">

        </div>


        <div id="bio">

        </div>


        <div id="views">

        </div>

    </div>

</div>


<!-- SUPABASE -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* ====================================
   NØX
==================================== */


/* SUPABASE */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* ELEMENTOS */

const loading =
document.getElementById(
    "loading"
);

const errorBox =
document.getElementById(
    "error"
);

const profile =
document.getElementById(
    "profile"
);

const avatar =
document.getElementById(
    "avatar"
);

const nameElement =
document.getElementById(
    "name"
);

const usernameElement =
document.getElementById(
    "username"
);

const bio =
document.getElementById(
    "bio"
);

const views =
document.getElementById(
    "views"
);


/* ====================================
   SUPABASE
==================================== */

if(!window.supabase){

    loading.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorBox.textContent =
        "❌ Supabase JS no cargó.";

}else{

    start();

}


/* ====================================
   START
==================================== */

async function start(){

    const supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* URL */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const username =
        params
            .get("username");


    console.log(
        "Username:",
        username
    );


    /* SIN USERNAME */

    if(!username){

        showError(
            "❌ Falta el username.\n\n" +

            "Usa:\n" +

            "u.html?username=pan"
        );

        return;
    }


    loading.textContent =
        "NØX — buscando @" +
        username +
        "...";


    try{


        /* =================================
           BUSCAR PERFIL
        ================================= */

        const result =
            await supabase

                .from("profiles")

                .select("*")

                .eq(
                    "username",
                    username
                        .trim()
                        .toLowerCase()
                )

                .maybeSingle();


        console.log(
            "Resultado:",
            result
        );


        if(result.error){

            showError(
                "❌ ERROR SUPABASE\n\n" +

                result.error.message
            );

            return;
        }


        if(!result.data){

            showError(
                "❌ PERFIL NO ENCONTRADO\n\n" +

                "@" +
                username
            );

            return;
        }


        const data =
            result.data;


        /* =================================
           MOSTRAR
        ================================= */

        loading.style.display =
            "none";


        profile.style.display =
            "block";


        /* APODO */

        nameElement.textContent =
            data.display_name ||
            data.username ||
            "NØX User";


        /* USERNAME */

        usernameElement.textContent =
            "@" +
            data.username;


        /* BIO */

        bio.textContent =
            data.bio ||
            "Welcome to my NØX profile.";


        /* VISTAS */

        const oldViews =
            Number(
                data.profile_views || 0
            );


        views.textContent =
            "👁️ " +
            oldViews +
            (
                oldViews === 1
                ? " vista"
                : " vistas"
            );


        /* =================================
           AVATAR
        ================================= */

        if(data.avatar_url){

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                data.avatar_url;


            img.alt =
                "Avatar";


            avatar.innerHTML =
                "";


            avatar.appendChild(
                img
            );

        }else{

            avatar.textContent =
                (
                    data.username ||
                    "N"
                )
                .charAt(0)
                .toUpperCase();

        }


        /* =================================
           SUMAR VISTA
        ================================= */

        console.log(
            "Sumando vista..."
        );


        const view =
            await supabase.rpc(

                "increment_profile_views",

                {
                    profile_uuid:
                        data.id
                }

            );


        console.log(
            "Vista:",
            view
        );


        if(!view.error){

            const newViews =
                oldViews + 1;


            views.textContent =
                "👁️ " +
                newViews +
                (
                    newViews === 1
                    ? " vista"
                    : " vistas"
                );

        }


    }catch(err){

        console.error(
            err
        );


        showError(
            "❌ ERROR\n\n" +
            err.message
        );

    }

}


/* ====================================
   ERROR
==================================== */

function showError(
    message
){

    loading.style.display =
        "none";


    profile.style.display =
        "none";


    errorBox.style.display =
        "block";


    errorBox.textContent =
        message;

}

</script>

</body>

</html>
