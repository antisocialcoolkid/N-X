<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX Profile</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

#loading{
    color:#888;
}

#profile{
    width:90%;
    max-width:450px;
    padding:30px;
    text-align:center;
    background:#111;
    border:1px solid #292929;
    border-radius:20px;
}

.hidden{
    display:none;
}

.avatar{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#222;
    font-size:35px;
    font-weight:bold;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:18px;
    font-size:27px;
    font-weight:bold;
}

.username{
    margin-top:5px;
    color:#888;
}

.bio{
    margin-top:15px;
    color:#aaa;
}

.views{
    margin-top:15px;
    color:#777;
}

.error{
    color:#ff6666;
}

.link{
    display:block;
    margin-top:10px;
    padding:12px;
    background:#1a1a1a;
    border-radius:10px;
    color:white;
    text-decoration:none;
}

</style>

<!-- SUPABASE DEBE CARGARSE ANTES DEL SCRIPT -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div id="loading">
    Cargando perfil...
</div>


<div id="profile" class="hidden">

    <div id="avatar" class="avatar">
        N
    </div>

    <div id="name" class="name">
        NØX User
    </div>

    <div id="username" class="username">
        @username
    </div>

    <div id="bio" class="bio">
        Welcome to my NØX profile.
    </div>

    <div id="views" class="views">
        👁️ 0 vistas
    </div>

    <div id="links"></div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTOS
========================= */

const loading =
document.getElementById("loading");

const profile =
document.getElementById("profile");

const avatar =
document.getElementById("avatar");

const nameElement =
document.getElementById("name");

const usernameElement =
document.getElementById("username");

const bioElement =
document.getElementById("bio");

const viewsElement =
document.getElementById("views");

const linksElement =
document.getElementById("links");


/* =========================
   USERNAME
========================= */

const params =
new URLSearchParams(
    window.location.search
);

const username =
params.get("username");


/* =========================
   ERROR
========================= */

function showError(message){

    loading.classList.add("hidden");

    profile.classList.remove("hidden");

    profile.innerHTML =
    `<div class="error">${message}</div>`;

}


/* =========================
   LINK
========================= */

function addLink(url,text){

    if(!url){
        return;
    }

    const link =
    document.createElement("a");

    link.className =
    "link";

    link.textContent =
    text + " ↗";

    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){

        url =
        "https://" + url;

    }

    link.href =
    url;

    link.target =
    "_blank";

    link.rel =
    "noopener noreferrer";

    linksElement.appendChild(link);

}


/* =========================
   CARGAR
========================= */

async function loadProfile(){

    try{

        console.log(
            "NØX: iniciando..."
        );


        if(!username){

            showError(
                "Falta ?username= en la URL."
            );

            return;

        }


        const cleanUsername =
        username
        .trim()
        .toLowerCase();


        console.log(
            "Buscando:",
            cleanUsername
        );


        const result =
        await supabase
        .from("profiles")
        .select("*")
        .eq(
            "username",
            cleanUsername
        )
        .maybeSingle();


        console.log(
            "Resultado:",
            result
        );


        if(result.error){

            showError(
                "Supabase: " +
                result.error.message
            );

            return;

        }


        if(!result.data){

            showError(
                "Perfil no encontrado."
            );

            return;

        }


        const data =
        result.data;


        /* =====================
           PERFIL
        ===================== */

        nameElement.textContent =
        data.display_name ||
        data.username ||
        "NØX User";


        usernameElement.textContent =
        "@" +
        data.username;


        bioElement.textContent =
        data.bio ||
        "Welcome to my NØX profile.";


        /* =====================
           AVATAR
        ===================== */

        if(data.avatar_url){

            avatar.innerHTML =
            `<img src="${data.avatar_url}" alt="Avatar">`;

        }else{

            avatar.textContent =
            (
                data.display_name ||
                data.username ||
                "N"
            )
            .charAt(0)
            .toUpperCase();

        }


        /* =====================
           VISTAS ACTUALES
        ===================== */

        const currentViews =
        Number(
            data.profile_views || 0
        );


        viewsElement.textContent =
        "👁️ " +
        currentViews +
        (
            currentViews === 1
            ? " vista"
            : " vistas"
        );


        /* =====================
           LINKS
        ===================== */

        addLink(
            data.discord,
            "Discord"
        );

        addLink(
            data.instagram,
            "Instagram"
        );

        addLink(
            data.tiktok,
            "TikTok"
        );

        addLink(
            data.youtube,
            "YouTube"
        );

        addLink(
            data.github,
            "GitHub"
        );

        addLink(
            data.spotify,
            "Spotify"
        );


        /* =====================
           MOSTRAR
        ===================== */

        loading.classList.add(
            "hidden"
        );

        profile.classList.remove(
            "hidden"
        );


        /* =====================
           SUMAR VISTA
        ===================== */

        const viewResult =
        await supabase.rpc(
            "increment_profile_views",
            {
                profile_uuid:
                data.id
            }
        );


        console.log(
            "Resultado vista:",
            viewResult
        );


        if(viewResult.error){

            console.error(
                "Error vista:",
                viewResult.error
            );

            return;

        }


        /* =====================
           ACTUALIZAR CONTADOR
        ===================== */

        const newViews =
        Number(
            viewResult.data
        );


        viewsElement.textContent =
        "👁️ " +
        newViews +
        (
            newViews === 1
            ? " vista"
            : " vistas"
        );


    }catch(error){

        console.error(
            "NØX ERROR:",
            error
        );

        showError(
            "Error: " +
            error.message
        );

    }

}


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
