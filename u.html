<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NØX Profile</title>

    <!-- SUPABASE: DEBE CARGARSE ANTES DEL SCRIPT PRINCIPAL -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background: #050505;
            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow-x: hidden;
        }

        #background {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at top,
                    #292929 0%,
                    #090909 45%,
                    #020202 100%
                );

            background-size: cover;
            background-position: center;

            z-index: -3;
        }

        #backgroundVideo {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;

            z-index: -2;
        }

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .35);

            z-index: -1;
        }

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050505;

            color: #888;

            font-size: 14px;

            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        .profile {
            width: 100%;
            max-width: 470px;

            padding: 32px 24px;

            border: 1px solid #292929;
            border-radius: 24px;

            background: rgba(10, 10, 10, .82);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, .65);

            text-align: center;

            animation: profileIn .5s ease;
        }

        @keyframes profileIn {
            from {
                opacity: 0;
                transform:
                    translateY(15px)
                    scale(.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .avatar {
            width: 110px;
            height: 110px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 50%;

            border: 3px solid white;

            background: #181818;

            font-size: 38px;
            font-weight: 900;

            box-shadow:
                0 0 30px rgba(255,255,255,.08);
        }

        .avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .display-name {
            margin-top: 18px;

            font-size: 28px;
            font-weight: 900;
        }

        .username {
            margin-top: 6px;

            color: #888;

            font-size: 14px;
        }

        .bio {
            margin: 18px auto 0;

            max-width: 380px;

            color: #bdbdbd;

            line-height: 1.5;

            font-size: 14px;
        }

        .views {
            margin-top: 14px;

            color: #777;

            font-size: 13px;
        }

        .links {
            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-top: 22px;
        }

        .link {
            display: block;

            width: 100%;

            padding: 13px 16px;

            border:
                1px solid
                #292929;

            border-radius: 12px;

            background: rgba(20,20,20,.8);

            color: white;

            text-decoration: none;

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .link:hover {
            transform: translateY(-2px);

            border-color: #555;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.35);
        }

        .music {
            width: 100%;

            margin-top: 20px;
        }

        .error {
            color: #ff7070;

            font-size: 15px;

            line-height: 1.5;
        }

        .error small {
            display: block;

            margin-top: 10px;

            color: #777;
        }
    </style>
</head>

<body>

    <div id="background"></div>

    <video
        id="backgroundVideo"
        autoplay
        muted
        loop
        playsinline
    ></video>

    <div class="overlay"></div>


    <div id="loading">
        Cargando perfil...
    </div>


    <main
        id="profile"
        class="profile hidden"
    >

        <div
            id="avatar"
            class="avatar"
        >
            N
        </div>


        <div
            id="displayName"
            class="display-name"
        >
            NØX User
        </div>


        <!-- EL USERNAME NO SE PUEDE CAMBIAR DESDE AQUÍ -->

        <div
            id="username"
            class="username"
        >
            @username
        </div>


        <div
            id="bio"
            class="bio"
        >
            Welcome to my NØX profile.
        </div>


        <div
            id="views"
            class="views"
        >
            👁️ 0 vistas
        </div>


        <div
            id="links"
            class="links"
        ></div>


        <audio
            id="music"
            class="music hidden"
            controls
        ></audio>

    </main>


<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/*
   Comprobación para evitar el típico
   problema de "supabase is undefined".
*/

if (
    !window.supabase ||
    !window.supabase.createClient
) {

    showFatalError(
        "No se pudo cargar Supabase."
    );

} else {

    start();

}


/* =========================================
   CLIENTE SUPABASE
========================================= */

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTOS
========================================= */

const loading =
    document.getElementById(
        "loading"
    );


const profile =
    document.getElementById(
        "profile"
    );


const avatar =
    document.getElementById(
        "avatar"
    );


const displayName =
    document.getElementById(
        "displayName"
    );


const usernameElement =
    document.getElementById(
        "username"
    );


const bio =
    document.getElementById(
        "bio"
    );


const views =
    document.getElementById(
        "views"
    );


const links =
    document.getElementById(
        "links"
    );


const background =
    document.getElementById(
        "background"
    );


const backgroundVideo =
    document.getElementById(
        "backgroundVideo"
    );


const music =
    document.getElementById(
        "music"
    );


/* =========================================
   OBTENER USERNAME DE LA URL
========================================= */

function getUsername() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const value =
        params.get("username");


    if (!value) {
        return null;
    }


    return value
        .trim()
        .toLowerCase();

}


/* =========================================
   INICIAR
========================================= */

function start() {

    loadProfile();

}


/* =========================================
   CARGAR PERFIL
========================================= */

async function loadProfile() {

    try {

        const username =
            getUsername();


        if (!username) {

            showError(
                "No se especificó un username.",
                "Ejemplo: u.html?username=pan"
            );

            return;

        }


        console.log(
            "Buscando perfil:",
            username
        );


        /*
           IMPORTANTE:

           NO usamos supabase.auth.getUser()
           aquí.

           El perfil es PÚBLICO.
           Por eso no mandamos al visitante
           a login.html.
        */


        const result =
            await supabase
                .from("profiles")
                .select("*")
                .eq(
                    "username",
                    username
                )
                .maybeSingle();


        const data =
            result.data;


        const error =
            result.error;


        if (error) {

            console.error(
                "Supabase error:",
                error
            );


            showError(
                "Error cargando el perfil.",
                error.message
            );


            return;

        }


        if (!data) {

            showError(
                "Perfil no encontrado.",
                "El usuario @" +
                username +
                " no existe."
            );


            return;

        }


        console.log(
            "Perfil encontrado:",
            data
        );


        /*
           MOSTRAR PERFIL
        */

        renderProfile(
            data
        );


        /*
           SUMAR VISTA

           Esto usa la función RPC que
           acabas de crear en Supabase.
        */

        await addView(
            data.id
        );


    } catch (error) {

        console.error(
            "Error:",
            error
        );


        showError(
            "Error inesperado.",
            error.message
        );

    }

}


/* =========================================
   MOSTRAR PERFIL
========================================= */

function renderProfile(data) {

    /*
       APODO
    */

    displayName.textContent =
        data.display_name ||
        data.username ||
        "NØX User";


    /*
       USERNAME

       Este viene directamente de Supabase.
       No existe ningún input para modificarlo.
    */

    usernameElement.textContent =
        "@" +
        data.username;


    /*
       BIO
    */

    bio.textContent =
        data.bio ||
        "Welcome to my NØX profile.";


    /*
       VISTAS ACTUALES
    */

    const currentViews =
        Number(
            data.profile_views || 0
        );


    setViews(
        currentViews
    );


    /*
       AVATAR
    */

    renderAvatar(
        data
    );


    /*
       REDES
    */

    links.innerHTML = "";


    addLink(
        data.discord,
        "Discord"
    );


    addLink(
        data.instagram,
        "Instagram"
    );


    addLink(
        data.tiktok,
        "TikTok"
    );


    addLink(
        data.spotify,
        "Spotify"
    );


    addLink(
        data.youtube,
        "YouTube"
    );


    addLink(
        data.github,
        "GitHub"
    );


    /*
       FONDO
    */

    renderBackground(
        data
    );


    /*
       MÚSICA
    */

    renderMusic(
        data
    );


    /*
       MOSTRAR
    */

    loading.classList.add(
        "hidden"
    );


    profile.classList.remove(
        "hidden"
    );

}


/* =========================================
   AVATAR
========================================= */

function renderAvatar(data) {

    avatar.innerHTML = "";


    if (
        data.avatar_url
    ) {

        const img =
            document.createElement(
                "img"
            );


        img.src =
            data.avatar_url;


        img.alt =
            "Avatar";


        img.onerror =
            function() {

                avatar.textContent =
                    getFirstLetter(
                        data.display_name ||
                        data.username
                    );

            };


        avatar.appendChild(
            img
        );


    } else {

        avatar.textContent =
            getFirstLetter(
                data.display_name ||
                data.username
            );

    }

}


/* =========================================
   FONDO
========================================= */

function renderBackground(data) {

    if (
        !data.background_url
    ) {
        return;
    }


    const type =
        String(
            data.background_type || ""
        ).toLowerCase();


    if (
        type === "video" ||
        data.background_url
            .toLowerCase()
            .includes(".mp4")
    ) {

        backgroundVideo.src =
            data.background_url;


        backgroundVideo.style.display =
            "block";


        background.style.display =
            "none";


    } else {

        background.style.backgroundImage =
            `url("${escapeAttribute(
                data.background_url
            )}")`;

    }

}


/* =========================================
   MÚSICA
========================================= */

function renderMusic(data) {

    if (
        !data.music_url
    ) {
        return;
    }


    music.src =
        data.music_url;


    music.classList.remove(
        "hidden"
    );


    /*
       El navegador puede bloquear
       autoplay.

       Por eso intentamos reproducir
       solamente después de un clic.
    */

    document.addEventListener(
        "click",
        function playMusic() {

            music.play()
                .catch(
                    () => {}
                );

        },
        {
            once: true
        }
    );

}


/* =========================================
   AGREGAR LINK
========================================= */

function addLink(
    url,
    label
) {

    if (
        !url ||
        !String(url).trim()
    ) {
        return;
    }


    const a =
        document.createElement(
            "a"
        );


    a.className =
        "link";


    a.textContent =
        label +
        " ↗";


    a.href =
        normalizeUrl(
            String(url).trim()
        );


    a.target =
        "_blank";


    a.rel =
        "noopener noreferrer";


    links.appendChild(
        a
    );

}


/* =========================================
   NORMALIZAR URL
========================================= */

function normalizeUrl(url) {

    if (
        url.startsWith(
            "http://"
        ) ||
        url.startsWith(
            "https://"
        )
    ) {

        return url;

    }


    return (
        "https://" +
        url
    );

}


/* =========================================
   SUMAR VISTA
========================================= */

async function addView(
    profileId
) {

    try {

        const {
            error
        } =
            await supabase.rpc(
                "increment_profile_views",
                {
                    profile_uuid:
                        profileId
                }
            );


        if (error) {

            console.error(
                "No se pudo sumar la vista:",
                error
            );


            return;

        }


        /*
           La función de Supabase ya hizo
           +1 en la base de datos.

           Actualizamos visualmente el
           contador.
        */

        const text =
            views.textContent;


        const match =
            text.match(
                /(\d+)/
            );


        const oldNumber =
            match
                ? Number(match[1])
                : 0;


        const newNumber =
            oldNumber + 1;


        setViews(
            newNumber
        );


        console.log(
            "Vista agregada ✓"
        );


    } catch (error) {

        console.error(
            "Error RPC:",
            error
        );

    }

}


/* =========================================
   MOSTRAR VISTAS
========================================= */

function setViews(
    number
) {

    const safeNumber =
        Number(number) || 0;


    views.textContent =
        "👁️ " +
        safeNumber +
        (
            safeNumber === 1
                ? " vista"
                : " vistas"
        );

}


/* =========================================
   PRIMERA LETRA
========================================= */

function getFirstLetter(
    text
) {

    return String(
        text || "N"
    )
        .charAt(0)
        .toUpperCase();

}


/* =========================================
   ERROR
========================================= */

function showError(
    title,
    detail
) {

    loading.classList.add(
        "hidden"
    );


    profile.classList.remove(
        "hidden"
    );


    profile.innerHTML = `

        <div class="error">

            <strong>
                ${escapeHtml(title)}
            </strong>

            ${
                detail
                ? `
                    <small>
                        ${escapeHtml(detail)}
                    </small>
                  `
                : ""
            }

        </div>

    `;

}


/* =========================================
   ERROR FATAL
========================================= */

function showFatalError(
    text
) {

    document.body.innerHTML = `

        <div
            style="
                color:white;
                background:#050505;
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:30px;
                text-align:center;
                font-family:Arial;
            "
        >

            ${escapeHtml(text)}

        </div>

    `;

}


/* =========================================
   SEGURIDAD
========================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return String(
        value
    )
        .replaceAll(
            '"',
            "%22"
        )
        .replaceAll(
            "'",
            "%27"
        );

}

</script>

</body>
</html>
