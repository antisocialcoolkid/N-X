<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NØX — Profile Editor</title>

<style>
*{box-sizing:border-box}

:root{
  --accent:#fff;
  --text:#fff;
  --muted:#aaa;
  --border:rgba(255,255,255,.12);
  --card:rgba(10,10,10,.62);
  --shadow:rgba(0,0,0,.5);
}

html,body{
  margin:0;
  min-height:100%;
  background:#050505;
  color:var(--text);
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

/* BACKGROUND */

#bg,
#bgVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-5;
}

#bg{
  background:
    radial-gradient(circle at 50% 0%,#292929,#050505 65%);
  background-size:cover;
  background-position:center;
}

#bgVideo{
  display:none;
}

#darkOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:-4;
  pointer-events:none;
}

/* PARTICLES */

#particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:-2;
}

.particle{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:white;
  opacity:.5;
  animation:fall linear infinite;
}

@keyframes fall{
  from{transform:translateY(-20px)}
  to{transform:translateY(110vh)}
}

/* LAYOUT */

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:330px 1fr;
}

.editor{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:330px;
  padding:22px;
  overflow-y:auto;
  background:rgba(7,7,7,.96);
  border-right:1px solid var(--border);
  z-index:20;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.subtitle{
  color:#666;
  font-size:11px;
  margin-top:3px;
  margin-bottom:22px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.tab{
  padding:11px 8px;
  border:1px solid transparent;
  border-radius:9px;
  background:#101010;
  color:#888;
  cursor:pointer;
}

.tab:hover,
.tab.active{
  color:white;
  border-color:#292929;
  background:#171717;
}

.section{
  display:none;
  margin-top:18px;
}

.section.active{
  display:block;
}

.card{
  padding:16px;
  margin-bottom:12px;
  border:1px solid #242424;
  border-radius:14px;
  background:#0d0d0d;
}

.card h2{
  font-size:15px;
  margin:0 0 5px;
}

.card p{
  margin:0 0 13px;
  color:#777;
  font-size:11px;
}

label{
  display:block;
  color:#aaa;
  font-size:11px;
  margin:12px 0 6px;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  border:1px solid #292929;
  border-radius:8px;
  background:#141414;
  color:#fff;
  outline:none;
}

textarea
