<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NØX Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #222 0%,
                    #080808 55%,
                    #000 100%
                );

            color: white;
            font-family: Arial, sans-serif;
        }

        .loading {
            color: #aaa;
            font-size: 14px;
        }

        .profile {
            width: 100%;
            max-width: 460px;
            padding: 35px 25px;

            text-align: center;

            background: rgba(10,10,10,.82);
            border: 1px solid #292929;
            border-radius: 24px;

            box-shadow:
                0 20px 80px rgba(0,0,0,.6);

            backdrop-filter: blur(15px);

            animation: show .4s ease;
        }

        @keyframes show {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 105px;
            height: 105px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 50%;
            border: 3px solid white;

            background: #181818;

            font-size: 35px;
            font-weight: bold;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .display-name {
            margin-top: 18px;

            font-size: 27px;
            font-weight: 800;
        }

        .username {
            margin-top: 5px;

            color: #777;
            font-size: 13px;
        }

        .bio {
            margin-top: 18px;

            color: #aaa;
            line-height: 1.5;
            font-size: 14px;
        }

        .views {
            margin-top: 15px;

            color: #777;
            font-size: 12px;
        }

        .links {
            margin-top: 22px;

            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .link {
            display: block;

            padding: 13px;

            color: white;
            text-decoration: none;

            background: #111;

            border: 1px solid #292929;
            border-radius: 11px;

            transition: .2s;
        }

        .link:hover {
            transform: translateY(-2px);

            background: #181818;

            box-shadow:
                0 0 20px rgba(255,255,255,.08);
        }

        .error {
            color: #ff7070;
            text-align: center;
            max-width: 400px;
        }

        .hidden {
            display: none !important;
        }

        #backgroundImage {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;

            display: none;
        }

        #backgroundVideo {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;

            display: none;
        }

        .background-overlay {
            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.45);

            z-index: -1;
        }
    </style>

    <!-- SUPABASE SE CARGA ANTES DEL CÓDIGO PRINCIPAL -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <img
        id="backgroundImage"
        alt=""
    >

    <video
        id="backgroundVideo"
        autoplay
        muted
        loop
        playsinline
    ></video>

    <div class="background-overlay"></div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >
        Loading profile...
    </div>


    <!-- PERFIL -->

    <main
        id="profile"
        class="profile hidden"
    >

        <div
            id="avatar"
            class="avatar"
        >
            N
        </div>


        <div
            id="displayName"
            class="display-name"
        >
            NØX User
        </div>


        <!-- AQUÍ APARECE EL USERNAME REAL -->

        <div
            id="username"
            class="username"
        >
            @username
        </div>


        <div
            id="bio"
            class="bio"
        >
            Welcome to my NØX profile.
        </div>


        <div
            id="views"
            class="views"
        >
            👁️ 0 vistas
        </div>


        <div
            id="links"
            class="links"
        ></div>

    </main>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* ==========================================
   COMPROBAR SUPABASE
========================================== */

if (
    !window.supabase ||
    !window.supabase.createClient
) {

    document.getElementById("loading").textContent =
        "❌ No se pudo cargar Supabase.";

    throw new Error(
        "Supabase JS no está cargado."
    );
}


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   ELEMENTOS
========================================== */

const loading =
    document.getElementById("loading");

const profile =
    document.getElementById("profile");

const avatar =
    document.getElementById("avatar");

const displayName =
    document.getElementById("displayName");

const usernameElement =
    document.getElementById("username");

const bio =
    document.getElementById("bio");

const views =
    document.getElementById("views");

const links =
    document.getElementById("links");

const backgroundImage =
    document.getElementById("backgroundImage");

const backgroundVideo =
    document.getElementById("backgroundVideo");


/* ==========================================
   USERNAME DE LA URL
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const requestedUsername =
    params.get("username");


/* ==========================================
   MOSTRAR ERROR
========================================== */

function showError(message) {

    loading.classList.add(
        "hidden"
    );

    profile.classList.remove(
        "hidden"
    );

    profile.innerHTML = `
        <div class="error">
            ${escapeHTML(message)}
        </div>
    `;
}


/* ==========================================
   ESCAPAR HTML
========================================== */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ==========================================
   PRIMERA LETRA
========================================== */

function getFirstLetter(value) {

    return (
        value ||
        "N"
    )
    .charAt(0)
    .toUpperCase();
}


/* ==========================================
   URL
========================================== */

function normalizeURL(value) {

    if (
        value.startsWith("https://") ||
        value.startsWith("http://")
    ) {

        return value;
    }

    return "https://" + value;
}


/* ==========================================
   AGREGAR LINK
========================================== */

function addLink(
    value,
    label
) {

    if (!value) {
        return;
    }


    const a =
        document.createElement("a");


    a.className =
        "link";


    a.textContent =
        label + " ↗";


    a.href =
        normalizeURL(
            value
        );


    a.target =
        "_blank";


    a.rel =
        "noopener noreferrer";


    links.appendChild(a);
}


/* ==========================================
   MOSTRAR PERFIL
========================================== */

function renderProfile(data) {

    /*
       APODO
    */

    displayName.textContent =
        data.display_name ||
        data.username ||
        "NØX User";


    /*
       USERNAME
       NO SE PUEDE CAMBIAR DESDE AQUÍ
    */

    usernameElement.textContent =
        "@" + data.username;


    /*
       BIO
    */

    bio.textContent =
        data.bio ||
        "Welcome to my NØX profile.";


    /*
       AVATAR
    */

    avatar.innerHTML = "";


    if (data.avatar_url) {

        const img =
            document.createElement("img");

        img.src =
            data.avatar_url;

        img.alt =
            "Avatar";


        img.onerror =
            function() {

                avatar.textContent =
                    getFirstLetter(
                        data.username
                    );
            };


        avatar.appendChild(img);

    } else {

        avatar.textContent =
            getFirstLetter(
                data.display_name ||
                data.username
            );
    }


    /*
       LINKS
    */

    links.innerHTML = "";


    addLink(
        data.discord,
        "Discord"
    );


    addLink(
        data.instagram,
        "Instagram"
    );


    addLink(
        data.tiktok,
        "TikTok"
    );


    addLink(
        data.youtube,
        "YouTube"
    );


    addLink(
        data.github,
        "GitHub"
    );


    addLink(
        data.spotify,
        "Spotify"
    );


    /*
       VISTAS ACTUALES
    */

    const currentViews =
        Number(
            data.profile_views || 0
        );


    views.textContent =
        "👁️ " +
        currentViews +
        (
            currentViews === 1
                ? " vista"
                : " vistas"
        );


    /*
       FONDO
    */

    if (
        data.background_url
    ) {

        if (
            data.background_type ===
            "video"
        ) {

            backgroundVideo.src =
                data.background_url;

            backgroundVideo.style.display =
                "block";

        } else {

            backgroundImage.src =
                data.background_url;

            backgroundImage.style.display =
                "block";
        }
    }


    /*
       MOSTRAR
    */

    loading.classList.add(
        "hidden"
    );

    profile.classList.remove(
        "hidden"
    );
}


/* ==========================================
   SUMAR VISTA
========================================== */

async function addProfileView(
    profileID,
    oldViews
) {

    try {

        const {
            error
        } =
        await supabase.rpc(
            "increment_profile_views",
            {
                profile_uuid:
                    profileID
            }
        );


        if (error) {

            console.error(
                "Error RPC:",
                error
            );

            return;
        }


        /*
           +1 VISUALMENTE
        */

        const newViews =
            Number(oldViews || 0) + 1;


        views.textContent =
            "👁️ " +
            newViews +
            (
                newViews === 1
                    ? " vista"
                    : " vistas"
            );

    } catch (error) {

        console.error(
            "Error contando vista:",
            error
        );
    }
}


/* ==========================================
   CARGAR PERFIL
========================================== */

async function loadProfile() {

    console.log(
        "NØX: iniciando..."
    );


    if (!requestedUsername) {

        showError(
            "No se indicó ningún username."
        );

        return;
    }


    const cleanUsername =
        requestedUsername
            .trim()
            .toLowerCase();


    console.log(
        "NØX: buscando @" +
        cleanUsername
    );


    try {

        const {
            data,
            error
        } =
        await supabase
            .from("profiles")
            .select("*")
            .eq(
                "username",
                cleanUsername
            )
            .maybeSingle();


        console.log(
            "NØX: respuesta:",
            data,
            error
        );


        if (error) {

            showError(
                "Error Supabase: " +
                error.message
            );

            return;
        }


        if (!data) {

            showError(
                "El perfil @" +
                cleanUsername +
                " no existe."
            );

            return;
        }


        /*
           PERFIL ENCONTRADO
        */

        renderProfile(data);


        /*
           SUMAR VISTA
        */

        await addProfileView(
            data.id,
            data.profile_views
        );


    } catch (error) {

        console.error(
            error
        );


        showError(
            "Error: " +
            error.message
        );
    }
}


/* ==========================================
   INICIAR
========================================== */

loadProfile();

</script>

</body>
</html>
