<script>
const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const loading =
document.getElementById("loading");

const profile =
document.getElementById("profile");

const params =
new URLSearchParams(
    window.location.search
);

const username =
params.get("username");

async function loadProfile(){

    loading.textContent =
        "1/4 — JavaScript funciona ✓";

    if(!username){

        loading.textContent =
            "❌ Falta ?username=";

        return;
    }

    loading.textContent =
        "2/4 — Buscando @" +
        username +
        "...";

    try{

        const { data, error } =
        await supabase
        .from("profiles")
        .select("*")
        .eq(
            "username",
            username.toLowerCase()
        )
        .maybeSingle();

        if(error){

            console.error(error);

            loading.textContent =
                "❌ SUPABASE: " +
                error.message;

            return;
        }

        if(!data){

            loading.textContent =
                "❌ Perfil no encontrado";

            return;
        }

        loading.textContent =
            "3/4 — Perfil encontrado ✓";

        document.getElementById("name")
            .textContent =
            data.display_name ||
            data.username;

        document.getElementById("username")
            .textContent =
            "@" + data.username;

        document.getElementById("bio")
            .textContent =
            data.bio ||
            "Welcome to my NØX profile.";

        document.getElementById("views")
            .textContent =
            "👁️ " +
            (data.profile_views || 0) +
            " vistas";

        if(data.avatar_url){

            const img =
            document.createElement("img");

            img.src =
                data.avatar_url;

            document.getElementById("avatar")
                .innerHTML = "";

            document.getElementById("avatar")
                .appendChild(img);

        }

        loading.textContent =
            "4/4 — ¡PERFIL ENCONTRADO! ✓";

        setTimeout(
            () => {

                loading.classList.add(
                    "hidden"
                );

                profile.classList.remove(
                    "hidden"
                );

            },
            500
        );

        /* SUMAR VISTA */

        const result =
        await supabase.rpc(
            "increment_profile_views",
            {
                profile_uuid:data.id
            }
        );

        if(result.error){

            console.error(
                "Error al sumar vista:",
                result.error
            );

        }

    }catch(error){

        console.error(error);

        loading.textContent =
            "❌ ERROR: " +
            error.message;

    }
}

loadProfile();
</script>
