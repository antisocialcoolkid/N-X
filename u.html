<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#030303"
>

<title>NØX Profile</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #222 0%,
            #090909 40%,
            #030303 80%
        );

    color:#fff;

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

.background{

    position:fixed;

    inset:0;

    z-index:-1;

    overflow:hidden;

    pointer-events:none;
}


.glow{

    position:absolute;

    width:500px;

    height:500px;

    border-radius:50%;

    background:#fff;

    filter:blur(150px);

    opacity:.06;

    animation:
        glowMove
        12s
        ease-in-out
        infinite;
}


.glow.one{

    top:-300px;

    left:-250px;
}


.glow.two{

    right:-300px;

    bottom:-300px;

    animation-delay:-6s;
}


@keyframes glowMove{

    0%,100%{

        transform:
            translate(0,0)
            scale(1);

    }

    50%{

        transform:
            translate(50px,40px)
            scale(1.15);

    }

}


/* =========================
   LOGO
========================= */

.logo{

    position:fixed;

    top:25px;

    left:30px;

    color:#fff;

    text-decoration:none;

    font-size:24px;

    font-weight:950;

    letter-spacing:-1px;

    transition:.2s;
}


.logo:hover{

    opacity:.6;

    transform:
        translateY(-2px);

}


/* =========================
   CARD
========================= */

.profile{

    width:min(
        520px,
        100%
    );

    padding:
        42px
        28px
        30px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:24px;

    background:
        rgba(8,8,8,.94);

    backdrop-filter:
        blur(20px);

    box-shadow:

        0 40px 120px
        rgba(0,0,0,.7),

        inset
        0 1px
        rgba(255,255,255,.03);

    text-align:center;

    animation:
        profileIn
        .7s
        ease
        both;
}


@keyframes profileIn{

    from{

        opacity:0;

        transform:
            translateY(25px)
            scale(.97);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================
   AVATAR
========================= */

.avatar{

    width:105px;

    height:105px;

    margin:auto;

    border-radius:50%;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid
        #3a3a3a;

    background:
        linear-gradient(
            145deg,
            #292929,
            #0b0b0b
        );

    font-size:36px;

    font-weight:950;

    box-shadow:

        0 20px 60px
        rgba(0,0,0,.6),

        0 0 40px
        rgba(255,255,255,.04);
}


.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}


/* =========================
   USERNAME
========================= */

.username{

    margin-top:21px;

    font-size:29px;

    font-weight:950;

    letter-spacing:-1px;

}


/* =========================
   HANDLE
========================= */

.handle{

    margin-top:7px;

    color:#555;

    font-size:12px;

}


/* =========================
   BIO
========================= */

.bio{

    max-width:430px;

    margin:
        20px
        auto
        0;

    color:#777;

    font-size:13px;

    line-height:1.7;

}


/* =========================
   LINKS
========================= */

.links{

    display:grid;

    gap:9px;

    margin-top:27px;

}


.link{

    display:block;

    padding:15px;

    border:
        1px solid
        #222;

    border-radius:10px;

    background:
        rgba(255,255,255,.025);

    color:#aaa;

    text-decoration:none;

    font-size:11px;

    font-weight:800;

    transition:.25s ease;

}


.link:hover{

    color:#fff;

    border-color:#444;

    background:#111;

    transform:
        translateY(-3px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

}


/* =========================
   LOADING
========================= */

.loading{

    color:#666;

    font-size:10px;

    font-weight:800;

    letter-spacing:3px;

    animation:
        loadingPulse
        1.5s
        infinite;

}


@keyframes loadingPulse{

    0%,100%{

        opacity:.35;

    }

    50%{

        opacity:1;

    }

}


/* =========================
   ERROR
========================= */

.error{

    color:#ff6868;

    font-size:13px;

    line-height:1.7;

}


.error-title{

    font-size:24px;

    font-weight:900;

}


.error-text{

    margin-top:12px;

    color:#777;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{

        padding:20px;

    }


    .logo{

        top:20px;

        left:20px;

        font-size:21px;

    }


    .profile{

        padding:
            35px
            20px
            28px;

        border-radius:19px;

    }


    .avatar{

        width:90px;

        height:90px;

        font-size:30px;

    }


    .username{

        font-size:25px;

    }

}

</style>

</head>


<body>


<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

</div>


<a
    href="index.html"
    class="logo"
>
    NØX
</a>


<main
    id="app"
    class="profile"
>

    <div class="loading">

        LOADING PROFILE...

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const app =
document.getElementById("app");


/* =========================
   GET USERNAME
========================= */

const params =
new URLSearchParams(
    window.location.search
);


const username =
params.get("username");


if(!username){

    showError(
        "Falta el username",
        "Usa ?username=tuusuario en la URL."
    );

}else{

    loadProfile(
        username
    );

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(
    username
){

    const cleanUsername =
        username
        .trim()
        .toLowerCase();


    try{

        const result =
        await supabase

        .from("profiles")

        .select(`
            id,
            username,
            avatar_url,
            bio,
            github,
            youtube,
            theme,
            discord_id,
            discord_username,
            created_at,
            discord
        `)

        .eq(
            "username",
            cleanUsername
        )

        .maybeSingle();


        console.log(
            "NØX PROFILE:",
            result
        );


        if(result.error){

            showError(
                "Error de Supabase",
                result.error.message
            );

            return;

        }


        if(!result.data){

            showError(
                "Perfil no encontrado",
                "No existe @" +
                cleanUsername +
                " en la tabla profiles."
            );

            return;

        }


        renderProfile(
            result.data
        );


    }catch(error){

        console.error(
            error
        );


        showError(
            "Error",
            error.message
        );

    }

}


/* =========================
   RENDER PROFILE
========================= */

function renderProfile(
    profile
){

    const username =
        profile.username || "";


    const bio =
        profile.bio ||
        "Welcome to my NØX profile.";


    /* AVATAR */

    let avatarHTML;


    if(profile.avatar_url){

        avatarHTML = `

            <img
                src="${escapeHTML(
                    profile.avatar_url
                )}"
                alt="Avatar"
                onerror="
                    this.style.display='none';
                    this.parentElement.textContent='${escapeHTML(
                        username
                        .charAt(0)
                        .toUpperCase()
                    )}';
                "
            >

        `;

    }else{

        avatarHTML =

            escapeHTML(
                username
                .charAt(0)
                .toUpperCase()
            );

    }


    /* LINKS */

    let linksHTML = "";


    /* DISCORD USERNAME */

    if(profile.discord_username){

        linksHTML += createLink(
            discordURL(
                profile.discord_username
            ),
            "Discord ↗"
        );

    }

    else if(profile.discord){

        linksHTML += createLink(
            profile.discord,
            "Discord ↗"
        );

    }


    /* GITHUB */

    if(profile.github){

        linksHTML += createLink(
            profile.github,
            "GitHub ↗"
        );

    }


    /* YOUTUBE */

    if(profile.youtube){

        linksHTML += createLink(
            profile.youtube,
            "YouTube ↗"
        );

    }


    /* THEME */

    applyTheme(
        profile.theme
    );


    /* TITLE */

    document.title =
        "@" +
        username +
        " — NØX";


    /* HTML */

    app.innerHTML = `

        <div class="avatar">

            ${avatarHTML}

        </div>


        <h1 class="username">

            @${escapeHTML(
                username
            )}

        </h1>


        <div class="handle">

            NØX Profile

        </div>


        <p class="bio">

            ${escapeHTML(
                bio
            )}

        </p>


        <div class="links">

            ${linksHTML}

        </div>

    `;

}


/* =========================
   DISCORD URL
========================= */

function discordURL(
    username
){

    const clean =
        String(username)
        .trim();


    if(
        clean.startsWith(
            "http://"
        ) ||
        clean.startsWith(
            "https://"
        )
    ){

        return clean;

    }


    return (
        "https://discord.com/users/" +
        encodeURIComponent(
            clean
        )
    );

}


/* =========================
   CREATE LINK
========================= */

function createLink(
    url,
    text
){

    let clean =
        String(url)
        .trim();


    if(
        !clean.startsWith(
            "http://"
        ) &&
        !clean.startsWith(
            "https://"
        )
    ){

        clean =
            "https://" +
            clean;

    }


    return `

        <a
            class="link"
            href="${escapeHTML(
                clean
            )}"
            target="_blank"
            rel="noopener noreferrer"
        >

            ${text}

        </a>

    `;

}


/* =========================
   THEME
========================= */

function applyTheme(
    theme
){

    if(!theme){

        return;

    }


    try{

        const parsed =
            typeof theme === "string"
            ?
            JSON.parse(theme)
            :
            theme;


        if(
            parsed.background
        ){

            document.body.style.background =
                parsed.background;

        }


        if(
            parsed.accent
        ){

            document.documentElement
                .style
                .setProperty(
                    "--accent",
                    parsed.accent
                );

        }

    }catch(e){

        console.log(
            "Theme simple:",
            theme
        );

    }

}


/* =========================
   ERROR
========================= */

function showError(
    title,
    text
){

    app.innerHTML = `

        <div class="error">

            <div class="error-title">

                ❌ ${escapeHTML(
                    title
                )}

            </div>


            <div class="error-text">

                ${escapeHTML(
                    text
                )}

            </div>

        </div>

    `;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
    value
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
        ?
        ""
        :
        String(value);


    return div.innerHTML;

}

</script>


</body>

</html>
