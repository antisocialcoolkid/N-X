<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Perfil</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:#050505;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#loading{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050505;

    color:#aaa;

    font-size:15px;

    z-index:9999;
}

.hidden{
    display:none !important;
}

#profile{
    width:100%;
    max-width:470px;

    padding:35px 25px;

    text-align:center;

    background:rgba(15,15,15,.85);

    border:1px solid #292929;
    border-radius:24px;

    backdrop-filter:blur(18px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.6);
}

.avatar{
    width:105px;
    height:105px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;
    border:3px solid #fff;

    background:#181818;

    font-size:35px;
    font-weight:900;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:18px;

    font-size:28px;
    font-weight:900;
}

.username{
    margin-top:5px;

    color:#888;
    font-size:14px;
}

.bio{
    margin:18px auto 0;

    max-width:380px;

    color:#bbb;

    font-size:14px;
    line-height:1.5;
}

.views{
    margin-top:15px;

    color:#777;

    font-size:13px;
}

.links{
    display:flex;
    flex-direction:column;

    gap:9px;

    margin-top:22px;
}

.link{
    display:block;

    padding:13px;

    color:white;
    text-decoration:none;

    background:#111;

    border:1px solid #292929;

    border-radius:11px;

    transition:.2s;
}

.link:hover{
    transform:translateY(-2px);

    background:#181818;

    box-shadow:
        0 0 20px rgba(255,255,255,.12);
}

.error{
    color:#ff7070;

    text-align:center;

    padding:25px;
}

</style>


<!-- ================================
     SUPABASE
================================ -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

</head>


<body>


<!-- ================================
     LOADING
================================ -->

<div id="loading">
    Cargando perfil...
</div>


<!-- ================================
     PERFIL
================================ -->

<main
    id="profile"
    class="hidden"
>

    <div
        id="avatar"
        class="avatar"
    >
        N
    </div>


    <div
        id="name"
        class="name"
    >
        NØX User
    </div>


    <div
        id="username"
        class="username"
    >
        @username
    </div>


    <div
        id="bio"
        class="bio"
    >
        Welcome to my NØX profile.
    </div>


    <div
        id="views"
        class="views"
    >
        👁️ 0 vistas
    </div>


    <div
        id="links"
        class="links"
    ></div>

</main>


<script>

/* =================================
   CONFIGURACIÓN
================================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* =================================
   SUPABASE CLIENT
================================= */

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   ELEMENTOS
================================= */

const loading =
document.getElementById(
    "loading"
);

const profile =
document.getElementById(
    "profile"
);

const avatar =
document.getElementById(
    "avatar"
);

const nameElement =
document.getElementById(
    "name"
);

const usernameElement =
document.getElementById(
    "username"
);

const bioElement =
document.getElementById(
    "bio"
);

const viewsElement =
document.getElementById(
    "views"
);

const linksElement =
document.getElementById(
    "links"
);


/* =================================
   URL
================================= */

const params =
new URLSearchParams(
    window.location.search
);

const username =
params.get(
    "username"
);


/* =================================
   ERROR
================================= */

function showError(
    message
){

    loading.textContent =
        "❌ " + message;

}


/* =================================
   PRIMERA LETRA
================================= */

function firstLetter(
    text
){

    return (
        text || "N"
    )
    .charAt(0)
    .toUpperCase();

}


/* =================================
   URL DE LINK
================================= */

function normalizeUrl(
    url
){

    url =
        url.trim();

    if(
        url.startsWith(
            "http://"
        ) ||
        url.startsWith(
            "https://"
        )
    ){

        return url;

    }

    return (
        "https://" +
        url
    );

}


/* =================================
   CREAR LINK
================================= */

function addLink(
    url,
    title
){

    if(
        !url ||
        !url.trim()
    ){

        return;

    }

    const link =
    document.createElement(
        "a"
    );

    link.className =
        "link";

    link.textContent =
        title + " ↗";

    link.href =
        normalizeUrl(
            url
        );

    link.target =
        "_blank";

    link.rel =
        "noopener noreferrer";

    linksElement.appendChild(
        link
    );

}


/* =================================
   MOSTRAR PERFIL
================================= */

function renderProfile(
    data
){

    nameElement.textContent =
        data.display_name ||
        data.username ||
        "NØX User";


    usernameElement.textContent =
        "@" +
        data.username;


    bioElement.textContent =
        data.bio ||
        "Welcome to my NØX profile.";


    const views =
        Number(
            data.profile_views || 0
        );


    viewsElement.textContent =
        "👁️ " +
        views +
        (
            views === 1
            ? " vista"
            : " vistas"
        );


    /* AVATAR */

    avatar.innerHTML = "";


    if(
        data.avatar_url
    ){

        const img =
        document.createElement(
            "img"
        );

        img.src =
            data.avatar_url;

        img.alt =
            "Avatar";

        img.onerror =
        function(){

            avatar.textContent =
                firstLetter(
                    data.display_name ||
                    data.username
                );

        };

        avatar.appendChild(
            img
        );

    }else{

        avatar.textContent =
            firstLetter(
                data.display_name ||
                data.username
            );

    }


    /* LINKS */

    linksElement.innerHTML = "";


    addLink(
        data.discord,
        "Discord"
    );

    addLink(
        data.instagram,
        "Instagram"
    );

    addLink(
        data.tiktok,
        "TikTok"
    );

    addLink(
        data.youtube,
        "YouTube"
    );

    addLink(
        data.github,
        "GitHub"
    );

    addLink(
        data.spotify,
        "Spotify"
    );


    /* MOSTRAR */

    loading.classList.add(
        "hidden"
    );

    profile.classList.remove(
        "hidden"
    );

}


/* =================================
   CARGAR PERFIL
================================= */

async function loadProfile(){

    if(!username){

        showError(
            "No se indicó un username."
        );

        return;

    }


    const cleanUsername =
        username
        .trim()
        .toLowerCase();


    try{

        const result =
        await supabase
        .from("profiles")
        .select("*")
        .eq(
            "username",
            cleanUsername
        )
        .maybeSingle();


        if(result.error){

            console.error(
                result.error
            );

            showError(
                result.error.message
            );

            return;

        }


        if(!result.data){

            showError(
                "Perfil @" +
                cleanUsername +
                " no encontrado."
            );

            return;

        }


        const data =
            result.data;


        /* MOSTRAR PERFIL */

        renderProfile(
            data
        );


        /* =================================
           SUMAR VISTA
        ================================= */

        const viewResult =
        await supabase.rpc(
            "increment_profile_views",
            {
                profile_uuid:
                    data.id
            }
        );


        if(viewResult.error){

            console.error(
                "No se pudo sumar la vista:",
                viewResult.error
            );

            return;

        }


        /* ACTUALIZAR CONTADOR */

        const newViews =
            Number(
                data.profile_views || 0
            ) + 1;


        viewsElement.textContent =
            "👁️ " +
            newViews +
            (
                newViews === 1
                ? " vista"
                : " vistas"
            );

    }
    catch(error){

        console.error(
            error
        );

        showError(
            error.message
        );

    }

}


/* =================================
   INICIAR
================================= */

loadProfile();

</script>

</body>
</html>
