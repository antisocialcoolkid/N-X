<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030303">

<title>NØX Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 0%,#202020 0%,#090909 40%,#030303 80%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.bg{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
}

.glow{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    background:#fff;
    filter:blur(150px);
    opacity:.06;
}

.glow1{
    top:-250px;
    left:-200px;
}

.glow2{
    right:-250px;
    bottom:-250px;
}

.logo{
    position:fixed;
    top:25px;
    left:30px;
    color:#fff;
    text-decoration:none;
    font-size:24px;
    font-weight:900;
    letter-spacing:-1px;
}

.card{
    width:min(520px,100%);
    padding:42px 28px 32px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    background:rgba(9,9,9,.96);
    box-shadow:0 40px 120px rgba(0,0,0,.7);
    text-align:center;
}

.avatar{
    width:105px;
    height:105px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#292929,#0b0b0b);
    border:1px solid #3a3a3a;
    font-size:36px;
    font-weight:900;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:22px;
    font-size:29px;
    font-weight:900;
}

.username{
    margin-top:7px;
    color:#555;
    font-size:12px;
}

.bio{
    margin:20px auto 0;
    max-width:430px;
    color:#777;
    font-size:13px;
    line-height:1.7;
}

.links{
    display:grid;
    gap:9px;
    margin-top:27px;
}

.link{
    display:block;
    padding:15px;
    border:1px solid #222;
    border-radius:10px;
    background:#0b0b0b;
    color:#aaa;
    text-decoration:none;
    font-size:11px;
    font-weight:800;
    transition:.2s;
}

.link:hover{
    color:#fff;
    border-color:#444;
    transform:translateY(-3px);
}

.status{
    color:#777;
    font-size:11px;
    line-height:1.7;
}

.error{
    color:#ff6868;
}

.back{
    display:inline-block;
    margin-top:20px;
    padding:11px 17px;
    border:1px solid #292929;
    border-radius:9px;
    color:#aaa;
    text-decoration:none;
    font-size:10px;
    font-weight:800;
}

@media(max-width:600px){
    .logo{
        top:20px;
        left:20px;
    }

    .card{
        padding:35px 20px 28px;
    }

    .avatar{
        width:90px;
        height:90px;
        font-size:30px;
    }

    .name{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
</div>

<a href="index.html" class="logo">NØX</a>

<main id="app" class="card">
    <div class="status">
        CARGANDO PERFIL...
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";

const app =
document.getElementById("app");


async function start(){

    if(!window.supabase){

        error(
            "Supabase no cargó",
            "La librería de Supabase no pudo iniciarse."
        );

        return;
    }


    const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    const params =
    new URLSearchParams(
        window.location.search
    );


    const username =
    params.get("username");


    if(!username){

        error(
            "Falta el username",
            "Usa ?username=tuusuario en la URL."
        );

        return;
    }


    const clean =
    username
    .trim()
    .toLowerCase();


    try{

        const result =
        await client
        .from("profiles")
        .select("*")
        .eq("username",clean)
        .maybeSingle();


        console.log(result);


        if(result.error){

            error(
                "Error de Supabase",
                result.error.message
            );

            return;
        }


        if(!result.data){

            error(
                "Perfil no encontrado",
                "No existe @" + clean +
                " en profiles."
            );

            return;
        }


        render(
            result.data
        );


    }catch(e){

        error(
            "Error",
            e.message
        );

    }
}


function render(p){

    const username =
    p.username || "";

    const name =
    p.display_name ||
    username ||
    "NØX";

    const bio =
    p.bio || "";


    let avatar = "";

    if(p.avatar_url){

        avatar =
        "<img src=\"" +
        esc(p.avatar_url) +
        "\" alt=\"Avatar\">";

    }else{

        avatar =
        esc(
            name
            .charAt(0)
            .toUpperCase()
        );

    }


    let links = "";


    if(p.discord){

        links += link(
            p.discord,
            "Discord ↗"
        );

    }


    if(p.youtube){

        links += link(
            p.youtube,
            "YouTube ↗"
        );

    }


    if(p.github){

        links += link(
            p.github,
            "GitHub ↗"
        );

    }


    document.title =
    "@" + username + " — NØX";


    app.innerHTML =

    "<div class=\"avatar\">" +
        avatar +
    "</div>" +

    "<h1 class=\"name\">" +
        esc(name) +
    "</h1>" +

    "<div class=\"username\">" +
        "@" + esc(username) +
    "</div>" +

    (
        bio
        ?
        "<p class=\"bio\">" +
            esc(bio) +
        "</p>"
        :
        ""
    ) +

    "<div class=\"links\">" +
        links +
    "</div>";
}


function link(url,text){

    let u =
    String(url).trim();


    if(
        !u.startsWith("http://") &&
        !u.startsWith("https://")
    ){

        u =
        "https://" + u;

    }


    return (
        "<a class=\"link\" " +
        "href=\"" + esc(u) + "\" " +
        "target=\"_blank\" " +
        "rel=\"noopener noreferrer\">" +
        text +
        "</a>"
    );
}


function error(title,text){

    app.innerHTML =

    "<h1 class=\"error\">" +
        esc(title) +
    "</h1>" +

    "<p class=\"status\" style=\"margin-top:12px\">" +
        esc(text) +
    "</p>" +

    "<a class=\"back\" href=\"index.html\">" +
        "← Volver a NØX" +
    "</a>";
}


function esc(value){

    const div =
    document.createElement("div");

    div.textContent =
    value == null ? "" : String(value);

    return div.innerHTML;
}


start();

</script>

</body>
</html>
