<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NØX — Perfil</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

#background{
    position:fixed;
    inset:0;
    z-index:-3;
    background:
        radial-gradient(
            circle at 50% 0%,
            #292929,
            #050505 65%
        );
    background-size:cover;
    background-position:center;
}

#backgroundVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    display:none;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:-1;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:#999;
    z-index:100;
}

.hidden{
    display:none !important;
}

.profile{
    width:100%;
    max-width:470px;
    padding:35px 25px;
    border:1px solid #292929;
    border-radius:22px;
    background:rgba(10,10,10,.82);
    backdrop-filter:blur(18px);
    box-shadow:0 30px 100px rgba(0,0,0,.55);
    text-align:center;
    animation:appear .5s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(15px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.avatar{
    width:105px;
    height:105px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:50%;
    border:4px solid white;
    background:#1b1b1b;
    font-size:35px;
    font-weight:900;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:18px;
    font-size:28px;
    font-weight:900;
}

.username{
    margin-top:5px;
    color:#888;
    font-size:13px;
}

.bio{
    margin:18px auto 0;
    max-width:380px;
    color:#bbb;
    line-height:1.55;
    font-size:14px;
}

.views{
    margin-top:15px;
    color:#777;
    font-size:12px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-top:22px;
}

.link{
    display:block;
    padding:13px;
    border:1px solid #292929;
    border-radius:10px;
    background:#111;
    color:white;
    text-decoration:none;
    transition:.2s;
}

.link:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(255,255,255,.12);
}

#error{
    text-align:center;
    color:#ff7070;
}

#music{
    width:100%;
    margin-top:18px;
}
</style>
</head>

<body>

<div id="loading">
    Cargando perfil...
</div>

<div id="background"></div>

<video
    id="backgroundVideo"
    autoplay
    muted
    loop
    playsinline
></video>

<div class="overlay"></div>

<main id="profile" class="profile hidden">

    <div id="avatar" class="avatar">
        N
    </div>

    <div id="name" class="name">
        NØX User
    </div>

    <div id="username" class="username">
        @username
    </div>

    <div id="bio" class="bio">
        Welcome to my NØX profile.
    </div>

    <div id="views" class="views">
        👁️ 0 vistas
    </div>

    <div id="links" class="links"></div>

    <audio
        id="music"
        controls
        class="hidden"
    ></audio>

</main>


<!-- =====================================
     SUPABASE SE CARGA PRIMERO
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =====================================
     CÓDIGO PRINCIPAL
====================================== -->

<script>

"use strict";


/* =====================================
   SUPABASE
====================================== */

const SUPABASE_URL =
    "https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/*
   Comprobamos que la librería
   realmente esté cargada.
*/

if(
    !window.supabase ||
    typeof window.supabase.createClient !== "function"
){

    throw new Error(
        "Supabase JS no se pudo cargar."
    );

}


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================
   ELEMENTOS
====================================== */

const loading =
    document.getElementById("loading");

const profile =
    document.getElementById("profile");

const avatar =
    document.getElementById("avatar");

const nameElement =
    document.getElementById("name");

const usernameElement =
    document.getElementById("username");

const bioElement =
    document.getElementById("bio");

const viewsElement =
    document.getElementById("views");

const linksElement =
    document.getElementById("links");

const background =
    document.getElementById("background");

const backgroundVideo =
    document.getElementById("backgroundVideo");

const music =
    document.getElementById("music");


/* =====================================
   USERNAME
====================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const username =
    params.get("username");


/* =====================================
   CARGAR PERFIL
====================================== */

async function loadProfile(){

    try{

        if(!username){

            showError(
                "❌ No se especificó ningún username."
            );

            return;

        }


        const cleanUsername =
            username
                .trim()
                .toLowerCase();


        console.log(
            "Buscando perfil:",
            cleanUsername
        );


        const result =
            await supabase
                .from("profiles")
                .select("*")
                .eq(
                    "username",
                    cleanUsername
                )
                .maybeSingle();


        const data =
            result.data;

        const error =
            result.error;


        if(error){

            console.error(
                "Error Supabase:",
                error
            );

            showError(
                "❌ " +
                error.message
            );

            return;

        }


        if(!data){

            showError(
                "❌ Perfil no encontrado."
            );

            return;

        }


        console.log(
            "Perfil encontrado:",
            data
        );


        /*
           MOSTRAR PERFIL
        */

        renderProfile(data);


        /*
           SUMAR VISTA
        */

        const viewResult =
            await supabase.rpc(
                "increment_profile_views",
                {
                    profile_uuid:data.id
                }
            );


        if(viewResult.error){

            console.error(
                "Error incrementando vistas:",
                viewResult.error
            );

        }else{

            console.log(
                "Vista registrada ✓"
            );


            /*
               +1 visualmente
            */

            const currentViews =
                Number(
                    data.profile_views || 0
                ) + 1;


            viewsElement.textContent =
                "👁️ " +
                currentViews +
                (
                    currentViews === 1
                    ? " vista"
                    : " vistas"
                );

        }

    }catch(error){

        console.error(
            "ERROR GENERAL:",
            error
        );

        showError(
            "❌ ERROR GENERAL\n\n" +
            error.message
        );

    }

}


/* =====================================
   MOSTRAR PERFIL
====================================== */

function renderProfile(data){

    /*
       APODO
    */

    nameElement.textContent =
        data.display_name ||
        data.username ||
        "NØX User";


    /*
       USERNAME
       NO SE PUEDE CAMBIAR DESDE AQUÍ
    */

    usernameElement.textContent =
        "@" +
        data.username;


    /*
       BIO
    */

    bioElement.textContent =
        data.bio ||
        "Welcome to my NØX profile.";


    /*
       VISTAS
    */

    const views =
        Number(
            data.profile_views || 0
        );


    viewsElement.textContent =
        "👁️ " +
        views +
        (
            views === 1
            ? " vista"
            : " vistas"
        );


    /*
       AVATAR
    */

    avatar.innerHTML = "";


    if(data.avatar_url){

        const img =
            document.createElement("img");


        img.src =
            data.avatar_url;


        img.alt =
            "Avatar";


        img.onerror =
            function(){

                avatar.textContent =
                    getFirstLetter(
                        data.display_name ||
                        data.username
                    );

            };


        avatar.appendChild(img);

    }else{

        avatar.textContent =
            getFirstLetter(
                data.display_name ||
                data.username
            );

    }


    /*
       ENLACES
    */

    linksElement.innerHTML = "";


    addLink(
        data.discord,
        "Discord"
    );

    addLink(
        data.instagram,
        "Instagram"
    );

    addLink(
        data.tiktok,
        "TikTok"
    );

    addLink(
        data.youtube,
        "YouTube"
    );

    addLink(
        data.github,
        "GitHub"
    );

    addLink(
        data.spotify,
        "Spotify"
    );


    /*
       FONDO
    */

    if(data.background_url){

        if(
            data.background_type ===
            "video"
        ){

            backgroundVideo.src =
                data.background_url;

            backgroundVideo.style.display =
                "block";

            background.style.display =
                "none";

        }else{

            background.style.backgroundImage =
                'url("' +
                data.background_url +
                '")';

        }

    }


    /*
       MÚSICA
    */

    if(data.music_url){

        music.src =
            data.music_url;

        music.classList.remove(
            "hidden"
        );


        /*
           El navegador normalmente
           requiere un clic del visitante.
        */

        document.addEventListener(
            "click",
            function(){

                music.play()
                    .catch(
                        function(){}
                    );

            },
            {
                once:true
            }
        );

    }


    /*
       MOSTRAR
    */

    loading.classList.add(
        "hidden"
    );

    profile.classList.remove(
        "hidden"
    );

}


/* =====================================
   AGREGAR LINK
====================================== */

function addLink(
    url,
    label
){

    if(
        !url ||
        !String(url).trim()
    ){

        return;

    }


    const a =
        document.createElement("a");


    a.className =
        "link";


    a.textContent =
        label +
        " ↗";


    a.href =
        normalizeUrl(
            String(url).trim()
        );


    a.target =
        "_blank";


    a.rel =
        "noopener noreferrer";


    linksElement.appendChild(a);

}


/* =====================================
   URL
====================================== */

function normalizeUrl(url){

    if(
        url.startsWith("http://") ||
        url.startsWith("https://")
    ){

        return url;

    }

    return "https://" + url;

}


/* =====================================
   PRIMERA LETRA
====================================== */

function getFirstLetter(text){

    return String(
        text || "N"
    )
    .charAt(0)
    .toUpperCase();

}


/* =====================================
   ERROR
====================================== */

function showError(text){

    loading.classList.add(
        "hidden"
    );

    profile.classList.remove(
        "hidden"
    );

    profile.innerHTML =
        `
        <div id="error">
            ${escapeHtml(text)}
        </div>
        `;

}


/* =====================================
   ESCAPAR HTML
====================================== */

function escapeHtml(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================
   INICIAR
====================================== */

loadProfile();

</script>

</body>
</html>
