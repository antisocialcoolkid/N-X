<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — Perfil</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

.background{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        radial-gradient(
            circle at top,
            #252525,
            #050505 70%
        );
    background-size:cover;
    background-position:center;
}

#backgroundVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    display:none;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:-1;
}

.loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:#aaa;
    font-size:15px;
    z-index:999;
}

.profile{
    width:100%;
    max-width:470px;
    padding:35px 25px;
    text-align:center;

    background:rgba(12,12,12,.82);
    border:1px solid #292929;
    border-radius:22px;

    backdrop-filter:blur(18px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.6);

    animation:show .5s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(15px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.avatar{
    width:105px;
    height:105px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;
    overflow:hidden;

    background:#1a1a1a;
    border:3px solid white;

    font-size:36px;
    font-weight:900;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:18px;
    font-size:28px;
    font-weight:900;
}

.username{
    margin-top:6px;
    color:#888;
    font-size:14px;
}

.bio{
    margin:18px auto 0;
    max-width:380px;

    color:#bbb;
    font-size:14px;
    line-height:1.5;
}

.views{
    margin-top:15px;
    color:#777;
    font-size:13px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-top:22px;
}

.link{
    display:block;

    padding:13px;

    border-radius:11px;
    border:1px solid #292929;

    background:#111;

    color:white;
    text-decoration:none;

    transition:.2s;
}

.link:hover{
    transform:translateY(-2px);
    background:#171717;
    box-shadow:0 0 20px rgba(255,255,255,.12);
}

.music{
    width:100%;
    margin-top:20px;
}

.hidden{
    display:none !important;
}

.error{
    color:#ff7070;
    font-size:15px;
}
</style>

<!-- SUPABASE DEBE CARGARSE ANTES DEL CÓDIGO PRINCIPAL -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div id="loading" class="loading">
    Cargando perfil...
</div>

<div
    id="background"
    class="background"
></div>

<video
    id="backgroundVideo"
    autoplay
    muted
    loop
    playsinline
></video>

<div class="overlay"></div>


<main
    id="profile"
    class="profile hidden"
>

    <div
        id="avatar"
        class="avatar"
    >
        N
    </div>

    <div
        id="name"
        class="name"
    >
        NØX User
    </div>

    <div
        id="username"
        class="username"
    >
        @username
    </div>

    <div
        id="bio"
        class="bio"
    >
        Welcome to my NØX profile.
    </div>

    <div
        id="views"
        class="views"
    >
        👁️ 0 vistas
    </div>

    <div
        id="links"
        class="links"
    ></div>

    <audio
        id="music"
        class="music hidden"
        controls
    ></audio>

</main>

========================================= */

if(
    !window.supabase ||
    !window.supabase.createClient
){

    document.getElementById("loading").textContent =
        "❌ Error cargando Supabase.";

    throw new Error(
        "Supabase JS no se cargó."
    );
}


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_KEY =

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ELEMENTOS
========================================= */

const loading =
document.getElementById("loading");

const profile =
document.getElementById("profile");

const avatar =
document.getElementById("avatar");

const nameElement =
document.getElementById("name");

const usernameElement =

const music =

/* =========================================
   USERNAME
========================================= */

const params =
new URLSearchParams(
    window.location.search
);

const username =
params.get("username");


/* =========================================
   CARGAR PERFIL
========================================= */

async function loadProfile(){

    try{

        if(!username){

            showError(
                "No se especificó un username."
            );

            return;

        }


        const cleanUsername =
        username
        .trim()
        .toLowerCase();


        console.log(
            "Buscando perfil:",
            cleanUsername
        );


        const result =
        await supabase
        .from("profiles")
        .select("*")
        .eq(
            "username",
            cleanUsername
        )
        .maybeSingle();


        const data =
        result.data;

        const error =
        result.error;


        console.log(
            "Resultado:",
            data
        );


        if(error){

            console.error(
                "SUPABASE ERROR:",
                error
            );

            showError(
                "Error de Supabase: " +
                error.message
            );

            return;

        }


        if(!data){

            showError(
                "Perfil no encontrado."
            );

            return;

        }


        /* ==============================
           MOSTRAR PERFIL
        ============================== */

        renderProfile(data);


        /* ==============================
           SUMAR VISTA
        ============================== */

        const viewResult =
        await supabase.rpc(
            "increment_profile_views",
            {
                profile_uuid:data.id
            }
        );


        if(viewResult.error){

            console.error(
                "ERROR CONTADOR:",
                viewResult.error
            );

            /*
               Aunque falle el contador,
               el perfil sigue funcionando.
            */

            viewsElement.textContent =
                "👁️ " +
                Number(
                    data.profile_views || 0
                ) +
                " vistas";

        }else{

            const newViews =
            Number(
                data.profile_views || 0
            ) + 1;


            viewsElement.textContent =
                "👁️ " +
                newViews +
                (
                    newViews === 1
                    ? " vista"
                    : " vistas"
                );

        }

    }catch(error){

        console.error(
            "ERROR:",
            error
        );

        showError(
            "Error: " +
            error.message
        );

    }

}

   MOSTRAR PERFIL
