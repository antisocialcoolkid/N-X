<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Perfil</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at top,
            #202020,
            #050505 70%
        );

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   LOADING
========================= */

#loading{

    position:fixed;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:12px;

    padding:30px;

    text-align:center;

    background:#050505;

    color:#aaa;

    font-size:15px;

    z-index:9999;

}

#status{
    max-width:90%;

    color:#777;

    font-size:12px;

    word-break:break-word;
}


/* =========================
   PERFIL
========================= */

#profile{

    width:100%;

    max-width:470px;

    padding:35px 25px;

    text-align:center;

    background:
        rgba(15,15,15,.88);

    border:
        1px solid #292929;

    border-radius:24px;

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.6);

    animation:
        profileIn .5s ease;

}


@keyframes profileIn{

    from{

        opacity:0;

        transform:
            translateY(15px)
            scale(.98);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================
   AVATAR
========================= */

.avatar{

    width:105px;
    height:105px;

    margin:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    border:
        3px solid white;

    background:#181818;

    font-size:35px;

    font-weight:900;

}


.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}


/* =========================
   NOMBRE
========================= */

.name{

    margin-top:18px;

    font-size:28px;

    font-weight:900;

}


.username{

    margin-top:5px;

    color:#888;

    font-size:14px;

}


.bio{

    margin:
        18px auto 0;

    max-width:380px;

    color:#bbb;

    font-size:14px;

    line-height:1.5;

}


.views{

    margin-top:15px;

    color:#777;

    font-size:13px;

}


/* =========================
   LINKS
========================= */

.links{

    display:flex;

    flex-direction:column;

    gap:9px;

    margin-top:22px;

}


.link{

    display:block;

    padding:13px;

    color:white;

    text-decoration:none;

    background:#111;

    border:
        1px solid #292929;

    border-radius:11px;

    transition:.2s;

}


.link:hover{

    transform:
        translateY(-2px);

    background:#181818;

    box-shadow:
        0 0 20px
        rgba(255,255,255,.12);

}


/* =========================
   OCULTO
========================= */

.hidden{

    display:none !important;

}

</style>


<!-- SUPABASE -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

</head>


<body>


<!-- =========================
     CARGANDO
========================= -->

<div id="loading">

    <div id="loadingText">
        Iniciando NØX...
    </div>

    <div id="status">
        Preparando perfil...
    </div>

</div>


<!-- =========================
     PERFIL
========================= -->

<main
    id="profile"
    class="hidden"
>

    <div
        id="avatar"
        class="avatar"
    >
        N
    </div>


    <div
        id="name"
        class="name"
    >
        NØX User
    </div>


    <div
        id="username"
        class="username"
    >
        @username
    </div>


    <div
        id="bio"
        class="bio"
    >
        Welcome to my NØX profile.
    </div>


    <div
        id="views"
        class="views"
    >
        👁️ 0 vistas
    </div>


    <div
        id="links"
        class="links"
    ></div>

</main>


<script>

/* =====================================
   CONFIGURACIÓN SUPABASE
===================================== */

const SUPABASE_URL =
    "https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* =====================================
   ELEMENTOS
===================================== */

const loading =
    document.getElementById(
        "loading"
    );


const loadingText =
    document.getElementById(
        "loadingText"
    );


const status =
    document.getElementById(
        "status"
    );


const profile =
    document.getElementById(
        "profile"
    );


const avatar =
    document.getElementById(
        "avatar"
    );


const nameElement =
    document.getElementById(
        "name"
    );


const usernameElement =
    document.getElementById(
        "username"
    );


const bioElement =
    document.getElementById(
        "bio"
    );


const viewsElement =
    document.getElementById(
        "views"
    );


const linksElement =
    document.getElementById(
        "links"
    );


/* =====================================
   FUNCIÓN DE ESTADO
===================================== */

function setStatus(
    title,
    detail
){

    loadingText.textContent =
        title;

    status.textContent =
        detail || "";

}


/* =====================================
   ERROR
===================================== */

function showError(
    message
){

    loadingText.textContent =
        "❌ Error";

    status.textContent =
        message;

    console.error(
        message
    );

}


/* =====================================
   USERNAME DE LA URL
===================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const username =
    params.get(
        "username"
    );


/* =====================================
   COMPROBAR SUPABASE
===================================== */

async function start(){

    setStatus(
        "1/5 — JavaScript funciona ✓",
        "Comprobando Supabase..."
    );


    /* SUPABASE JS */

    if(
        !window.supabase
    ){

        showError(
            "La librería de Supabase no cargó."
        );

        return;

    }


    if(
        !window.supabase.createClient
    ){

        showError(
            "createClient de Supabase no está disponible."
        );

        return;

    }


    setStatus(
        "2/5 — Supabase cargado ✓",
        "Creando conexión..."
    );


    /* CLIENTE */

    let client;

    try{

        client =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

    }catch(error){

        showError(
            "No se pudo crear Supabase: " +
            error.message
        );

        return;

    }


    setStatus(
        "3/5 — Conexión preparada ✓",
        "Comprobando tabla profiles..."
    );


    /* =================================
       COMPROBAR TABLA
    ================================= */

    try{

        const test =
            await client
            .from("profiles")
            .select(
                "id,username"
            )
            .limit(1);


        console.log(
            "TEST PROFILES:",
            test
        );


        if(test.error){

            showError(
                "Supabase respondió con error: " +
                test.error.message
            );

            return;

        }


        setStatus(
            "4/5 — Tabla profiles funciona ✓",
            "Buscando @" +
            (
                username ||
                "???"
            )
        );


        /* =================================
           COMPROBAR USERNAME
        ================================= */

        if(!username){

            showError(
                "La URL no tiene ?username=..."
            );

            return;

        }


        const cleanUsername =
            username
            .trim()
            .toLowerCase();


        const result =
            await client
            .from("profiles")
            .select("*")
            .eq(
                "username",
                cleanUsername
            )
            .maybeSingle();


        console.log(
            "PERFIL:",
            result
        );


        if(result.error){

            showError(
                "Error buscando perfil: " +
                result.error.message
            );

            return;

        }


        if(!result.data){

            showError(
                "No existe el perfil @" +
                cleanUsername
            );

            return;

        }


        const data =
            result.data;


        /* =================================
           MOSTRAR PERFIL
        ================================= */

        renderProfile(
            data
        );


        setStatus(
            "5/5 — ¡PERFIL ENCONTRADO! ✓",
            "@" + data.username
        );


        /* =================================
           CONTADOR DE VISTAS
        ================================= */

        try{

            const viewResult =
                await client.rpc(
                    "increment_profile_views",
                    {
                        profile_uuid:
                            data.id
                    }
                );


            console.log(
                "VISTA:",
                viewResult
            );


            if(
                !viewResult.error
            ){

                const current =
                    Number(
                        data.profile_views ||
                        0
                    );


                const newViews =
                    current + 1;


                viewsElement.textContent =
                    "👁️ " +
                    newViews +
                    (
                        newViews === 1
                        ? " vista"
                        : " vistas"
                    );

            }

        }catch(viewError){

            console.error(
                "Error de vistas:",
                viewError
            );

        }


    }catch(error){

        console.error(
            "ERROR GENERAL:",
            error
        );


        showError(
            error.message
        );

    }

}


/* =====================================
   RENDER PROFILE
===================================== */

function renderProfile(
    data
){

    /* APODO */

    nameElement.textContent =
        data.display_name ||
        data.username ||
        "NØX User";


    /* USERNAME */

    usernameElement.textContent =
        "@" +
        data.username;


    /* BIO */

    bioElement.textContent =
        data.bio ||
        "Welcome to my NØX profile.";


    /* VISTAS */

    const views =
        Number(
            data.profile_views ||
            0
        );


    viewsElement.textContent =
        "👁️ " +
        views +
        (
            views === 1
            ? " vista"
            : " vistas"
        );


    /* AVATAR */

    avatar.innerHTML =
        "";


    if(
        data.avatar_url
    ){

        const image =
            document.createElement(
                "img"
            );


        image.src =
            data.avatar_url;


        image.alt =
            "Avatar";


        image.onerror =
        function(){

            avatar.textContent =
                firstLetter(
                    data.display_name ||
                    data.username
                );

        };


        avatar.appendChild(
            image
        );

    }else{

        avatar.textContent =
            firstLetter(
                data.display_name ||
                data.username
            );

    }


    /* LINKS */

    linksElement.innerHTML =
        "";


    addLink(
        data.discord,
        "Discord"
    );


    addLink(
        data.instagram,
        "Instagram"
    );


    addLink(
        data.tiktok,
        "TikTok"
    );


    addLink(
        data.youtube,
        "YouTube"
    );


    addLink(
        data.github,
        "GitHub"
    );


    addLink(
        data.spotify,
        "Spotify"
    );


    /* MOSTRAR */

    loading.classList.add(
        "hidden"
    );


    profile.classList.remove(
        "hidden"
    );

}


/* =====================================
   PRIMERA LETRA
===================================== */

function firstLetter(
    text
){

    return (
        text ||
        "N"
    )
    .charAt(0)
    .toUpperCase();

}


/* =====================================
   CREAR LINK
===================================== */

function addLink(
    url,
    title
){

    if(
        !url ||
        !url.trim()
    ){

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.className =
        "link";


    link.textContent =
        title +
        " ↗";


    link.href =
        normalizeUrl(
            url
        );


    link.target =
        "_blank";


    link.rel =
        "noopener noreferrer";


    linksElement.appendChild(
        link
    );

}


/* =====================================
   NORMALIZAR URL
===================================== */

function normalizeUrl(
    url
){

    url =
        url.trim();


    if(
        url.startsWith(
            "http://"
        ) ||
        url.startsWith(
            "https://"
        )
    ){

        return url;

    }


    return (
        "https://" +
        url
    );

}


/* =====================================
   INICIAR
===================================== */

start();

</script>

</body>
    </html>
