<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NØX — Profile</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* BACKGROUND */

#background{
    position:fixed;
    inset:0;
    z-index:-5;
    background:#050505;
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
}

#backgroundVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:-4;
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:-3;
}

/* LOADING */

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:#888;
    font-size:14px;
    z-index:100;
}

#loading.hidden{
    display:none;
}

/* PROFILE */

.profile{
    width:100%;
    max-width:460px;
    padding:30px 24px;
    border:1px solid #292929;
    border-radius:24px;
    background:rgba(10,10,10,.72);
    backdrop-filter:blur(18px);
    box-shadow:0 30px 100px rgba(0,0,0,.55);
    text-align:center;
    animation:appear .5s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(15px) scale(.97);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* AVATAR */

.avatar{
    width:105px;
    height:105px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#181818;
    border:3px solid #fff;
    font-size:36px;
    font-weight:900;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TEXT */

.name{
    margin-top:18px;
    font-size:28px;
    font-weight:900;
}

.username{
    margin-top:5px;
    color:#888;
    font-size:13px;
}

.bio{
    margin:17px auto 0;
    max-width:390px;
    color:#bbb;
    line-height:1.55;
    font-size:14px;
}

/* BADGES */

.badges{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:15px;
}

.badge{
    padding:6px 10px;
    border:1px solid #333;
    border-radius:999px;
    background:#111;
    color:#ddd;
    font-size:11px;
}

/* VIEWS */

.views{
    margin-top:14px;
    color:#777;
    font-size:12px;
}

/* LINKS */

.links{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:20px;
}

.link{
    display:block;
    padding:12px;
    border:1px solid #292929;
    border-radius:11px;
    background:#111;
    color:#fff;
    text-decoration:none;
    transition:.2s;
}

.link:hover{
    transform:translateY(-3px);
    box-shadow:0 0 25px rgba(255,255,255,.15);
}

/* MUSIC */

.music{
    width:100%;
    margin-top:18px;
}

.music audio{
    width:100%;
}

.hidden{
    display:none!important;
}

/* RAIN */

.rain{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:5;
}

.drop{
    position:absolute;
    top:-20px;
    width:1px;
    height:18px;
    background:rgba(255,255,255,.35);
    animation:fall linear infinite;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
    }
}

/* ERROR */

.error{
    color:#ff7777;
    text-align:center;
    line-height:1.6;
}

/* MOBILE */

@media(max-width:600px){

    body{
        padding:12px;
    }

    .profile{
        padding:26px 17px;
    }

    .name{
        font-size:25px;
    }

}
</style>
</head>

<body>

<div id="loading">
    Cargando perfil...
</div>

<div id="background"></div>

<video
    id="backgroundVideo"
    muted
    loop
    playsinline
></video>

<div id="overlay"></div>

<div
    id="rain"
    class="rain hidden"
></div>

<main
    id="profile"
    class="profile hidden"
>

    <div
        id="avatar"
        class="avatar"
    >
        N
    </div>

    <div
        id="name"
        class="name"
    >
        NØX User
    </div>

    <div
        id="username"
        class="username"
    >
        @username
    </div>

    <div
        id="bio"
        class="bio"
    >
        Welcome to my NØX profile.
    </div>

    <div
        id="badges"
        class="badges"
    ></div>

    <div
        id="views"
        class="views"
    >
        👁️ 0 vistas
    </div>

    <div
        id="links"
        class="links"
    ></div>

    <div
        id="musicBox"
        class="music hidden"
    >
        <audio
            id="music"
            controls
        ></audio>
    </div>

</main>


<!-- SUPABASE DEBE CARGARSE ANTES DEL SCRIPT PRINCIPAL -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   ELEMENTOS
========================================== */

const loading =
document.getElementById("loading");

const profileElement =
document.getElementById("profile");

const avatarElement =
document.getElementById("avatar");

const nameElement =
document.getElementById("name");

const usernameElement =
document.getElementById("username");

const bioElement =
document.getElementById("bio");

const badgesElement =
document.getElementById("badges");

const viewsElement =
document.getElementById("views");

const linksElement =
document.getElementById("links");

const backgroundElement =
document.getElementById("background");

const backgroundVideo =
document.getElementById("backgroundVideo");

const overlay =
document.getElementById("overlay");

const musicBox =
document.getElementById("musicBox");

const music =
document.getElementById("music");

const rain =
document.getElementById("rain");


/* ==========================================
   USERNAME DE LA URL
========================================== */

const params =
new URLSearchParams(
    window.location.search
);

const requestedUsername =
params.get("username");


/* ==========================================
   CARGAR PERFIL
========================================== */

async function loadProfile(){

    try{

        if(!requestedUsername){

            showError(
                "No se especificó un username."
            );

            return;
        }


        const cleanUsername =
        requestedUsername
        .trim()
        .toLowerCase();


        /*
           BUSCAR PERFIL
        */

        const {
            data,
            error
        } =
        await supabase
        .from("profiles")
        .select("*")
        .eq(
            "username",
            cleanUsername
        )
        .maybeSingle();


        if(error){

            console.error(
                "Supabase:",
                error
            );

            showError(
                "Error cargando el perfil."
            );

            return;
        }


        if(!data){

            showError(
                "Este perfil no existe."
            );

            return;
        }


        /*
           MOSTRAR PERFIL
        */

        renderProfile(data);


        /*
           SUMAR VISTA
        */

        const {
            error:viewError
        } =
        await supabase.rpc(
            "increment_profile_views",
            {
                profile_uuid:data.id
            }
        );


        if(viewError){

            console.error(
                "Error al sumar vista:",
                viewError
            );

        }else{

            /*
               Como la RPC incrementó la
               base de datos, mostramos
               inmediatamente +1.
            */

            const newViews =
            Number(
                data.profile_views || 0
            ) + 1;


            viewsElement.textContent =
            "👁️ " +
            newViews +
            (
                newViews === 1
                ? " vista"
                : " vistas"
            );

        }


    }catch(error){

        console.error(error);

        showError(
            "Error inesperado."
        );

    }

}


/* ==========================================
   MOSTRAR PERFIL
========================================== */

function renderProfile(data){

    /*
       APODO
    */

    nameElement.textContent =
    data.display_name ||
    data.username ||
    "NØX User";


    /*
       USERNAME
       SOLO SE MUESTRA
       NO SE MODIFICA
    */

    usernameElement.textContent =
    "@" +
    data.username;


    /*
       BIO
    */

    bioElement.textContent =
    data.bio ||
    "Welcome to my NØX profile.";


    /*
       VISTAS
    */

    const views =
    Number(
        data.profile_views || 0
    );


    viewsElement.textContent =
    "👁️ " +
    views +
    (
        views === 1
        ? " vista"
        : " vistas"
    );


    /*
       AVATAR
    */

    avatarElement.innerHTML =
    "";


    if(data.avatar_url){

        const img =
        document.createElement("img");

        img.src =
        data.avatar_url;

        img.alt =
        "Avatar";


        img.onerror =
        function(){

            avatarElement.textContent =
            getFirstLetter(
                data.display_name ||
                data.username
            );

        };


        avatarElement.appendChild(
            img
        );

    }else{

        avatarElement.textContent =
        getFirstLetter(
            data.display_name ||
            data.username
        );

    }


    /*
       BADGES
    */

    loadBadges(
        data.badges
    );


    /*
       REDES
    */

    addLink(
        data.discord,
        "Discord"
    );

    addLink(
        data.instagram,
        "Instagram"
    );

    addLink(
        data.tiktok,
        "TikTok"
    );

    addLink(
        data.spotify,
        "Spotify"
    );

    addLink(
        data.youtube,
        "YouTube"
    );

    addLink(
        data.github,
        "GitHub"
    );


    /*
       FONDO
    */

    loadBackground(
        data
    );


    /*
       MÚSICA
    */

    loadMusic(
        data
    );


    /*
       COLORES
    */

    applyColors(
        data
    );


    /*
       EFECTOS
    */

    applyEffects(
        data
    );


    /*
       MOSTRAR
    */

    loading.classList.add(
        "hidden"
    );

    profileElement.classList.remove(
        "hidden"
    );

}


/* ==========================================
   BADGES
========================================== */

function loadBadges(
    badges
){

    badgesElement.innerHTML =
    "";


    if(!badges)
        return;


    let list = [];


    if(Array.isArray(badges)){

        list =
        badges;

    }else{

        list =
        String(badges)
        .split(",");

    }


    list
    .map(
        x => String(x).trim()
    )
    .filter(Boolean)
    .forEach(
        badgeText => {

            const badge =
            document.createElement(
                "div"
            );

            badge.className =
            "badge";

            badge.textContent =
            badgeText;

            badgesElement.appendChild(
                badge
            );

        }
    );

}


/* ==========================================
   LINKS
========================================== */

function addLink(
    url,
    name
){

    if(!url)
        return;


    const a =
    document.createElement(
        "a"
    );


    a.className =
    "link";

    a.textContent =
    name + " ↗";

    a.href =
    normalizeUrl(
        url
    );

    a.target =
    "_blank";

    a.rel =
    "noopener noreferrer";


    linksElement.appendChild(
        a
    );

}


/* ==========================================
   NORMALIZAR URL
========================================== */

function normalizeUrl(
    url
){

    url =
    String(url).trim();


    if(
        url.startsWith("http://") ||
        url.startsWith("https://")
    ){

        return url;

    }


    return "https://" +
    url;

}


/* ==========================================
   FONDO
========================================== */

function loadBackground(
    data
){

    const url =
    data.background_url;


    const type =
    data.background_type ||
    "image";


    if(!url){

        backgroundElement.style.background =
        data.background_color ||
        "#050505";

        return;
    }


    if(type === "video"){

        backgroundElement.style.display =
        "none";

        backgroundVideo.src =
        url;

        backgroundVideo.style.display =
        "block";


        backgroundVideo.play()
        .catch(
            () => {}
        );

    }else{

        backgroundVideo.pause();

        backgroundVideo.removeAttribute(
            "src"
        );

        backgroundVideo.style.display =
        "none";

        backgroundElement.style.backgroundImage =
        `url("${url}")`;

    }

}


/* ==========================================
   MÚSICA
========================================== */

function loadMusic(
    data
){

    if(!data.music_url){

        musicBox.classList.add(
            "hidden"
        );

        return;
    }


    music.src =
    data.music_url;


    musicBox.classList.remove(
        "hidden"
    );


    /*
       Los navegadores bloquean
       autoplay de audio en muchos casos.
       Se intenta reproducir después
       del primer clic.
    */

    document.addEventListener(
        "click",
        function playMusic(){

            music.play()
            .catch(
                () => {}
            );

            document.removeEventListener(
                "click",
                playMusic
            );

        }
    );

}


/* ==========================================
   COLORES
========================================== */

function applyColors(
    data
){

    if(data.background_color){

        backgroundElement.style.backgroundColor =
        data.background_color;

    }


    if(data.text_color){

        document.body.style.color =
        data.text_color;

    }


    if(data.overlay_opacity !== null &&
       data.overlay_opacity !== undefined){

        overlay.style.background =
        `rgba(0,0,0,${
            data.overlay_opacity
        })`;

    }

}


/* ==========================================
   EFECTOS
========================================== */

function applyEffects(
    data
){

    /*
       GLITCH
    */

    if(data.glitch_enabled){

        usernameElement.style.textShadow =
        "2px 0 #ff004c,-2px 0 #00eaff";

        usernameElement.style.animation =
        "glitch .18s infinite alternate";

    }


    /*
       3D
    */

    if(data.three_d_enabled){

        enable3D();

    }


    /*
       LLUVIA
    */

    if(data.rain_enabled){

        createRain();

    }


    /*
       CURSOR
    */

    if(data.cursor_url){

        document.body.style.cursor =
        `url("${data.cursor_url}"), auto`;

    }


    /*
       FUENTE
    */

    if(data.font_family){

        document.body.style.fontFamily =
        data.font_family;

    }

}


/* ==========================================
   3D
========================================== */

function enable3D(){

    profileElement.addEventListener(
        "mousemove",
        function(event){

            const rect =
            profileElement.getBoundingClientRect();


            const x =
            event.clientX -
            rect.left;


            const y =
            event.clientY -
            rect.top;


            const rotateY =
            ((x / rect.width) - .5) * 10;


            const rotateX =
            ((y / rect.height) - .5) * -10;


            profileElement.style.transform =
            `perspective(900px)
             rotateX(${rotateX}deg)
             rotateY(${rotateY}deg)`;

        }
    );


    profileElement.addEventListener(
        "mouseleave",
        function(){

            profileElement.style.transform =
            "";

        }
    );

}


/* ==========================================
   LLUVIA
========================================== */

function createRain(){

    rain.classList.remove(
        "hidden"
    );


    for(
        let i = 0;
        i < 80;
        i++
    ){

        const drop =
        document.createElement(
            "div"
        );


        drop.className =
        "drop";


        drop.style.left =
        Math.random() * 100 +
        "%";


        drop.style.animationDuration =
        (
            0.5 +
            Math.random() * 1.5
        ) +
        "s";


        drop.style.animationDelay =
        (
            Math.random() * 2
        ) +
        "s";


        rain.appendChild(
            drop
        );

    }

}


/* ==========================================
   PRIMERA LETRA
========================================== */

function getFirstLetter(
    text
){

    return (
        text ||
        "N"
    )
    .charAt(0)
    .toUpperCase();

}


/* ==========================================
   ERROR
========================================== */

function showError(
    message
){

    loading.classList.add(
        "hidden"
    );


    profileElement.classList.remove(
        "hidden"
    );


    profileElement.innerHTML =
    `
        <div class="error">
            ${escapeHtml(message)}
        </div>
    `;

}


/* ==========================================
   ESCAPAR HTML
========================================== */

function escapeHtml(
    value
){

    return String(value)
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* ==========================================
   INICIAR
========================================== */

loadProfile();

</script>

</body>
</html>
