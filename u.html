<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#030303">

<title>NØX — Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #222 0%,
            #090909 38%,
            #030303 75%
        );

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:25px;
}


/* =========================
   BACKGROUND
========================= */

.background{

    position:fixed;

    inset:0;

    z-index:-1;

    overflow:hidden;

    pointer-events:none;
}

.glow{

    position:absolute;

    width:500px;

    height:500px;

    border-radius:50%;

    background:white;

    filter:blur(150px);

    opacity:.06;

    animation:
        moveGlow
        12s
        ease-in-out
        infinite;
}

.glow.one{

    top:-300px;

    left:-250px;
}

.glow.two{

    right:-300px;

    bottom:-300px;

    animation-delay:-6s;
}

@keyframes moveGlow{

    0%,100%{
        transform:
            translate(0,0)
            scale(1);
    }

    50%{
        transform:
            translate(50px,40px)
            scale(1.15);
    }

}


/* =========================
   LOGO
========================= */

.logo{

    position:fixed;

    top:25px;

    left:30px;

    color:#fff;

    text-decoration:none;

    font-size:24px;

    font-weight:950;

    letter-spacing:-1px;

    transition:.2s;
}

.logo:hover{

    opacity:.6;

    transform:
        translateY(-2px);
}


/* =========================
   CARD
========================= */

.card{

    width:min(
        520px,
        100%
    );

    padding:
        42px
        30px
        32px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(20,20,20,.96),
            rgba(5,5,5,.98)
        );

    backdrop-filter:
        blur(20px);

    box-shadow:

        0 40px 120px
        rgba(0,0,0,.7);

    text-align:center;

    animation:
        cardIn
        .7s
        ease
        both;
}

@keyframes cardIn{

    from{

        opacity:0;

        transform:
            translateY(25px)
            scale(.97);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================
   AVATAR
========================= */

.avatar{

    width:105px;

    height:105px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    border:
        1px solid
        #3a3a3a;

    background:
        linear-gradient(
            145deg,
            #292929,
            #0b0b0b
        );

    color:#fff;

    font-size:36px;

    font-weight:950;

    box-shadow:

        0 20px 60px
        rgba(0,0,0,.6),

        0 0 45px
        rgba(255,255,255,.04);
}

.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;
}


/* =========================
   NAME
========================= */

.name{

    margin-top:22px;

    font-size:29px;

    font-weight:950;

    letter-spacing:-1px;
}


/* =========================
   USERNAME
========================= */

.username{

    margin-top:7px;

    color:#555;

    font-size:12px;

    font-weight:600;
}


/* =========================
   BIO
========================= */

.bio{

    max-width:430px;

    margin:
        20px
        auto
        0;

    color:#777;

    font-size:13px;

    line-height:1.7;
}


/* =========================
   LINKS
========================= */

.links{

    display:grid;

    gap:9px;

    margin-top:27px;
}

.link{

    display:block;

    padding:15px;

    border:
        1px solid
        #222;

    border-radius:10px;

    background:
        rgba(255,255,255,.025);

    color:#aaa;

    text-decoration:none;

    font-size:11px;

    font-weight:800;

    transition:
        .25s ease;
}

.link:hover{

    color:#fff;

    border-color:#444;

    background:#111;

    transform:
        translateY(-3px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);
}


/* =========================
   LOADING
========================= */

.loading{

    color:#666;

    font-size:10px;

    font-weight:800;

    letter-spacing:3px;

    animation:
        pulse
        1.5s
        infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:.35;
    }

    50%{
        opacity:1;
    }

}


/* =========================
   ERROR
========================= */

.error-title{

    font-size:25px;

    font-weight:900;
}

.error-text{

    margin-top:12px;

    color:#777;

    font-size:12px;

    line-height:1.7;
}

.back{

    display:inline-block;

    margin-top:22px;

    padding:
        11px
        17px;

    border:
        1px solid
        #292929;

    border-radius:9px;

    background:#0b0b0b;

    color:#aaa;

    text-decoration:none;

    font-size:10px;

    font-weight:800;
}

.back:hover{

    color:#fff;

    border-color:#444;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{

        padding:
            20px;
    }

    .logo{

        top:20px;

        left:20px;

        font-size:21px;
    }

    .card{

        padding:
            35px
            20px
            28px;

        border-radius:19px;
    }

    .avatar{

        width:90px;

        height:90px;

        font-size:30px;
    }

    .name{

        font-size:25px;
    }

}

</style>

</head>


<body>


<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

</div>


<a
    href="index.html"
    class="logo"
>
    NØX
</a>


<main
    id="app"
    class="card"
>

    <div class="loading">

        LOADING PROFILE...

    </div>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const app =
document.getElementById("app");


/* =========================
   GET USERNAME
========================= */

const params =
new URLSearchParams(
    window.location.search
);

const username =
params.get("username");


/* =========================
   START
========================= */

if(!username){

    showError(
        "No se encontró el username.",
        "Agrega ?username=tuusuario a la URL."
    );

}else{

    loadProfile(
        username
    );

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(
    username
){

    const cleanUsername =
    username
        .trim()
        .toLowerCase();


    try{

        const response =
        await supabase

        .from("profiles")

        .select("*")

        .eq(
            "username",
            cleanUsername
        )

        .maybeSingle();


        console.log(
            "Supabase response:",
            response
        );


        if(response.error){

            showError(
                "Error de Supabase",
                response.error.message
            );

            return;
        }


        if(!response.data){

            showError(
                "Perfil no encontrado",
                "No existe @" +
                cleanUsername +
                " en la tabla profiles."
            );

            return;
        }


        renderProfile(
            response.data
        );


    }catch(error){

        console.error(
            error
        );

        showError(
            "Error",
            error.message
        );

    }

}


/* =========================
   RENDER
========================= */

function renderProfile(
    profile
){

    const username =
    profile.username ||
    "";


    const displayName =
    profile.display_name ||
    username;


    const bio =
    profile.bio ||
    "";


    let avatar;


    if(profile.avatar_url){

        avatar = `

            <img
                src="${escapeHTML(
                    profile.avatar_url
                )}"
                alt="Avatar"
            >

        `;

    }else{

        avatar =
        escapeHTML(
            displayName
                .charAt(0)
                .toUpperCase()
        );

    }


    let links = "";


    if(profile.discord){

        links += createLink(
            profile.discord,
            "Discord ↗"
        );

    }


    if(profile.youtube){

        links += createLink(
            profile.youtube,
            "YouTube ↗"
        );

    }


    if(profile.github){

        links += createLink(
            profile.github,
            "GitHub ↗"
        );

    }


    document.title =
    "@" +
    username +
    " — NØX";


    app.innerHTML = `

        <div class="avatar">

            ${avatar}

        </div>


        <h1 class="name">

            ${escapeHTML(
                displayName
            )}

        </h1>


        <div class="username">

            @${escapeHTML(
                username
            )}

        </div>


        ${
            bio
            ?
            `

            <p class="bio">

                ${escapeHTML(
                    bio
                )}

            </p>

            `
            :
            ""
        }


        <div class="links">

            ${links}

        </div>

    `;

}


/* =========================
   LINK
========================= */

function createLink(
    url,
    text
){

    let cleanUrl =
    String(url).trim();


    if(
        !cleanUrl.startsWith(
            "http://"
        ) &&
        !cleanUrl.startsWith(
            "https://"
        )
    ){

        cleanUrl =
        "https://" +
        cleanUrl;

    }


    return `

        <a
            class="link"
            href="${escapeHTML(
                cleanUrl
            )}"
            target="_blank"
            rel="noopener noreferrer"
        >

            ${text}

        </a>

    `;

}


/* =========================
   ERROR
========================= */

function showError(
    title,
    text
){

    app.innerHTML = `

        <h1 class="error-title">

            ${escapeHTML(
                title
            )}

        </h1>


        <p class="error-text">

            ${escapeHTML(
                text
            )}

        </p>


        <a
            href="index.html"
            class="back"
        >

            ← Back to NØX

        </a>

    `;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(
    value
){

    const div =
    document.createElement(
        "div"
    );

    div.textContent =
    value ?? "";

    return div.innerHTML;

}

</script>


</body>

</html>
