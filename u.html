<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NØX</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

#app{
    width:min(450px,90%);
    padding:30px;
    text-align:center;
    border:1px solid #292929;
    border-radius:20px;
    background:#111;
}

#status{
    white-space:pre-wrap;
    line-height:1.6;
}

#profile{
    display:none;
}

.avatar{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#222;
    font-size:35px;
    font-weight:bold;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:18px;
    font-size:26px;
    font-weight:bold;
}

.username{
    margin-top:5px;
    color:#888;
}

.bio{
    margin-top:15px;
    color:#aaa;
}

.views{
    margin-top:15px;
    color:#777;
}
</style>
</head>

<body>

<div id="app">

    <div id="status">
        NØX — iniciando...
    </div>

    <div id="profile">

        <div
            id="avatar"
            class="avatar"
        >
            N
        </div>

        <div
            id="name"
            class="name"
        ></div>

        <div
            id="username"
            class="username"
        ></div>

        <div
            id="bio"
            class="bio"
        ></div>

        <div
            id="views"
            class="views"
        ></div>

    </div>

</div>


<!-- SUPABASE PRIMERO -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ======================================
   CONFIGURACIÓN
====================================== */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* ======================================
   ELEMENTOS
====================================== */

const status =
document.getElementById("status");

const profile =
document.getElementById("profile");

const avatar =
document.getElementById("avatar");

const nameElement =
document.getElementById("name");

const usernameElement =
document.getElementById("username");

const bioElement =
document.getElementById("bio");

const viewsElement =
document.getElementById("views");


/* ======================================
   SUPABASE CARGADO?
====================================== */

if(!window.supabase){

    status.textContent =
        "❌ ERROR\n\n" +
        "Supabase JS no cargó.";

    throw new Error(
        "Supabase JS no disponible"
    );
}


/* ======================================
   CLIENTE
====================================== */

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ======================================
   USERNAME
====================================== */

const params =
new URLSearchParams(
    window.location.search
);

const username =
params.get("username");


status.textContent =
"NØX — comprobando URL...\n\n" +
"Username: " +
(username || "NULL");


/* ======================================
   CARGAR
====================================== */

async function loadProfile(){

    try{

        if(!username){

            status.textContent =
                "❌ ERROR\n\n" +
                "La URL no tiene ?username=...\n\n" +
                "Ejemplo:\n" +
                "u.html?username=pan";

            return;
        }


        status.textContent =
            "NØX — conectando con Supabase...\n\n" +
            "Username: @" +
            username;


        /* =================================
           BUSCAR PERFIL
        ================================= */

        const result =
            await supabase
                .from("profiles")
                .select("*")
                .eq(
                    "username",
                    username
                        .trim()
                        .toLowerCase()
                )
                .maybeSingle();


        console.log(
            "SUPABASE RESULT:",
            result
        );


        const data =
            result.data;

        const error =
            result.error;


        if(error){

            status.textContent =
                "❌ ERROR SUPABASE\n\n" +
                error.message;

            console.error(error);

            return;
        }


        if(!data){

            status.textContent =
                "❌ PERFIL NO ENCONTRADO\n\n" +
                "Username: @" +
                username;

            return;
        }


        /* =================================
           PERFIL ENCONTRADO
        ================================= */

        status.style.display =
            "none";

        profile.style.display =
            "block";


        nameElement.textContent =
            data.display_name ||
            data.username ||
            "NØX User";


        usernameElement.textContent =
            "@" +
            data.username;


        bioElement.textContent =
            data.bio ||
            "Welcome to my NØX profile.";


        const currentViews =
            Number(
                data.profile_views || 0
            );


        viewsElement.textContent =
            "👁️ " +
            currentViews +
            (
                currentViews === 1
                ? " vista"
                : " vistas"
            );


        /* =================================
           AVATAR
        ================================= */

        if(data.avatar_url){

            const img =
                document.createElement(
                    "img"
                );

            img.src =
                data.avatar_url;

            img.onerror =
                function(){

                    avatar.textContent =
                        (
                            data.username ||
                            "N"
                        )
                        .charAt(0)
                        .toUpperCase();

                };

            avatar.innerHTML = "";

            avatar.appendChild(img);

        }else{

            avatar.textContent =
                (
                    data.username ||
                    "N"
                )
                .charAt(0)
                .toUpperCase();
        }


        /* =================================
           SUMAR VISTA
        ================================= */

        console.log(
            "Sumando vista..."
        );


        const viewResult =
            await supabase.rpc(
                "increment_profile_views",
                {
                    profile_uuid:
                        data.id
                }
            );


        console.log(
            "VIEW RESULT:",
            viewResult
        );


        if(viewResult.error){

            console.error(
                "Error de vistas:",
                viewResult.error
            );

            /*
               El perfil igualmente se muestra.
            */

            return;
        }


        const newViews =
            currentViews + 1;


        viewsElement.textContent =
            "👁️ " +
            newViews +
            (
                newViews === 1
                ? " vista"
                : " vistas"
            );


    }catch(error){

        console.error(error);


        status.style.display =
            "block";


        profile.style.display =
            "none";


        status.textContent =
            "❌ ERROR JAVASCRIPT\n\n" +
            error.message;

    }

}


/* ======================================
   INICIAR
====================================== */

loadProfile();

</script>

</body>
</html>
