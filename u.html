<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NØX Profile</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#030303;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.background{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
        radial-gradient(circle at 50% 0%,#222,#080808 40%,#030303 75%);
}

.card{
    width:min(520px,100%);
    padding:40px 30px;
    border:1px solid #222;
    border-radius:22px;
    background:rgba(10,10,10,.94);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
    text-align:center;
}

.logo{
    position:fixed;
    top:25px;
    left:30px;
    color:#fff;
    text-decoration:none;
    font-size:24px;
    font-weight:900;
}

.avatar{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#151515;
    border:1px solid #333;
    font-size:35px;
    font-weight:900;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:20px;
    font-size:28px;
    font-weight:900;
}

.username{
    margin-top:6px;
    color:#555;
    font-size:12px;
}

.bio{
    margin:18px auto 0;
    max-width:420px;
    color:#777;
    font-size:12px;
    line-height:1.7;
}

.links{
    display:grid;
    gap:10px;
    margin-top:25px;
}

.link{
    display:block;
    padding:15px;
    border:1px solid #242424;
    border-radius:10px;
    background:#0b0b0b;
    color:#aaa;
    text-decoration:none;
    font-size:11px;
    font-weight:800;
    transition:.2s;
}

.link:hover{
    color:#fff;
    border-color:#555;
    transform:translateY(-2px);
}

.loading{
    color:#666;
    font-size:11px;
    letter-spacing:2px;
}

.error{
    color:#ff7070;
    font-size:12px;
    line-height:1.7;
}

.back{
    display:inline-block;
    margin-top:20px;
    padding:11px 16px;
    border:1px solid #292929;
    border-radius:8px;
    color:#aaa;
    text-decoration:none;
    font-size:10px;
}
</style>
</head>

<body>

<div class="background"></div>

<a href="index.html" class="logo">NØX</a>

<main class="card" id="app">

    <div class="loading">
        LOADING PROFILE...
    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const app =
document.getElementById("app");


async function loadProfile(){

    try{

        const params =
        new URLSearchParams(
            window.location.search
        );

        const username =
        params.get("username");


        if(!username){

            showError(
                "No se encontró ningún username en la URL."
            );

            return;
        }


        const cleanUsername =
        username
        .trim()
        .toLowerCase();


        console.log(
            "Buscando:",
            cleanUsername
        );


        const result =
        await supabase
        .from("profiles")
        .select("*")
        .eq(
            "username",
            cleanUsername
        )
        .maybeSingle();


        console.log(
            "Resultado Supabase:",
            result
        );


        if(result.error){

            showError(
                "Supabase: " +
                result.error.message
            );

            return;
        }


        if(!result.data){

            showError(
                "No existe un perfil con el username @" +
                cleanUsername
            );

            return;
        }


        renderProfile(
            result.data
        );

    }catch(error){

        console.error(error);

        showError(
            "Error: " +
            error.message
        );

    }

}


function renderProfile(data){

    const avatar =
    data.avatar_url
    ? `
        <img
            src="${escapeAttr(data.avatar_url)}"
            onerror="this.style.display='none'"
        >
      `
    : escapeHtml(
        (
            data.display_name ||
            data.username ||
            "N"
        ).charAt(0).toUpperCase()
      );


    let links = "";


    if(data.discord){

        links += `
            <a
                class="link"
                href="${safeUrl(data.discord)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                Discord ↗
            </a>
        `;

    }


    if(data.youtube){

        links += `
            <a
                class="link"
                href="${safeUrl(data.youtube)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                YouTube ↗
            </a>
        `;

    }


    if(data.github){

        links += `
            <a
                class="link"
                href="${safeUrl(data.github)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                GitHub ↗
            </a>
        `;

    }


    document.title =
    "@" +
    data.username +
    " — NØX";


    app.innerHTML = `

        <div class="avatar">
            ${avatar}
        </div>

        <h1 class="name">
            ${escapeHtml(
                data.display_name ||
                data.username
            )}
        </h1>

        <div class="username">
            @${escapeHtml(data.username)}
        </div>

        ${
            data.bio
            ?
            `
            <p class="bio">
                ${escapeHtml(data.bio)}
            </p>
            `
            :
            ""
        }

        <div class="links">
            ${links}
        </div>

    `;

}


function showError(text){

    app.innerHTML = `

        <h1>
            ❌ Error
        </h1>

        <p class="error">
            ${escapeHtml(text)}
        </p>

        <a
            href="index.html"
            class="back"
        >
            ← Volver a NØX
        </a>

    `;

}


function safeUrl(url){

    const value =
    String(url).trim();


    if(
        value.startsWith("https://") ||
        value.startsWith("http://")
    ){

        return escapeAttr(value);

    }


    return escapeAttr(
        "https://" + value
    );

}


function escapeHtml(value){

    const div =
    document.createElement("div");

    div.textContent =
    value ?? "";

    return div.innerHTML;

}


function escapeAttr(value){

    return escapeHtml(value);

}


loadProfile();

</script>

</body>
</html>
