<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050505;
    color:white;

    font-family:Arial,sans-serif;
}

.card{
    width:90%;
    max-width:450px;

    padding:30px;

    text-align:center;

    background:#111;

    border:1px solid #292929;

    border-radius:20px;
}

.avatar{
    width:100px;
    height:100px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    background:#222;

    font-size:35px;
    font-weight:bold;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:18px;

    font-size:28px;
    font-weight:bold;
}

.username{
    margin-top:5px;

    color:#888;
}

.bio{
    margin-top:15px;

    color:#aaa;
}

.views{
    margin-top:15px;

    color:#777;
}

.link{
    display:block;

    margin-top:10px;

    padding:12px;

    background:#1a1a1a;

    border-radius:10px;

    color:white;

    text-decoration:none;
}

#error{
    color:#ff6666;
}

</style>

</head>

<body>

<div id="app">

    Cargando perfil...

</div>


<script>

/* =========================
   SUPABASE
========================= */

const supabase =
window.supabase.createClient(

    "https://asgowauvzfnsszstvzqi.supabase.co",

    "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS"

);


/* =========================
   USERNAME
========================= */

const params =
new URLSearchParams(
    window.location.search
);

const username =
params.get("username");


/* =========================
   APP
========================= */

const app =
document.getElementById("app");


/* =========================
   CARGAR
========================= */

async function load(){

    try{

        if(!username){

            app.innerHTML =
            "<p id='error'>Falta username.</p>";

            return;

        }


        console.log(
            "Buscando:",
            username
        );


        const result =
        await supabase

        .from("profiles")

        .select("*")

        .eq(
            "username",
            username
            .trim()
            .toLowerCase()
        )

        .maybeSingle();


        console.log(
            "Supabase:",
            result
        );


        if(result.error){

            app.innerHTML =
            `
            <p id="error">
            Error Supabase:<br>
            ${result.error.message}
            </p>
            `;

            return;

        }


        if(!result.data){

            app.innerHTML =
            `
            <p id="error">
            Perfil no encontrado.
            </p>
            `;

            return;

        }


        const profile =
        result.data;


        /* =====================
           DATOS
        ===================== */

        const displayName =
        profile.display_name ||
        profile.username ||
        "NØX User";


        const bio =
        profile.bio ||
        "Welcome to my NØX profile.";


        const views =
        Number(
            profile.profile_views || 0
        );


        /* =====================
           AVATAR
        ===================== */

        let avatarHTML;


        if(profile.avatar_url){

            avatarHTML =
            `
            <img
                src="${profile.avatar_url}"
                alt="Avatar"
            >
            `;

        }else{

            avatarHTML =
            displayName
            .charAt(0)
            .toUpperCase();

        }


        /* =====================
           LINKS
        ===================== */

        let links = "";


        function addLink(
            url,
            name
        ){

            if(!url)
                return;


            let finalURL =
            url;


            if(
                !url.startsWith(
                    "http://"
                ) &&
                !url.startsWith(
                    "https://"
                )
            ){

                finalURL =
                "https://" + url;

            }


            links +=
            `
            <a
                class="link"
                href="${finalURL}"
                target="_blank"
                rel="noopener noreferrer"
            >
                ${name} ↗
            </a>
            `;

        }


        addLink(
            profile.discord,
            "Discord"
        );

        addLink(
            profile.instagram,
            "Instagram"
        );

        addLink(
            profile.tiktok,
            "TikTok"
        );

        addLink(
            profile.youtube,
            "YouTube"
        );

        addLink(
            profile.github,
            "GitHub"
        );

        addLink(
            profile.spotify,
            "Spotify"
        );


        /* =====================
           MOSTRAR
        ===================== */

        app.innerHTML =
        `
        <div class="card">

            <div class="avatar">
                ${avatarHTML}
            </div>

            <div class="name">
                ${displayName}
            </div>

            <div class="username">
                @${profile.username}
            </div>

            <div class="bio">
                ${bio}
            </div>

            <div
                class="views"
                id="views"
            >
                👁️ ${views}
                ${views === 1 ? "vista" : "vistas"}
            </div>

            <div>
                ${links}
            </div>

        </div>
        `;


        /* =====================
           SUMAR VISTA
        ===================== */

        console.log(
            "Sumando vista..."
        );


        const view =
        await supabase.rpc(

            "increment_profile_views",

            {
                profile_uuid:
                profile.id
            }

        );


        console.log(
            "RPC:",
            view
        );


        if(view.error){

            console.error(
                "Error al sumar:",
                view.error
            );

            return;

        }


        /* =====================
           MOSTRAR NUEVO VALOR
        ===================== */

        const newViews =
        Number(view.data);


        const viewsElement =
        document.getElementById(
            "views"
        );


        if(viewsElement){

            viewsElement.textContent =
            "👁️ " +
            newViews +
            (
                newViews === 1
                ? " vista"
                : " vistas"
            );

        }


    }catch(error){

        console.error(
            error
        );


        app.innerHTML =
        `
        <p id="error">
            Error:<br>
            ${error.message}
        </p>
        `;

    }

}


load();

</script>

</body>
</html>
