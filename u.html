<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NØX — Diagnóstico</title>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:min(600px,100%);
    padding:30px;
    border:1px solid #222;
    border-radius:18px;
    background:#0b0b0b;
}

h1{
    font-size:22px;
}

#result{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#111;
    color:#aaa;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.6;
}

.ok{
    color:#7cff9b;
}

.error{
    color:#ff7070;
}
</style>
</head>

<body>

<div class="box">

<h1>NØX — comprobando perfil</h1>

<div id="result">
Iniciando...
</div>

</div>


<script>

const result =
document.getElementById("result");


function show(text,className=""){
    result.className=className;
    result.textContent=text;
}


show("1/4 — Cargando Supabase...");


const script =
document.createElement("script");

script.src =
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";


script.onload =
function(){

    show(
        "2/4 — Supabase cargado.\n\nBuscando username..."
    );

    start();

};


script.onerror =
function(){

    show(
        "❌ NO SE PUDO CARGAR SUPABASE.\n\n" +
        "Revisa tu conexión o el CDN.",
        "error"
    );

};


document.head.appendChild(
    script
);


async function start(){

    const SUPABASE_URL =
    "https://asgowauvzfnsszstvzqi.supabase.co";


    const SUPABASE_KEY =
    "sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


    const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    const params =
    new URLSearchParams(
        window.location.search
    );


    const username =
    params.get("username");


    if(!username){

        show(
            "❌ Falta ?username=\n\n" +
            "Ejemplo:\n" +
            "u.html?username=pan",
            "error"
        );

        return;
    }


    show(
        "3/4 — Consultando Supabase...\n\n" +
        "Username buscado: " +
        username
    );


    try{

        const response =
        await Promise.race([

            supabase
            .from("profiles")
            .select("*")
            .eq(
                "username",
                username.trim().toLowerCase()
            )
            .maybeSingle(),

            new Promise(
                resolve =>
                setTimeout(
                    () => resolve({
                        timeout:true
                    }),
                    7000
                )
            )

        ]);


        if(response.timeout){

            show(
                "❌ TIMEOUT\n\n" +
                "Supabase no respondió después de 7 segundos.\n\n" +
                "Esto apunta a un problema de conexión, URL/clave de Supabase o acceso a la tabla.",
                "error"
            );

            return;
        }


        console.log(
            "SUPABASE RESPONSE:",
            response
        );


        if(response.error){

            show(
                "❌ ERROR DE SUPABASE\n\n" +
                response.error.message +
                "\n\nCódigo: " +
                (response.error.code || "sin código"),
                "error"
            );

            return;
        }


        if(!response.data){

            show(
                "❌ PERFIL NO ENCONTRADO\n\n" +
                "Supabase respondió correctamente,\n" +
                "pero no existe un perfil con:\n\n" +
                "username = " +
                username,
                "error"
            );

            return;
        }


        show(
            "4/4 — ¡PERFIL ENCONTRADO! ✓\n\n" +
            JSON.stringify(
                response.data,
                null,
                2
            ),
            "ok"
        );


    }catch(error){

        console.error(
            error
        );


        show(
            "❌ ERROR JAVASCRIPT\n\n" +
            error.message,
            "error"
        );

    }

}

</script>

</body>
</html>
