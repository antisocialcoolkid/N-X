<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX Profile</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #242424 0%,
            #090909 45%,
            #020202 100%
        );

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

}


/* BACKGROUND */

.background{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-1;

}

.glow{

    position:absolute;

    width:500px;

    height:500px;

    border-radius:50%;

    background:white;

    filter:blur(150px);

    opacity:.06;

    animation:
        moveGlow
        10s
        ease-in-out
        infinite;

}

.glow.one{

    top:-300px;

    left:-250px;

}

.glow.two{

    right:-300px;

    bottom:-300px;

    animation-delay:-5s;

}


@keyframes moveGlow{

    0%,
    100%{

        transform:
            translate(0,0)
            scale(1);

    }

    50%{

        transform:
            translate(50px,40px)
            scale(1.15);

    }

}


/* LOGO */

.logo{

    position:fixed;

    top:25px;

    left:30px;

    color:white;

    text-decoration:none;

    font-size:24px;

    font-weight:900;

    letter-spacing:-1px;

}


/* CARD */

.profile-card{

    width:100%;

    max-width:520px;

    padding:45px 28px 30px;

    background:
        rgba(8,8,8,.94);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:25px;

    box-shadow:
        0 40px 120px
        rgba(0,0,0,.7);

    text-align:center;

    animation:
        appear
        .6s
        ease
        both;

}


@keyframes appear{

    from{

        opacity:0;

        transform:
            translateY(25px)
            scale(.97);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* AVATAR */

.avatar{

    width:110px;

    height:110px;

    margin:auto;

    border-radius:50%;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #292929,
            #080808
        );

    border:
        1px solid
        #3b3b3b;

    font-size:38px;

    font-weight:900;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.6);

}


.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}


/* USER */

.username{

    margin-top:22px;

    font-size:30px;

    font-weight:900;

    letter-spacing:-1px;

}


.subtitle{

    margin-top:7px;

    color:#555;

    font-size:12px;

}


/* BIO */

.bio{

    margin:
        20px
        auto
        0;

    max-width:430px;

    color:#777;

    font-size:13px;

    line-height:1.7;

}


/* LINKS */

.links{

    display:grid;

    gap:10px;

    margin-top:28px;

}


.link{

    display:block;

    padding:15px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        #222;

    border-radius:11px;

    color:#aaa;

    text-decoration:none;

    font-size:11px;

    font-weight:800;

    transition:.25s;

}


.link:hover{

    color:white;

    background:#111;

    border-color:#555;

    transform:
        translateY(-3px);

}


/* ERROR */

.error{

    color:#ff6666;

    font-size:14px;

    line-height:1.7;

}


/* MOBILE */

@media(max-width:600px){

    body{

        padding:20px;

    }

    .logo{

        top:20px;

        left:20px;

        font-size:21px;

    }

    .profile-card{

        padding:
            35px
            20px
            28px;

        border-radius:20px;

    }

    .avatar{

        width:90px;

        height:90px;

        font-size:30px;

    }

    .username{

        font-size:25px;

    }

}

</style>

</head>


<body>


<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

</div>


<a
    href="index.html"
    class="logo"
>
    NØX
</a>


<main
    id="profile"
    class="profile-card"
>

    <div>

        CARGANDO PERFIL...

    </div>

</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const profile =
document.getElementById(
    "profile"
);


/* =========================
   SUPABASE
========================= */

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   GET USERNAME
========================= */

const params =
new URLSearchParams(
    window.location.search
);


const username =
(
    params.get("username") ||
    ""
)
.trim()
.toLowerCase();


/* =========================
   START
========================= */

loadProfile();


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    if(!username){

        showError(
            "No se especificó ningún username."
        );

        return;

    }


    try{

        const {
            data,
            error
        } =
        await db

        .from("profiles")

        .select(
            "id,username,avatar_url,bio,github,youtube,theme,discord_id,discord_username,created_at,discord"
        )

        .eq(
            "username",
            username
        )

        .maybeSingle();


        if(error){

            console.error(
                error
            );

            showError(
                error.message
            );

            return;

        }


        if(!data){

            showError(
                "El perfil @" +
                username +
                " no existe."
            );

            return;

        }


        renderProfile(
            data
        );


    }catch(error){

        console.error(
            error
        );

        showError(
            error.message
        );

    }

}


/* =========================
   RENDER
========================= */

function renderProfile(
    user
){

    const name =
    user.username ||
    "user";


    const bio =
    user.bio ||
    "Welcome to my NØX profile.";


    let avatar = "";


    if(user.avatar_url){

        avatar = `

            <img
                src="${escapeHTML(
                    user.avatar_url
                )}"
                alt="Avatar"
                onerror="this.remove();"
            >

        `;

    }


    if(!avatar){

        avatar =
        escapeHTML(
            name
            .charAt(0)
            .toUpperCase()
        );

    }


    let links = "";


    /* DISCORD */

    if(user.discord){

        links += createLink(
            user.discord,
            "Discord ↗"
        );

    }
    else if(user.discord_username){

        links += createLink(
            "https://discord.com/users/" +
            encodeURIComponent(
                user.discord_username
            ),
            "Discord ↗"
        );

    }


    /* GITHUB */

    if(user.github){

        links += createLink(
            user.github,
            "GitHub ↗"
        );

    }


    /* YOUTUBE */

    if(user.youtube){

        links += createLink(
            user.youtube,
            "YouTube ↗"
        );

    }


    profile.innerHTML = `

        <div class="avatar">

            ${avatar}

        </div>


        <h1 class="username">

            @${escapeHTML(
                name
            )}

        </h1>


        <div class="subtitle">

            NØX Profile

        </div>


        <p class="bio">

            ${escapeHTML(
                bio
            )}

        </p>


        ${
            links
            ?
            `
            <div class="links">

                ${links}

            </div>
            `
            :
            ""
        }

    `;


    document.title =
    "@" +
    name +
    " — NØX";

}


/* =========================
   LINK
========================= */

function createLink(
    url,
    text
){

    let clean =
    String(url)
    .trim();


    if(
        !clean.startsWith(
            "http://"
        ) &&
        !clean.startsWith(
            "https://"
        )
    ){

        clean =
        "https://" +
        clean;

    }


    return `

        <a
            class="link"
            href="${escapeHTML(
                clean
            )}"
            target="_blank"
            rel="noopener noreferrer"
        >

            ${text}

        </a>

    `;

}


/* =========================
   ERROR
========================= */

function showError(
    text
){

    profile.innerHTML = `

        <div class="error">

            ❌ ${escapeHTML(
                text
            )}

        </div>

    `;

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(
    value
){

    const div =
    document.createElement(
        "div"
    );

    div.textContent =
    value ?? "";

    return div.innerHTML;

}

</script>


</body>

</html>
