<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Perfil</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:#050505;

    color:#fff;

    font-family:Arial,sans-serif;

}

#app{

    width:100%;

    max-width:470px;

    padding:30px;

    text-align:center;

    background:#111;

    border:1px solid #292929;

    border-radius:20px;

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.5);

}

#status{

    white-space:pre-wrap;

    line-height:1.6;

    color:#aaa;

}

#profile{

    display:none;

}

#avatar{

    width:105px;

    height:105px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    border:3px solid #fff;

    background:#222;

    font-size:36px;

    font-weight:bold;

}

#avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}

#name{

    margin-top:18px;

    font-size:28px;

    font-weight:800;

}

#username{

    margin-top:5px;

    color:#888;

}

#bio{

    margin-top:18px;

    color:#aaa;

    line-height:1.5;

}

#views{

    margin-top:15px;

    color:#777;

}

#error{

    display:none;

    margin-top:20px;

    padding:15px;

    border-radius:10px;

    background:#190909;

    color:#ff7777;

    white-space:pre-wrap;

    text-align:left;

}

</style>

</head>


<body>


<div id="app">


    <div id="status">

        NØX — iniciando...

    </div>


    <div id="error"></div>


    <div id="profile">


        <div id="avatar">

            N

        </div>


        <div id="name"></div>


        <div id="username"></div>


        <div id="bio"></div>


        <div id="views"></div>


    </div>


</div>


<!-- =================================
     SUPABASE
     CARGAR ANTES DEL SCRIPT PRINCIPAL
================================= -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =================================
   ELEMENTOS
================================= */

const status =
document.getElementById(
    "status"
);


const errorBox =
document.getElementById(
    "error"
);


const profile =
document.getElementById(
    "profile"
);


const avatar =
document.getElementById(
    "avatar"
);


const nameElement =
document.getElementById(
    "name"
);


const usernameElement =
document.getElementById(
    "username"
);


const bioElement =
document.getElementById(
    "bio"
);


const viewsElement =
document.getElementById(
    "views"
);


/* =================================
   PASO 1
================================= */

status.textContent =
"NØX — comprobando Supabase...";


/* =================================
   COMPROBAR SUPABASE
================================= */

if(
    typeof window.supabase ===
    "undefined"
){

    showError(
        "❌ PASO 1 FALLÓ\n\n" +
        "Supabase JS no cargó."
    );

}else{

    status.textContent =
        "✓ PASO 1 — Supabase JS funciona\n\n" +
        "NØX — creando conexión...";


    start();

}


/* =================================
   CONFIGURACIÓN
================================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


/* =================================
   START
================================= */

async function start(){

    try{


        /* =============================
           PASO 2
        ============================= */

        const supabase =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        status.textContent =
            "✓ PASO 1 — Supabase JS funciona\n\n" +

            "✓ PASO 2 — Cliente Supabase creado\n\n" +

            "NØX — leyendo URL...";


        /* =============================
           URL
        ============================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const username =
            params.get(
                "username"
            );


        if(!username){

            showError(
                "❌ PASO 3 FALLÓ\n\n" +

                "La URL no tiene username.\n\n" +

                "Ejemplo:\n" +

                "u.html?username=pan"
            );

            return;
        }


        status.textContent =
            "✓ PASO 1 — Supabase JS funciona\n\n" +

            "✓ PASO 2 — Cliente creado\n\n" +

            "✓ PASO 3 — Username encontrado\n\n" +

            "Username: @" +
            username +
            "\n\n" +

            "NØX — conectando con Supabase...";


        /* =============================
           CONSULTA
        ============================= */

        let result;


        try{

            result =
                await supabase
                    .from("profiles")
                    .select("*")
                    .eq(
                        "username",
                        username
                            .trim()
                            .toLowerCase()
                    )
                    .maybeSingle();

        }catch(queryError){

            showError(
                "❌ PASO 4 FALLÓ\n\n" +

                "No se pudo ejecutar la consulta.\n\n" +

                queryError.message
            );

            return;
        }


        /* =============================
           RESULTADO
        ============================= */

        console.log(
            "SUPABASE:",
            result
        );


        if(result.error){

            showError(
                "❌ PASO 4 — ERROR SUPABASE\n\n" +

                result.error.message
            );

            return;
        }


        if(!result.data){

            showError(
                "❌ PASO 4\n\n" +

                "La conexión funciona,\n" +

                "pero no existe un perfil con:\n\n" +

                "@" +
                username
            );

            return;
        }


        const data =
            result.data;


        /* =============================
           PERFIL ENCONTRADO
        ============================= */

        status.textContent =
            "✓ PASO 1 — Supabase JS funciona\n\n" +

            "✓ PASO 2 — Cliente creado\n\n" +

            "✓ PASO 3 — Username encontrado\n\n" +

            "✓ PASO 4 — PERFIL ENCONTRADO ✓\n\n" +

            "Cargando perfil...";


        /* =============================
           DATOS
        ============================= */

        nameElement.textContent =
            data.display_name ||
            data.username ||
            "NØX User";


        usernameElement.textContent =
            "@" +
            data.username;


        bioElement.textContent =
            data.bio ||
            "Welcome to my NØX profile.";


        const oldViews =
            Number(
                data.profile_views || 0
            );


        viewsElement.textContent =
            "👁️ " +
            oldViews +
            (
                oldViews === 1
                ? " vista"
                : " vistas"
            );


        /* =============================
           AVATAR
        ============================= */

        if(data.avatar_url){

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                data.avatar_url;


            img.alt =
                "Avatar";


            img.onerror =
                function(){

                    avatar.textContent =
                        firstLetter(
                            data.username
                        );

                };


            avatar.innerHTML =
                "";


            avatar.appendChild(
                img
            );

        }else{

            avatar.textContent =
                firstLetter(
                    data.username
                );

        }


        /* =============================
           MOSTRAR PERFIL
        ============================= */

        status.style.display =
            "none";


        profile.style.display =
            "block";


        /* =============================
           PASO 5
        ============================= */

        console.log(
            "NØX: aumentando vistas..."
        );


        const viewResult =
            await supabase.rpc(
                "increment_profile_views",
                {
                    profile_uuid:
                        data.id
                }
            );


        console.log(
            "VIEW RESULT:",
            viewResult
        );


        if(
            viewResult.error
        ){

            console.error(
                viewResult.error
            );

            return;
        }


        /* =============================
           ACTUALIZAR VISTA
        ============================= */

        const newViews =
            oldViews + 1;


        viewsElement.textContent =
            "👁️ " +
            newViews +
            (
                newViews === 1
                ? " vista"
                : " vistas"
            );


    }catch(error){

        console.error(
            error
        );


        showError(
            "❌ ERROR GENERAL\n\n" +

            error.message
        );

    }

}


/* =================================
   PRIMERA LETRA
================================= */

function firstLetter(
    text
){

    return (
        text ||
        "N"
    )
    .charAt(0)
    .toUpperCase();

}


/* =================================
   ERROR
================================= */

function showError(
    message
){

    status.style.display =
        "none";


    profile.style.display =
        "none";


    errorBox.style.display =
        "block";


    errorBox.textContent =
        message;

}

</script>

</body>

    </html>
