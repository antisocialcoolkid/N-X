<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX Profile</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    background:#050505;

    color:white;

    font-family:Arial,sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.card{

    width:100%;

    max-width:500px;

    padding:40px 25px;

    background:#0d0d0d;

    border:1px solid #222;

    border-radius:20px;

    text-align:center;

}

.avatar{

    width:100px;

    height:100px;

    margin:auto;

    border-radius:50%;

    background:#222;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:35px;

    font-weight:bold;

    overflow:hidden;

}

.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.username{

    margin-top:20px;

    font-size:28px;

    font-weight:bold;

}

.bio{

    color:#888;

    margin-top:15px;

    line-height:1.6;

}

.links{

    margin-top:25px;

    display:grid;

    gap:10px;

}

.links a{

    padding:15px;

    background:#151515;

    border:1px solid #292929;

    border-radius:10px;

    color:#fff;

    text-decoration:none;

}

.error{

    color:#ff5555;

}

</style>

</head>


<body>


<div
    id="app"
    class="card"
>

    Cargando perfil...

</div>


<script>

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const app =
document.getElementById("app");


/* Cargar Supabase */

const script =
document.createElement("script");


script.src =
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";


script.onload =
function(){

    loadProfile();

};


script.onerror =
function(){

    app.innerHTML =
    '<div class="error">No se pudo cargar Supabase.</div>';

};


document.head.appendChild(
    script
);


/* Perfil */

async function loadProfile(){

    const params =
    new URLSearchParams(
        window.location.search
    );


    const username =
    params
    .get("username");


    if(!username){

        app.innerHTML =
        '<div class="error">Falta el username.</div>';

        return;

    }


    try{

        const supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        const response =
        await supabase

        .from("profiles")

        .select(
            "*"
        )

        .eq(
            "username",
            username
            .trim()
            .toLowerCase()
        )

        .maybeSingle();


        console.log(
            response
        );


        if(response.error){

            app.innerHTML = `

                <div class="error">

                    ❌ ${response.error.message}

                </div>

            `;

            return;

        }


        if(!response.data){

            app.innerHTML = `

                <div class="error">

                    ❌ Perfil no encontrado

                </div>

            `;

            return;

        }


        const profile =
        response.data;


        render(
            profile
        );


    }catch(error){

        console.error(
            error
        );


        app.innerHTML = `

            <div class="error">

                ❌ ${error.message}

            </div>

        `;

    }

}


/* Mostrar perfil */

function render(
    profile
){

    const username =
    profile.username ||
    "user";


    const bio =
    profile.bio ||
    "Welcome to my NØX profile.";


    let avatar;


    if(
        profile.avatar_url
    ){

        avatar = `

            <img
                src="${profile.avatar_url}"
                alt="Avatar"
            >

        `;

    }else{

        avatar =
        username
        .charAt(0)
        .toUpperCase();

    }


    let links = "";


    if(profile.discord){

        links += `

            <a
                href="${makeURL(
                    profile.discord
                )}"
                target="_blank"
            >

                Discord ↗

            </a>

        `;

    }


    if(profile.discord_username){

        links += `

            <a
                href="https://discord.com/users/${encodeURIComponent(
                    profile.discord_username
                )}"
                target="_blank"
            >

                Discord ↗

            </a>

        `;

    }


    if(profile.github){

        links += `

            <a
                href="${makeURL(
                    profile.github
                )}"
                target="_blank"
            >

                GitHub ↗

            </a>

        `;

    }


    if(profile.youtube){

        links += `

            <a
                href="${makeURL(
                    profile.youtube
                )}"
                target="_blank"
            >

                YouTube ↗

            </a>

        `;

    }


    app.innerHTML = `

        <div class="avatar">

            ${avatar}

        </div>


        <div class="username">

            @${escapeHTML(
                username
            )}

        </div>


        <div class="bio">

            ${escapeHTML(
                bio
            )}

        </div>


        ${
            links
            ?
            `
            <div class="links">

                ${links}

            </div>
            `
            :
            ""
        }

    `;


    document.title =
    "@" +
    username +
    " — NØX";

}


/* URL */

function makeURL(
    value
){

    const text =
    String(value)
    .trim();


    if(
        text.startsWith(
            "http://"
        ) ||
        text.startsWith(
            "https://"
        )
    ){

        return text;

    }


    return (
        "https://" +
        text
    );

}


/* Seguridad */

function escapeHTML(
    value
){

    const div =
    document.createElement(
        "div"
    );


    div.textContent =
    value ?? "";


    return div.innerHTML;

}

</script>

</body>

</html>
