<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#030303">

<title>NØX — Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#030303;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;
    z-index:-2;

    background:
        radial-gradient(
            circle at 50% 0%,
            #222 0%,
            #090909 35%,
            #030303 75%
        );
}

.grid{
    position:absolute;
    inset:0;
    opacity:.2;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:45px 45px;
}

.glow{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    background:white;
    filter:blur(150px);
    opacity:.06;
}

.glow.one{
    top:-250px;
    left:-180px;
}

.glow.two{
    right:-250px;
    bottom:-250px;
}

/* NAV */

nav{
    width:min(1150px,92%);
    height:80px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #191919;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:25px;
    font-weight:950;
}

.nav-right{
    display:flex;
    gap:9px;
}

.nav-button{
    padding:10px 15px;

    border:1px solid #292929;
    border-radius:9px;

    background:#0b0b0b;
    color:#aaa;

    text-decoration:none;
    font-size:10px;
    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.nav-button:hover{
    color:white;
    border-color:#444;
}

/* MAIN */

.container{
    width:min(1150px,92%);
    margin:45px auto 80px;
}

.page-title{
    margin-bottom:30px;
}

.badge{
    width:max-content;

    padding:7px 11px;

    border:1px solid #292929;
    border-radius:100px;

    color:#777;

    font-size:8px;
    font-weight:900;
    letter-spacing:2px;
}

.page-title h1{
    margin-top:18px;

    font-size:42px;
    letter-spacing:-2px;
}

.page-title p{
    margin-top:8px;

    color:#666;
    font-size:12px;
}

/* GRID */

.editor-grid{
    display:grid;

    grid-template-columns:
        1fr 390px;

    gap:20px;
}

/* CARD */

.card{
    padding:28px;

    border:1px solid #1d1d1d;
    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #0d0d0d,
            #070707
        );

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.35);
}

.card-title{
    font-size:18px;
    font-weight:900;
}

.card-subtitle{
    margin-top:6px;

    color:#555;
    font-size:10px;
}

/* FORM */

.field{
    margin-top:20px;
}

label{
    display:block;

    margin-bottom:8px;

    color:#777;

    font-size:9px;
    font-weight:900;

    text-transform:uppercase;
    letter-spacing:1.5px;
}

input,
textarea{

    width:100%;

    border:1px solid #292929;
    border-radius:9px;

    outline:none;

    background:#050505;
    color:white;

    font-family:inherit;
    font-size:12px;

    transition:.2s;
}

input{
    height:50px;
    padding:0 14px;
}

textarea{
    min-height:100px;
    padding:14px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#666;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.025);
}

input::placeholder,
textarea::placeholder{
    color:#3d3d3d;
}

.username-wrap{
    display:flex;
}

.username-prefix{
    height:50px;

    display:flex;
    align-items:center;

    padding:0 13px;

    border:1px solid #292929;
    border-right:0;

    border-radius:9px 0 0 9px;

    background:#0a0a0a;

    color:#555;

    font-size:12px;
}

.username-wrap input{
    border-radius:0 9px 9px 0;
}

/* BUTTON */

.save{
    width:100%;

    height:52px;

    margin-top:25px;

    border:0;
    border-radius:9px;

    background:white;
    color:black;

    cursor:pointer;

    font-size:11px;
    font-weight:950;

    transition:.2s;
}

.save:hover{
    transform:translateY(-2px);

    box-shadow:
        0 15px 40px
        rgba(255,255,255,.12);
}

.save:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* STATUS */

#message{
    min-height:18px;

    margin-top:14px;

    text-align:center;

    color:#777;

    font-size:10px;
}

.success{
    color:#70ffad !important;
}

.error{
    color:#ff6e6e !important;
}

/* PREVIEW */

.preview-card{
    position:sticky;
    top:25px;

    padding:30px;

    border:1px solid #252525;
    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #111,
            #070707
        );

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.5);
}

.preview-label{
    color:#555;

    font-size:8px;
    font-weight:900;

    letter-spacing:2px;
}

.preview-avatar{

    width:76px;
    height:76px;

    margin-top:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border:1px solid #333;
    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #252525,
            #080808
        );

    color:white;

    font-size:27px;
    font-weight:950;
}

.preview-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.preview-name{
    margin-top:18px;

    font-size:23px;
    font-weight:900;
}

.preview-username{
    margin-top:4px;

    color:#555;

    font-size:11px;
}

.preview-bio{
    margin-top:17px;

    color:#777;

    font-size:11px;
    line-height:1.7;
}

.preview-links{
    display:grid;
    gap:8px;

    margin-top:22px;
}

.preview-link{

    padding:12px;

    border:1px solid #1f1f1f;
    border-radius:8px;

    background:#0a0a0a;

    color:#777;

    text-decoration:none;

    font-size:10px;

    transition:.2s;
}

.preview-link:hover{
    color:white;
    border-color:#444;
}

.profile-url{
    margin-top:22px;
    padding:13px;

    border:1px solid #1d1d1d;
    border-radius:9px;

    background:#050505;

    color:#555;

    font-size:9px;

    word-break:break-all;
}

.copy{
    width:100%;

    height:43px;

    margin-top:8px;

    border:1px solid #292929;
    border-radius:8px;

    background:#0d0d0d;
    color:#aaa;

    cursor:pointer;

    font-size:10px;
    font-weight:800;
}

.copy:hover{
    color:white;
    border-color:#444;
}

/* MOBILE */

@media(max-width:850px){

    body{
        overflow:auto;
    }

    .editor-grid{
        grid-template-columns:1fr;
    }

    .preview-card{
        position:relative;
        top:auto;
    }

}

@media(max-width:600px){

    nav{
        height:70px;
    }

    .container{
        margin-top:30px;
    }

    .page-title h1{
        font-size:34px;
    }

    .card{
        padding:22px;
    }

}

</style>

</head>


<body>


<div class="background">

    <div class="grid"></div>

    <div class="glow one"></div>

    <div class="glow two"></div>

</div>


<nav>

    <a
        href="index.html"
        class="logo">

        NØX

    </a>


    <div class="nav-right">

        <a
            id="viewProfile"
            class="nav-button"
            href="#"
            target="_blank">

            View profile ↗

        </a>


        <button
            id="logout"
            class="nav-button">

            Logout

        </button>

    </div>

</nav>


<main class="container">


<div class="page-title">

    <div class="badge">
        NØX PROFILE
    </div>

    <h1>
        Customize your identity.
    </h1>

    <p>
        Control everything people see on your NØX profile.
    </p>

</div>


<div class="editor-grid">


<!-- EDITOR -->

<section class="card">

    <h2 class="card-title">
        Profile settings
    </h2>

    <p class="card-subtitle">
        Update your public NØX identity.
    </p>


    <form id="profileForm">


        <div class="field">

            <label>
                Username
            </label>

            <div class="username-wrap">

                <span class="username-prefix">
                    @
                </span>

                <input
                    id="username"
                    type="text"
                    placeholder="maxiii"
                    required
                >

            </div>

        </div>


        <div class="field">

            <label>
                Display name
            </label>

            <input
                id="displayName"
                type="text"
                placeholder="Maxiii"
            >

        </div>


        <div class="field">

            <label>
                Bio
            </label>

            <textarea
                id="bio"
                placeholder="Welcome to my NØX profile."
            ></textarea>

        </div>


        <div class="field">

            <label>
                Avatar URL
            </label>

            <input
                id="avatarUrl"
                type="url"
                placeholder="https://..."
            >

        </div>


        <div class="field">

            <label>
                Discord
            </label>

            <input
                id="discord"
                type="text"
                placeholder="https://discord.com/..."
            >

        </div>


        <div class="field">

            <label>
                YouTube
            </label>

            <input
                id="youtube"
                type="url"
                placeholder="https://youtube.com/..."
            >

        </div>


        <div class="field">

            <label>
                GitHub
            </label>

            <input
                id="github"
                type="url"
                placeholder="https://github.com/..."
            >

        </div>


        <button
            id="saveButton"
            class="save"
            type="submit">

            Save changes

        </button>


        <div id="message"></div>


    </form>

</section>


<!-- PREVIEW -->

<aside class="preview-card">


<div class="preview-label">
    LIVE PREVIEW
</div>


<div
    id="previewAvatar"
    class="preview-avatar">

    N

</div>


<div
    id="previewName"
    class="preview-name">

    NØX User

</div>


<div
    id="previewUsername"
    class="preview-username">

    @username

</div>


<div
    id="previewBio"
    class="preview-bio">

    Welcome to my NØX profile.

</div>


<div
    id="previewLinks"
    class="preview-links">

</div>


<div
    id="profileUrl"
    class="profile-url">

    Loading profile URL...

</div>


<button
    id="copyButton"
    class="copy">

    Copy profile link

</button>


</aside>


</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="profile.js"></script>


</body>

</html>
