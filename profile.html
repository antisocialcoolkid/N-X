<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at 20% 0%,
            #252525,
            #070707 45%,
            #020202
        );

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    padding:25px;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:25px;
    font-weight:900;
}

.logout{
    background:#151515;
    border:1px solid #292929;
    color:white;
    padding:10px 15px;
    border-radius:9px;
    cursor:pointer;
}

.layout{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:20px;
}

.card{
    background:#0c0c0c;
    border:1px solid #242424;
    border-radius:20px;
    padding:25px;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

h1{
    margin:0 0 5px;
}

.subtitle{
    color:#777;
    font-size:13px;
    margin-bottom:25px;
}

.section{
    margin-top:25px;
}

.section-title{
    font-size:12px;
    font-weight:900;
    color:#999;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:12px;
}

label{
    display:block;
    color:#aaa;
    font-size:11px;
    margin:13px 0 6px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #292929;
    background:#151515;
    color:white;
    outline:none;
    font-family:inherit;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#666;
}

input:disabled{
    color:#777;
    cursor:not-allowed;
    background:#101010;
}

.file{
    padding:10px;
}

.username-row{
    display:flex;
    gap:10px;
    align-items:center;
}

.lock{
    padding:12px 14px;
    background:#151515;
    border:1px solid #292929;
    border-radius:9px;
    color:#777;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:25px;
}

.actions button{
    flex:1;
}

button{
    border:0;
    border-radius:9px;
    padding:13px 16px;
    cursor:pointer;
    font-weight:800;
}

.save{
    background:white;
    color:black;
}

.generate{
    background:#1b1b1b;
    border:1px solid #333;
    color:white;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    min-height:20px;
    margin-top:15px;
    text-align:center;
    font-size:12px;
    color:#777;
}

.success{
    color:#5cff8d !important;
}

.error{
    color:#ff6060 !important;
}

/* PREVIEW */

.preview{
    position:sticky;
    top:20px;
    overflow:hidden;
    padding:0;
}

.banner{
    height:150px;
    background:
        linear-gradient(
            135deg,
            #222,
            #080808
        );
    background-size:cover;
    background-position:center;
}

.preview-content{
    padding:0 22px 25px;
    text-align:center;
}

.avatar{
    width:90px;
    height:90px;
    margin:-45px auto 12px;

    border-radius:50%;

    background:#202020;

    border:4px solid #0c0c0c;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;
    font-weight:900;

    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.preview-name{
    font-size:23px;
    font-weight:900;
}

.preview-user{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.preview-bio{
    color:#aaa;
    font-size:13px;
    margin-top:15px;
    line-height:1.5;
}

.preview-links{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-top:18px;
}

.preview-links a{
    color:white;
    text-decoration:none;
    padding:12px;
    background:#151515;
    border:1px solid #292929;
    border-radius:9px;
}

.music{
    margin-top:18px;
    width:100%;
}

.link-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

.link-row input{
    min-width:0;
}

.remove-link{
    background:#181818;
    color:#ff6060;
}

.profile-link{
    margin-top:18px;
    padding:14px;
    background:#111;
    border:1px solid #292929;
    border-radius:10px;
    word-break:break-all;
    color:#aaa;
    font-size:12px;
}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
    }

}

</style>

</head>


<body>


<div class="container">


<div class="top">

<a href="index.html" class="logo">
NØX
</a>

<button
    id="logout"
    class="logout"
    type="button"
>
Logout
</button>

</div>


<div class="layout">


<!-- EDITOR -->

<section class="card">


<h1>
Customize your profile
</h1>


<p class="subtitle">
Make your NØX profile yours.
</p>


<div class="section">

<div class="section-title">
Identity
</div>


<label>
Username
</label>


<div class="username-row">

<input
    id="username"
    disabled
>


<div class="lock">
🔒
</div>

</div>


<label>
Display name
</label>

<input
    id="displayName"
    placeholder="Your name"
>


<label>
Bio
</label>

<textarea
    id="bio"
    placeholder="Tell people about yourself..."
></textarea>

</div>


<div class="section">

<div class="section-title">
Images
</div>


<label>
Avatar
</label>

<input
    id="avatarFile"
    class="file"
    type="file"
    accept="image/*"
>


<label>
Banner
</label>

<input
    id="bannerFile"
    class="file"
    type="file"
    accept="image/*"
>

</div>


<div class="section">

<div class="section-title">
Music
</div>


<label>
Profile music
</label>

<input
    id="musicFile"
    class="file"
    type="file"
    accept="audio/*"
>

</div>


<div class="section">

<div class="section-title">
Socials
</div>


<label>
Discord
</label>

<input
    id="discord"
    placeholder="username"
>


<label>
YouTube
</label>

<input
    id="youtube"
    placeholder="https://youtube.com/..."
>


<label>
GitHub
</label>

<input
    id="github"
    placeholder="https://github.com/..."
>

</div>


<div class="section">

<div class="section-title">
Custom links
</div>


<div id="links"></div>


<button
    id="addLink"
    type="button"
    class="generate"
>
+ Add link
</button>

</div>


<div class="actions">

<button
    id="save"
    class="save"
    type="button"
>
Save changes
</button>


<button
    id="generate"
    class="generate"
    type="button"
>
Generate link
</button>

</div>


<div
    id="message"
    class="message"
>
Loading...
</div>


<div
    id="profileLink"
    class="profile-link"
    style="display:none"
></div>


</section>


<!-- PREVIEW -->

<section class="card preview">


<div
    id="previewBanner"
    class="banner"
></div>


<div class="preview-content">


<div
    id="previewAvatar"
    class="avatar"
>
N
</div>


<div
    id="previewName"
    class="preview-name"
>
NØX User
</div>


<div
    id="previewUsername"
    class="preview-user"
>
@username
</div>


<div
    id="previewBio"
    class="preview-bio"
>
Welcome to my NØX profile.
</div>


<div
    id="previewLinks"
    class="preview-links"
></div>


<audio
    id="previewMusic"
    class="music"
    controls
    style="display:none"
></audio>


</div>

</section>


</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const username =
document.getElementById("username");

const displayName =
document.getElementById("displayName");

const bio =
document.getElementById("bio");

const discord =
document.getElementById("discord");

const youtube =
document.getElementById("youtube");

const github =
document.getElementById("github");

const avatarFile =
document.getElementById("avatarFile");

const bannerFile =
document.getElementById("bannerFile");

const musicFile =
document.getElementById("musicFile");

const saveButton =
document.getElementById("save");

const generateButton =
document.getElementById("generate");

const logout =
document.getElementById("logout");

const message =
document.getElementById("message");

const profileLink =
document.getElementById("profileLink");

const links =
document.getElementById("links");


let currentUser = null;

let profile = null;

let avatarUrl = null;

let bannerUrl = null;

let musicUrl = null;


/* =========================
   LOAD
========================= */

async function loadProfile(){

    message.textContent =
    "Cargando perfil...";


    const {
        data,
        error
    } =
    await supabase.auth.getUser();


    if(error || !data.user){

        window.location.href =
        "login.html";

        return;

    }


    currentUser =
    data.user;


    const result =
    await supabase
    .from("profiles")
    .select("*")
    .eq(
        "id",
        currentUser.id
    )
    .maybeSingle();


    if(result.error){

        showError(
            result.error.message
        );

        return;

    }


    if(!result.data){

        showError(
            "No existe tu perfil."
        );

        return;

    }


    profile =
    result.data;


    username.value =
    profile.username || "";


    displayName.value =
    profile.display_name || "";


    bio.value =
    profile.bio || "";


    discord.value =
    profile.discord || "";


    youtube.value =
    profile.youtube || "";


    github.value =
    profile.github || "";


    avatarUrl =
    profile.avatar_url || null;


    bannerUrl =
    profile.banner_url || null;


    musicUrl =
    profile.music_url || null;


    updatePreview();


    message.textContent =
    "";

}


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    const name =
    displayName.value.trim();

    const user =
    username.value.trim();

    const biography =
    bio.value.trim();


    document
    .getElementById(
        "previewName"
    )
    .textContent =
    name ||
    user ||
    "NØX User";


    document
    .getElementById(
        "previewUsername"
    )
    .textContent =
    "@" +
    (
        user ||
        "username"
    );


    document
    .getElementById(
        "previewBio"
    )
    .textContent =
    biography ||
    "Welcome to my NØX profile.";


    const avatar =
    document.getElementById(
        "previewAvatar"
    );


    avatar.innerHTML = "";


    if(avatarUrl){

        const img =
        document.createElement(
            "img"
        );

        img.src =
        avatarUrl;

        avatar.appendChild(
            img
        );

    }else{

        avatar.textContent =
        (
            name ||
            user ||
            "N"
        )
        .charAt(0)
        .toUpperCase();

    }


    const banner =
    document.getElementById(
        "previewBanner"
    );


    if(bannerUrl){

        banner.style.backgroundImage =
        `url("${bannerUrl}")`;

    }else{

        banner.style.backgroundImage =
        "linear-gradient(135deg,#222,#080808)";

    }


    const music =
    document.getElementById(
        "previewMusic"
    );


    if(musicUrl){

        music.src =
        musicUrl;

        music.style.display =
        "block";

    }else{

        music.style.display =
        "none";

    }


    updateLinks();

}


/* =========================
   LINKS
========================= */

function updateLinks(){

    const container =
    document.getElementById(
        "previewLinks"
    );


    container.innerHTML = "";


    addLink(
        discord.value,
        "Discord"
    );


    addLink(
        youtube.value,
        "YouTube"
    );


    addLink(
        github.value,
        "GitHub"
    );

}


function addLink(
    url,
    title
){

    if(!url)
        return;


    const a =
    document.createElement(
        "a"
    );


    a.href =
    normalizeUrl(url);

    a.target =
    "_blank";

    a.rel =
    "noopener noreferrer";

    a.textContent =
    title + " ↗";


    document
    .getElementById(
        "previewLinks"
    )
    .appendChild(a);

}


function normalizeUrl(
    value
){

    if(
        value.startsWith(
            "http://"
        ) ||
        value.startsWith(
            "https://"
        )
    ){

        return value;

    }


    return "https://" + value;

}


/* =========================
   LIVE PREVIEW
========================= */

[
    displayName,
    bio,
    discord,
    youtube,
    github
]
.forEach(
    input => {

        input.addEventListener(
            "input",
            updatePreview
        );

    }
);


/* =========================
   FILE UPLOAD
========================= */

async function uploadFile(
    file,
    folder
){

    if(!file)
        return null;


    const extension =
    file.name
    .split(".")
    .pop()
    .toLowerCase();


    const path =
    currentUser.id +
    "/" +
    folder +
    "-" +
    Date.now() +
    "." +
    extension;


    const result =
    await supabase.storage
    .from(
        "profile-assets"
    )
    .upload(
        path,
        file,
        {
            upsert:true
        }
    );


    if(result.error){

        throw result.error;

    }


    const publicUrl =
    supabase.storage
    .from(
        "profile-assets"
    )
    .getPublicUrl(
        path
    );


    return publicUrl
    .data
    .publicUrl;

}


/* =========================
   SAVE
========================= */

saveButton.addEventListener(
    "click",
    saveProfile
);


async function saveProfile(){

    saveButton.disabled =
    true;

    saveButton.textContent =
    "Saving...";


    message.className = "";

    message.textContent =
    "Guardando cambios...";


    try{

        /* AVATAR */

        if(
            avatarFile.files[0]
        ){

            avatarUrl =
            await uploadFile(
                avatarFile.files[0],
                "avatar"
            );

        }


        /* BANNER */

        if(
            bannerFile.files[0]
        ){

            bannerUrl =
            await uploadFile(
                bannerFile.files[0],
                "banner"
            );

        }


        /* MUSIC */

        if(
            musicFile.files[0]
        ){

            musicUrl =
            await uploadFile(
                musicFile.files[0],
                "music"
            );

        }


        const result =
        await supabase
        .from("profiles")
        .update({

            display_name:
            displayName.value.trim(),

            bio:
            bio.value.trim(),

            avatar_url:
            avatarUrl,

            banner_url:
            bannerUrl,

            music_url:
            musicUrl,

            discord:
            discord.value.trim(),

            youtube:
            youtube.value.trim(),

            github:
            github.value.trim()

        })
        .eq(
            "id",
            currentUser.id
        );


        if(result.error){

            throw result.error;

        }


        updatePreview();


        message.className =
        "success";

        message.textContent =
        "✓ Perfil guardado";


        saveButton.textContent =
        "Saved ✓";


        setTimeout(
        () => {

            saveButton.disabled =
            false;

            saveButton.textContent =
            "Save changes";

        },
        1200
        );

    }

    catch(error){

        console.error(
            error
        );


        showError(
            error.message
        );


        saveButton.disabled =
        false;

        saveButton.textContent =
        "Save changes";

    }

}


/* =========================
   GENERATE LINK
========================= */

generateButton.addEventListener(
    "click",
    generateLink
);


function generateLink(){

    const user =
    username.value.trim();


    if(!user){

        showError(
            "Tu username no existe."
        );

        return;

    }


    const url =
    window.location.origin +
    "/N-X/u.html?username=" +
    encodeURIComponent(
        user
    );


    profileLink.style.display =
    "block";


    profileLink.textContent =
    url;


    navigator.clipboard
    .writeText(
        url
    )
    .then(
        () => {

            message.className =
            "success";

            message.textContent =
            "✓ Link generado y copiado";

        }
    )
    .catch(
        () => {

            message.className =
            "success";

            message.textContent =
            "✓ Link generado";

        }
    );

}


/* =========================
   LOGOUT
========================= */

logout.addEventListener(
    "click",
    async function(){

        await supabase.auth.signOut();

        window.location.href =
        "login.html";

    }
);


/* =========================
   ERROR
========================= */

function showError(
    text
){

    message.className =
    "error";

    message.textContent =
    "❌ " +
    text;

}


/* =========================
   START
========================= */

loadProfile();

</script>


</body>

</html>
