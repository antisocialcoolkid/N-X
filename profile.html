<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NØX Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="profile-page">

        <nav>
            <a href="index.html" class="logo">
                NØX
            </a>

            <button id="logout">
                Logout
            </button>
        </nav>


        <section class="profile-card">

            <div class="profile-avatar" id="avatar">
                N
            </div>

            <h1 id="username">
                Loading...
            </h1>

            <p id="bio">
                Welcome to my NØX profile.
            </p>


            <div class="profile-links">

                <a
                    href="#"
                    id="discord"
                    target="_blank"
                    hidden
                >
                    Discord ↗
                </a>

                <a
                    href="#"
                    id="github"
                    target="_blank"
                    hidden
                >
                    GitHub ↗
                </a>

                <a
                    href="#"
                    id="youtube"
                    target="_blank"
                    hidden
                >
                    YouTube ↗
                </a>

            </div>

        </section>


        <footer>
            <span>NØX</span>
            <span>Profiles</span>
        </footer>

    </main>


    <script
        type="module"
        src="profile.js"
    ></script>

</body>

</html>
