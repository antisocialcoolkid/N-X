<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    padding:25px;

    background:
        radial-gradient(
            circle at 20% 0%,
            #292929,
            #080808 45%,
            #020202
        );

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.container{

    width:100%;

    max-width:1100px;

    margin:auto;
}

.top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:25px;
}

.logo{

    color:white;

    text-decoration:none;

    font-size:26px;

    font-weight:900;
}

.logout{

    padding:10px 15px;

    border:
        1px solid
        #292929;

    border-radius:9px;

    background:#151515;

    color:white;

    cursor:pointer;
}

.layout{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        390px;

    gap:20px;
}

.card{

    background:#0c0c0c;

    border:
        1px solid
        #242424;

    border-radius:20px;

    padding:25px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.45);
}

h1{

    margin:0 0 6px;

    font-size:30px;
}

.subtitle{

    margin:
        0
        0
        25px;

    color:#777;

    font-size:13px;
}

.section{

    margin-top:25px;
}

.section-title{

    margin-bottom:12px;

    color:#999;

    font-size:11px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:1px;
}

label{

    display:block;

    margin:
        14px
        0
        6px;

    color:#aaa;

    font-size:11px;

    font-weight:700;
}

input,
textarea{

    width:100%;

    padding:13px;

    background:#151515;

    color:white;

    border:
        1px solid
        #292929;

    border-radius:9px;

    outline:none;

    font-family:inherit;
}

input{

    height:48px;
}

textarea{

    min-height:100px;

    resize:vertical;
}

input:focus,
textarea:focus{

    border-color:#666;
}

input:disabled{

    color:#777;

    background:#101010;

    cursor:not-allowed;
}

.username-row{

    display:flex;

    gap:8px;
}

.username-row input{

    flex:1;
}

.lock{

    width:48px;

    height:48px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#151515;

    border:
        1px solid
        #292929;

    border-radius:9px;

    color:#777;
}

.file{

    height:auto;

    padding:10px;
}

.actions{

    display:flex;

    gap:10px;

    margin-top:25px;
}

button{

    border:0;

    border-radius:9px;

    padding:13px 16px;

    font-weight:900;

    cursor:pointer;
}

.actions button{

    flex:1;
}

.save{

    background:white;

    color:black;
}

.generate{

    background:#181818;

    border:
        1px solid
        #333;

    color:white;
}

button:disabled{

    opacity:.5;

    cursor:not-allowed;
}

.message{

    min-height:20px;

    margin-top:16px;

    text-align:center;

    color:#777;

    font-size:12px;
}

.success{

    color:#5cff8d !important;
}

.error{

    color:#ff5c5c !important;
}

.profile-link{

    margin-top:15px;

    padding:14px;

    background:#111;

    border:
        1px solid
        #292929;

    border-radius:10px;

    color:#aaa;

    font-size:12px;

    word-break:break-all;
}


/* =========================
   PREVIEW
========================= */

.preview{

    padding:0;

    overflow:hidden;

    position:sticky;

    top:20px;

}

.banner{

    width:100%;

    height:155px;

    background:

        linear-gradient(
            135deg,
            #252525,
            #070707
        );

    background-size:cover;

    background-position:center;
}

.preview-content{

    padding:
        0
        22px
        25px;

    text-align:center;
}

.avatar{

    width:92px;

    height:92px;

    margin:
        -46px
        auto
        12px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border:
        4px solid
        #0c0c0c;

    border-radius:50%;

    background:#202020;

    color:white;

    font-size:30px;

    font-weight:900;
}

.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;
}

.preview-name{

    font-size:23px;

    font-weight:900;
}

.preview-user{

    margin-top:5px;

    color:#777;

    font-size:12px;
}

.preview-bio{

    margin-top:15px;

    color:#aaa;

    font-size:13px;

    line-height:1.5;
}

.preview-links{

    display:flex;

    flex-direction:column;

    gap:9px;

    margin-top:18px;
}

.preview-links a{

    padding:12px;

    background:#151515;

    border:
        1px solid
        #292929;

    border-radius:9px;

    color:white;

    text-decoration:none;
}

.music{

    width:100%;

    margin-top:18px;
}


@media(max-width:850px){

    .layout{

        grid-template-columns:1fr;

    }

    .preview{

        position:relative;

        top:0;

    }

}

</style>

</head>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>


"use strict";


/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const username =
document.getElementById(
    "username"
);

const displayName =
document.getElementById(
    "displayName"
);

const bio =
document.getElementById(
    "bio"
);

const discord =
document.getElementById(
    "discord"
);

const youtube =
document.getElementById(
    "youtube"
);

const github =
document.getElementById(
    "github"
);

const avatarFile =
document.getElementById(
    "avatarFile"
);

const bannerFile =
document.getElementById(
    "bannerFile"
);

const musicFile =
document.getElementById(
    "musicFile"
);

const saveButton =
document.getElementById(
    "save"
);

const generateButton =
document.getElementById(
    "generate"
);

const logoutButton =
document.getElementById(
    "logout"
);

const message =
document.getElementById(
    "message"
);

const profileLink =
document.getElementById(
    "profileLink"
);


let currentUser = null;

let profile = null;

let avatarUrl = null;

let bannerUrl = null;

let musicUrl = null;


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    message.textContent =
    "1/4 — Comprobando sesión...";


    try{

        const {
            data:
            sessionData,
            error:
            sessionError
        } =
        await supabase.auth.getUser();


        if(sessionError){

            throw sessionError;

        }


        if(
            !sessionData ||
            !sessionData.user
        ){

            window.location.href =
            "login.html";

            return;

        }


        currentUser =
        sessionData.user;


        message.textContent =
        "2/4 — Buscando perfil...";


        const {
            data,
            error
        } =
        await supabase
        .from("profiles")
        .select("*")
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


        if(error){

            throw error;

        }


        if(!data){

            throw new Error(
                "No se encontró tu perfil."
            );

        }


        profile =
        data;


        /* =====================
           USERNAME
           SIEMPRE BLOQUEADO
        ===================== */

        username.value =
        data.username || "";


        /* =====================
           APODO
        ===================== */

        displayName.value =
        data.display_name || "";


        /* =====================
           BIO
        ===================== */

        bio.value =
        data.bio || "";


        /* =====================
           SOCIALS
        ===================== */

        discord.value =
        data.discord || "";

        youtube.value =
        data.youtube || "";

        github.value =
        data.github || "";


        /* =====================
           FILE URLS
        ===================== */

        avatarUrl =
        data.avatar_url || null;

        bannerUrl =
        data.banner_url || null;

        musicUrl =
        data.music_url || null;


        updatePreview();


        message.className =
        "success";

        message.textContent =
        "4/4 — ¡PERFIL CARGADO! ✓";


    }

    catch(error){

        console.error(
            "NØX ERROR:",
            error
        );


        message.className =
        "error";

        message.textContent =
        "❌ " +
        (
            error.message ||
            "Error desconocido"
        );

    }

}


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    const user =
    username.value.trim();

    const name =
    displayName.value.trim();

    const biography =
    bio.value.trim();


    /*
       APODO
    */

    document
    .getElementById(
        "previewName"
    )
    .textContent =
    name ||
    "NØX User";


    /*
       USERNAME REAL
       DEBAJO DEL APODO
    */

    document
    .getElementById(
        "previewUsername"
    )
    .textContent =
    "@" +
    (
        user ||
        "username"
    );


    /*
       BIO
    */

    document
    .getElementById(
        "previewBio"
    )
    .textContent =
    biography ||
    "Welcome to my NØX profile.";


    /*
       AVATAR
    */

    const avatar =
    document.getElementById(
        "previewAvatar"
    );


    avatar.innerHTML = "";


    if(avatarUrl){

        const img =
        document.createElement(
            "img"
        );

        img.src =
        avatarUrl;

        img.alt =
        "Avatar";

        avatar.appendChild(
            img
        );

    }else{

        avatar.textContent =
        (
            name ||
            user ||
            "N"
        )
        .charAt(0)
        .toUpperCase();

    }


    /*
       BANNER
    */

    const banner =
    document.getElementById(
        "previewBanner"
    );


    if(bannerUrl){

        banner.style.backgroundImage =
        `url("${bannerUrl}")`;

    }else{

        banner.style.backgroundImage =
        "linear-gradient(135deg,#252525,#070707)";

    }


    /*
       MUSIC
    */

    const music =
    document.getElementById(
        "previewMusic"
    );


    if(musicUrl){

        music.src =
        musicUrl;

        music.style.display =
        "block";

    }else{

        music.style.display =
        "none";

    }


    /*
       SOCIAL LINKS
    */

    updateSocialLinks();

}


/* =========================
   SOCIAL LINKS
========================= */

function updateSocialLinks(){

    const container =
    document.getElementById(
        "previewLinks"
    );


    container.innerHTML = "";


    addSocialLink(
        discord.value.trim(),
        "Discord"
    );


    addSocialLink(
        youtube.value.trim(),
        "YouTube"
    );


    addSocialLink(
        github.value.trim(),
        "GitHub"
    );

}


function addSocialLink(
    value,
    title
){

    if(!value)
        return;


    const link =
    document.createElement(
        "a"
    );


    link.href =
    normalizeUrl(value);

    link.target =
    "_blank";

    link.rel =
    "noopener noreferrer";

    link.textContent =
    title +
    " ↗";


    document
    .getElementById(
        "previewLinks"
    )
    .appendChild(
        link
    );

}


function normalizeUrl(
    value
){

    if(
        value.startsWith(
            "http://"
        ) ||
        value.startsWith(
            "https://"
        )
    ){

        return value;

    }


    return "https://" +
        value;

}


/* =========================
   LIVE PREVIEW
========================= */

displayName.addEventListener(
    "input",
    updatePreview
);

bio.addEventListener(
    "input",
    updatePreview
);

discord.addEventListener(
    "input",
    updatePreview
);

youtube.addEventListener(
    "input",
    updatePreview
);

github.addEventListener(
    "input",
    updatePreview
);


/* =========================
   LOCAL IMAGE PREVIEW
========================= */

avatarFile.addEventListener(
    "change",
    function(){

        const file =
        avatarFile.files[0];


        if(!file)
            return;


        avatarUrl =
        URL.createObjectURL(
            file
        );


        updatePreview();

    }
);


bannerFile.addEventListener(
    "change",
    function(){

        const file =
        bannerFile.files[0];


        if(!file)
            return;


        bannerUrl =
        URL.createObjectURL(
            file
        );


        updatePreview();

    }
);


musicFile.addEventListener(
    "change",
    function(){

        const file =
        musicFile.files[0];


        if(!file)
            return;


        musicUrl =
        URL.createObjectURL(
            file
        );


        updatePreview();

    }
);


/* =========================
   UPLOAD FILE
========================= */

async function uploadFile(
    file,
    folder
){

    if(!file)
        return null;


    const extension =
    file.name
    .split(".")
    .pop()
    .toLowerCase();


    const path =
    currentUser.id +
    "/" +
    folder +
    "-" +
    Date.now() +
    "." +
    extension;


    const result =
    await supabase.storage
    .from(
        "profile-assets"
    )
    .upload(
        path,
        file,
        {
            upsert:true
        }
    );


    if(result.error){

        throw result.error;

    }


    const {
        data
    } =
    supabase.storage
    .from(
        "profile-assets"
    )
    .getPublicUrl(
        path
    );


    return data.publicUrl;

}


/* =========================
   SAVE
========================= */

saveButton.addEventListener(
    "click",
    saveProfile
);


async function saveProfile(){

    saveButton.disabled =
    true;

    saveButton.textContent =
    "Guardando...";


    message.className = "";

    message.textContent =
    "Subiendo cambios...";


    try{

        /*
           AVATAR
        */

        if(
            avatarFile.files[0]
        ){

            avatarUrl =
            await uploadFile(
                avatarFile.files[0],
                "avatar"
            );

        }


        /*
           BANNER
        */

        if(
            bannerFile.files[0]
        ){

            bannerUrl =
            await uploadFile(
                bannerFile.files[0],
                "banner"
            );

        }


        /*
           MUSIC
        */

        if(
            musicFile.files[0]
        ){

            musicUrl =
            await uploadFile(
                musicFile.files[0],
                "music"
            );

        }


        /*
           UPDATE
           NO TOCAMOS USERNAME
        */

        const {
            error
        } =
        await supabase
        .from("profiles")
        .update({

            display_name:
            displayName.value.trim(),

            bio:
            bio.value.trim(),

            avatar_url:
            avatarUrl,

            banner_url:
            bannerUrl,

            music_url:
            musicUrl,

            discord:
            discord.value.trim(),

            youtube:
            youtube.value.trim(),

            github:
            github.value.trim()

        })
        .eq(
            "id",
            currentUser.id
        );


        if(error){

            throw error;

        }


        updatePreview();


        message.className =
        "success";

        message.textContent =
        "✓ Perfil guardado";


        saveButton.textContent =
        "Guardado ✓";


        setTimeout(
        function(){

            saveButton.disabled =
            false;

            saveButton.textContent =
            "Save changes";

        },
        1200
        );

    }

    catch(error){

        console.error(
            error
        );


        showError(
            error.message
        );


        saveButton.disabled =
        false;

        saveButton.textContent =
        "Save changes";

    }

}


/* =========================
   GENERATE LINK
========================= */

generateButton.addEventListener(
    "click",
    generateProfileLink
);


async function generateProfileLink(){

    const user =
    username.value.trim();


    if(!user){

        showError(
            "Tu username todavía no está cargado."
        );

        return;

    }


    /*
       GUARDAMOS PRIMERO
    */

    generateButton.disable
