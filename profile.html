<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NØX — Profile</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,#303030,#090909 45%,#020202);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:min(1150px,92%);
    margin:auto;
}

nav{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #222;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:25px;
    font-weight:900;
}

.logout{
    padding:10px 16px;
    border:1px solid #292929;
    border-radius:9px;
    background:#0d0d0d;
    color:#aaa;
    cursor:pointer;
}

.logout:hover{
    background:#fff;
    color:#000;
}

.dashboard{
    display:grid;
    grid-template-columns:1fr 400px;
    gap:20px;
    padding:40px 0 70px;
}

.panel,
.preview{
    border:1px solid #242424;
    border-radius:20px;
    background:linear-gradient(145deg,#151515,#070707);
    box-shadow:0 30px 90px rgba(0,0,0,.5);
}

.panel{
    padding:30px;
}

.small{
    color:#555;
    font-size:9px;
    font-weight:bold;
    letter-spacing:3px;
}

h1{
    margin-top:10px;
    font-size:32px;
}

.desc{
    margin-top:8px;
    color:#666;
    font-size:12px;
}

.section{
    margin-top:28px;
    padding-top:22px;
    border-top:1px solid #1d1d1d;
}

.section-title{
    margin-bottom:15px;
    color:#777;
    font-size:10px;
    font-weight:bold;
    letter-spacing:2px;
}

.field{
    margin-top:14px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#666;
    font-size:9px;
    font-weight:bold;
    letter-spacing:1px;
    text-transform:uppercase;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #292929;
    border-radius:9px;
    background:#050505;
    color:#fff;
    outline:none;
    font-family:Arial;
}

input,
select{
    height:48px;
    padding:0 13px;
}

textarea{
    min-height:90px;
    padding:13px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#666;
}

.save{
    width:100%;
    height:50px;
    margin-top:25px;
    border:0;
    border-radius:9px;
    background:#fff;
    color:#000;
    font-weight:900;
    cursor:pointer;
}

.save:disabled{
    opacity:.5;
}

#message{
    min-height:20px;
    margin-top:13px;
    text-align:center;
    color:#777;
    font-size:11px;
}

.success{
    color:#65ff9d!important;
}

.error{
    color:#ff7070!important;
}

.preview-box{
    position:sticky;
    top:20px;
}

.preview-label{
    margin-bottom:12px;
    color:#555;
    font-size:9px;
    font-weight:bold;
    letter-spacing:3px;
}

.preview{
    min-height:550px;
    padding:35px 25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.avatar{
    width:95px;
    height:95px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:1px solid #444;
    border-radius:50%;
    background:linear-gradient(145deg,#333,#111);
    font-size:30px;
    font-weight:900;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:20px;
    font-size:26px;
    font-weight:900;
}

.handle{
    margin-top:5px;
    color:#555;
    font-size:11px;
}

.bio{
    max-width:310px;
    margin-top:18px;
    color:#777;
    font-size:12px;
    line-height:1.7;
}

.links{
    width:100%;
    display:grid;
    gap:8px;
    margin-top:25px;
}

.link{
    display:block;
    padding:13px;
    border:1px solid #252525;
    border-radius:9px;
    background:#0d0d0d;
    color:#aaa;
    text-decoration:none;
    font-size:11px;
}

.link:hover{
    color:#fff;
    border-color:#555;
}

.empty{
    color:#444;
    font-size:10px;
}

@media(max-width:850px){
    .dashboard{
        grid-template-columns:1fr;
    }

    .preview-box{
        position:static;
        order:-1;
    }
}

@media(max-width:500px){
    .panel{
        padding:22px;
    }

    h1{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="container">

<nav>

<a href="index.html" class="logo">NØX</a>

<button id="logout" class="logout">
Logout
</button>

</nav>


<div class="dashboard">


<!-- EDITOR -->

<section class="panel">

<div class="small">
NØX PROFILE
</div>

<h1>
Customize your profile
</h1>

<p class="desc">
Edit tu identidad y mira los cambios en tiempo real.
</p>


<div class="section">

<div class="section-title">
IDENTITY
</div>


<div class="field">

<label>
Username
</label>

<input
id="username"
type="text"
maxlength="24"
placeholder="username">

</div>


<div class="field">

<label>
Avatar URL
</label>

<input
id="avatar"
type="url"
placeholder="https://...">

</div>


<div class="field">

<label>
Bio
</label>

<textarea
id="bio"
maxlength="180"
placeholder="Escribe tu bio..."></textarea>

</div>

</div>


<div class="section">

<div class="section-title">
SOCIAL LINKS
</div>


<div class="field">

<label>
Discord
</label>

<input
id="discord"
type="text"
placeholder="discord.gg/...">

</div>


<div class="field">

<label>
GitHub
</label>

<input
id="github"
type="url"
placeholder="https://github.com/...">

</div>


<div class="field">

<label>
YouTube
</label>

<input
id="youtube"
type="url"
placeholder="https://youtube.com/@...">

</div>

</div>


<div class="section">

<div class="section-title">
APPEARANCE
</div>

<div class="field">

<label>
Theme
</label>

<select id="theme">

<option value="dark">
Dark
</option>

<option value="black">
Pure Black
</option>

<option value="silver">
Silver
</option>

</select>

</div>

</div>


<button
id="save"
class="save">

Save changes

</button>

<div id="message"></div>

</section>


<!-- PREVIEW -->

<section class="preview-box">

<div class="preview-label">
LIVE PREVIEW
</div>

<div class="preview">

<div
id="previewAvatar"
class="avatar">

N

</div>

<div
id="previewName"
class="name">

Username

</div>

<div
id="previewHandle"
class="handle">

@username

</div>

<div
id="previewBio"
class="bio">

Welcome to my NØX profile.

</div>

<div
id="previewLinks"
class="links">

<div class="empty">
Your links will appear here
</div>

</div>

</div>

</section>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

document.addEventListener(
"DOMContentLoaded",
async function(){

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ELEMENTS */

const username =
document.getElementById("username");

const avatar =
document.getElementById("avatar");

const bio =
document.getElementById("bio");

const discord =
document.getElementById("discord");

const github =
document.getElementById("github");

const youtube =
document.getElementById("youtube");

const theme =
document.getElementById("theme");

const save =
document.getElementById("save");

const message =
document.getElementById("message");

const previewAvatar =
document.getElementById("previewAvatar");

const previewName =
document.getElementById("previewName");

const previewHandle =
document.getElementById("previewHandle");

const previewBio =
document.getElementById("previewBio");

const previewLinks =
document.getElementById("previewLinks");


/* USER */

const {
data:{
user
}
} =
await supabase.auth.getUser();


if(!user){

window.location.href="login.html";

return;

}


/* LOAD PROFILE */

const {
data:profile,
error
} =
await supabase
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();


if(error){

message.className="error";

message.textContent=
"❌ "+error.message;

return;

}


/* PUT DATA */

if(profile){

username.value=
profile.username || "";

avatar.value=
profile.avatar_url || "";

bio.value=
profile.bio ||
"Welcome to my NØX profile.";

discord.value=
profile.discord || "";

github.value=
profile.github || "";

youtube.value=
profile.youtube || "";

theme.value=
profile.theme || "dark";

}

updatePreview();


/* PREVIEW */

function updatePreview(){

const name =
username.value.trim()
|| "Username";


previewName.textContent=
name;

previewHandle.textContent=
"@"+name;

previewBio.textContent=
bio.value.trim()
|| "Welcome to my NØX profile.";


/* AVATAR */

const url =
avatar.value.trim();


if(url){

previewAvatar.innerHTML="";

const img =
document.createElement("img");

img.src=url;

img.onerror=function(){

previewAvatar.textContent=
name.charAt(0).toUpperCase();

};

previewAvatar.appendChild(img);

}else{

previewAvatar.textContent=
name.charAt(0).toUpperCase();

}


/* LINKS */

previewLinks.innerHTML="";

let links=0;


function addLink(
value,
title
){

if(!value.trim()) return;

const a =
document.createElement("a");

a.className="link";

a.textContent=
title+" ↗";

a.href=
value.startsWith("http")
? value
: "https://"+value;

a.target="_blank";

previewLinks.appendChild(a);

links++;

}


addLink(
discord.value,
"Discord"
);

addLink(
github.value,
"GitHub"
);

addLink(
youtube.value,
"YouTube"
);


if(!links){

previewLinks.innerHTML=
'<div class="empty">Your links will appear here</div>';

}

}


/* LIVE */

[
username,
avatar,
bio,
discord,
github,
youtube,
theme
].forEach(
function(el){

el.addEventListener(
"input",
updatePreview
);

el.addEventListener(
"change",
updatePreview
);

});


/* SAVE */

save.addEventListener(
"click",
async function(){

save.disabled=true;

save.textContent=
"Saving...";

message.className="";

message.textContent=
"Guardando perfil...";


const {
error
} =
await supabase
.from("profiles")
.update({

username:
username.value
.trim()
.toLowerCase(),

avatar_url:
avatar.value.trim(),

bio:
bio.value.trim(),

discord:
discord.value.trim(),

github:
github.value.trim(),

youtube:
youtube.value.trim(),

theme:
theme.value

})
.eq(
"id",
user.id
);


if(error){

message.className="error";

message.textContent=
"❌ "+error.message;

save.disabled=false;

save.textContent=
"Save changes";

return;

}


message.className=
"success";

message.textContent=
"✓ Perfil guardado.";

save.textContent=
"Saved ✓";


setTimeout(
function(){

save.textContent=
"Save changes";

},
1800
);

save.disabled=false;

});


/* LOGOUT */

document
.getElementById("logout")
.addEventListener(
"click",
async function(){

await supabase.auth.signOut();

window.location.href=
"index.html";

});

});

</script>

</body>
</html>
