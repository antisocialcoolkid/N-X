<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Profile</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            #292929 0%,
            #0b0b0b 35%,
            #020202 75%
        );

    color:#fff;

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
}

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.22;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:45px 45px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}

.container{

    width:min(1200px,92%);

    margin:auto;
}

nav{

    height:82px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.logo{

    color:#fff;

    text-decoration:none;

    font-size:25px;

    font-weight:950;

    letter-spacing:-1px;
}

.nav-right{

    display:flex;

    gap:9px;
}

.nav-button{

    padding:10px 15px;

    border:
        1px solid
        #292929;

    border-radius:9px;

    background:#0c0c0c;

    color:#aaa;

    cursor:pointer;

    font-size:11px;

    font-weight:800;

    transition:.2s;
}

.nav-button:hover{

    color:#000;

    background:#fff;

    border-color:#fff;
}


/* =========================
   LAYOUT
========================= */

.dashboard{

    display:grid;

    grid-template-columns:
        1fr
        420px;

    gap:18px;

    padding:45px 0 70px;
}


/* =========================
   EDITOR
========================= */

.panel{

    padding:30px;

    border:
        1px solid
        #202020;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(20,20,20,.95),
            rgba(7,7,7,.95)
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.45);
}

.eyebrow{

    color:#555;

    font-size:9px;

    font-weight:900;

    letter-spacing:3px;

    text-transform:uppercase;
}

h1{

    margin-top:8px;

    font-size:32px;

    letter-spacing:-1.5px;
}

.description{

    margin-top:8px;

    color:#666;

    font-size:12px;

    line-height:1.6;
}

.section{

    margin-top:30px;

    padding-top:25px;

    border-top:
        1px solid
        #181818;
}

.section-title{

    margin-bottom:15px;

    color:#777;

    font-size:10px;

    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;
}

.field{

    margin-top:14px;
}

label{

    display:block;

    margin-bottom:7px;

    color:#666;

    font-size:9px;

    font-weight:900;

    letter-spacing:1px;

    text-transform:uppercase;
}

input,
textarea,
select{

    width:100%;

    border:
        1px solid
        #282828;

    border-radius:9px;

    outline:none;

    background:#050505;

    color:#fff;

    font-family:inherit;

    font-size:12px;

    transition:.2s;
}

input,
select{

    height:48px;

    padding:0 13px;
}

textarea{

    min-height:95px;

    padding:13px;

    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{

    border-color:#555;

    background:#080808;
}

input::placeholder,
textarea::placeholder{

    color:#3e3e3e;
}


/* SAVE */

.save{

    width:100%;

    height:50px;

    margin-top:25px;

    border:0;

    border-radius:9px;

    background:#fff;

    color:#000;

    cursor:pointer;

    font-size:11px;

    font-weight:950;

    transition:.2s;
}

.save:hover{

    transform:translateY(-2px);

    box-shadow:
        0 15px 35px
        rgba(255,255,255,.1);
}

.save:disabled{

    opacity:.5;

    cursor:not-allowed;

    transform:none;
}

#message{

    min-height:18px;

    margin-top:12px;

    text-align:center;

    color:#777;

    font-size:10px;
}

.success{

    color:#6dffab !important;
}

.error{

    color:#ff6f6f !important;
}


/* =========================
   PREVIEW
========================= */

.preview-wrap{

    position:sticky;

    top:25px;

    height:max-content;
}

.preview-label{

    margin-bottom:12px;

    color:#555;

    font-size:9px;

    font-weight:900;

    letter-spacing:3px;
}

.preview{

    min-height:520px;

    padding:30px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    border:
        1px solid
        #292929;

    border-radius:22px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #252525,
            #0c0c0c 45%,
            #050505
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.6);
}

.avatar{

    width:92px;

    height:92px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border:
        1px solid
        #444;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #333,
            #111
        );

    color:#fff;

    font-size:30px;

    font-weight:950;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.5);
}

.avatar img{

    width:100%;

    height:100%;

    object-fit:cover;
}

.preview-name{

    margin-top:20px;

    font-size:25px;

    font-weight:950;

    letter-spacing:-1px;
}

.preview-handle{

    margin-top:5px;

    color:#555;

    font-size:11px;
}

.preview-bio{

    max-width:310px;

    margin-top:18px;

    color:#777;

    font-size:12px;

    line-height:1.7;
}

.links{

    width:100%;

    display:grid;

    gap:8px;

    margin-top:25px;
}

.link{

    display:block;

    padding:13px;

    border:
        1px solid
        #242424;

    border-radius:9px;

    background:
        rgba(255,255,255,.025);

    color:#aaa;

    text-decoration:none;

    font-size:11px;

    transition:.2s;
}

.link:hover{

    color:#fff;

    border-color:#444;

    transform:translateY(-2px);
}

.empty{

    color:#444;

    font-size:10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .dashboard{

        grid-template-columns:1fr;

    }

    .preview-wrap{

        position:static;

        order:-1;
    }

    .preview{

        min-height:430px;
    }
}

@media(max-width:500px){

    .container{

        width:90%;
    }

    nav{

        height:70px;
    }

    .panel{

        padding:22px;
    }

    h1{

        font-size:27px;
    }

    .preview{

        padding:25px;
    }
}

</style>

</head>


<body>


<div class="container">


<nav>

<a
    href="index.html"
    class="logo">

    NØX

</a>


<div class="nav-right">

<button
    class="nav-button"
    id="viewProfile">

    View profile

</button>


<button
    class="nav-button"
    id="logout">

    Logout

</button>

</div>

</nav>



<div class="dashboard">


<!-- =========================
     EDITOR
========================= -->

<section class="panel">

<div class="eyebrow">
NØX PROFILE
</div>

<h1>
Customize your profile
</h1>

<p class="description">
Control your identity, bio and social links.
Your changes appear instantly in the preview.
</p>


<div class="section">

<div class="section-title">
Identity
</div>


<div class="field">

<label>
Username
</label>

<input
    id="username"
    type="text"
    maxlength="24"
    placeholder="username">

</div>


<div class="field">

<label>
Avatar URL
</label>

<input
    id="avatar"
    type="url"
    placeholder="https://...">

</div>


<div class="field">

<label>
Bio
</label>

<textarea
    id="bio"
    maxlength="180"
    placeholder="Tell people about yourself..."></textarea>

</div>

</div>



<div class="section">

<div class="section-title">
Social links
</div>


<div class="field">

<label>
Discord
</label>

<input
    id="discord"
    type="text"
    placeholder="discord.gg/...">

</div>


<div class="field">

<label>
GitHub
</label>

<input
    id="github"
    type="url"
    placeholder="https://github.com/...">

</div>


<div class="field">

<label>
YouTube
</label>

<input
    id="youtube"
    type="url"
    placeholder="https://youtube.com/@...">

</div>

</div>



<div class="section">

<div class="section-title">
Appearance
</div>


<div class="field">

<label>
Theme
</label>

<select id="theme">

<option value="dark">
Dark
</option>

<option value="black">
Pure Black
</option>

<option value="silver">
Silver
</option>

</select>

</div>

</div>



<button
    class="save"
    id="save">

    Save changes

</button>


<div id="message"></div>

</section>



<!-- =========================
     PREVIEW
========================= -->

<section class="preview-wrap">

<div class="preview-label">
LIVE PREVIEW
</div>


<div
    class="preview"
    id="preview">


<div
    class="avatar"
    id="previewAvatar">

    N

</div>


<div
    class="preview-name"
    id="previewName">

    Username

</div>


<div
    class="preview-handle"
    id="previewHandle">

    @username

</div>


<div
    class="preview-bio"
    id="previewBio">

    Welcome to my NØX profile.

</div>


<div
    class="links"
    id="previewLinks">

    <div class="empty">
    Your links will appear here
    </div>

</div>

</div>

</section>


</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

document.addEventListener(
"DOMContentLoaded",
async function(){

const SUPABASE_URL =
"https://asgowauvzfnsszstvzqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_scsteNa_ILseeQYkL1Olyg_38UMGSZS";


const client =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const username =
document.getElementById("username");

const avatar =
document.getElementById("avatar");

const bio =
document.getElementById("bio");

const discord =
document.getElementById("discord");

const github =
document.getElementById("github");

const youtube =
document.getElementById("youtube");

const theme =
document.getElementById("theme");

const save =
document.getElementById("save");

const message =
document.getElementById("message");

const previewName =
document.getElementById("previewName");

const previewHandle =
document.getElementById("previewHandle");

const previewBio =
document.getElementById("previewBio");

const previewAvatar =
document.getElementById("previewAvatar");

const previewLinks =
document.getElementById("previewLinks");

const preview =
document.getElementById("preview");


/* =========================
   USER
========================= */

const {
    data:{
        user
    },
    error:userError
} =
await client.auth.getUser();


if(userError || !user){

    window.location.href =
    "login.html";

    return;
}


/* =========================
   LOAD PROFILE
========================= */

const {
    data:profile,
    error:profileError
} =
await client
.from("profiles")
.select("*")
.eq("id",user.id)
.single();


if(profileError){

    message.className="error";

    message.textContent =
    "❌ " +
    profileError.message;

    return;
}


/* =========================
   FILL FORM
========================= */

username.value =
profile.username || "";

avatar.value =
profile.avatar_url || "";

bio.value =
profile.bio ||
"Welcome to my NØX profile.";

discord.value =
profile.discord || "";

github.value =
profile.github || "";

youtube.value =
profile.youtube || "";

theme.value =
profile.theme || "dark";


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    const name =
    username.value.trim()
    || "Username";

    previewName.textContent =
    name;

    previewHandle.textContent =
    "@" + name;

    previewBio.textContent =
    bio.value.trim()
    || "Welcome to my NØX profile.";


    /* AVATAR */

    const avatarURL =
    avatar.value.trim();


    if(avatarURL){

        previewAvatar.innerHTML =
        "";

        const image =
        document.createElement("img");

        image.src =
        avatarURL;

        image.alt =
        "Avatar";

        image.onerror =
        function(){

            previewAvatar.innerHTML =
            name.charAt(0).toUpperCase();

        };

        previewAvatar.appendChild(
            image
        );

    }else{

        previewAvatar.textContent =
        name.charAt(0).toUpperCase();

    }


    /* LINKS */

    previewLinks.innerHTML =
    "";


    let count = 0;


    if(discord.value.trim()){

        const a =
        document.createElement("a");

        a.className="link";

        a.textContent =
        "Discord ↗";

        a.href =
        discord.value.trim();

        if(
            !discord.value
            .startsWith("http")
        ){

            a.href =
            "https://" +
            discord.value.trim();
        }

        a.target="_blank";

        previewLinks.appendChild(a);

        count++;

    }


    if(github.value.trim()){

        const a =
        document.createElement("a");

        a.className="link";

        a.textContent =
        "GitHub ↗";

        a.href =
        github.value.trim();

        a.target="_blank";

        previewLinks.appendChild(a);

        count++;

    }


    if(youtube.value.trim()){

        const a =
        document.createElement("a");

        a.className="link";

        a.textContent =
        "YouTube ↗";

        a.href =
        youtube.value.trim();

        a.target="_blank";

        previewLinks.appendChild(a);

        count++;

    }


    if(count === 0){

        const empty =
        document.createElement("div");

        empty.className="empty";

        empty.textContent =
        "Your links will appear here";

        previewLinks.appendChild(
            empty
        );

    }


    /* THEME */

    if(theme.value === "black"){

        preview.style.background =
        "#000";

    }
    else if(theme.value === "silver"){

        preview.style.background =
        "radial-gradient(circle at 50% 0%,#414141,#151515 50%,#090909)";

    }
    else{

        preview.style.background =
        "radial-gradient(circle at 50% 0%,#252525,#0c0c0c 45%,#050505)";

    }

}


/* LIVE UPDATE */

[
    username,
    avatar,
    bio,
    discord,
    github,
    youtube,
    theme
].forEach(
function(element){

    element.addEventListener(
        "input",
        updatePreview
    );

    element.addEventListener(
        "change",
        updatePreview
    );

});


updatePreview();


/* =========================
   SAVE
========================= */

save.addEventListener(
"click",
async function(){

    save.disabled=true;

    save.textContent =
    "Saving...";

    message.className="";

    message.textContent =
    "Guardando cambios...";


    try{

        const {
            error
        } =
        await client
        .from("profiles")
        .update({

            username:
            username.value
            .trim()
            .toLowerCase(),

            bio:
            bio.value.trim(),

            avatar_url:
            avatar.value.trim(),

            discord:
            discord.value.trim(),

            github:
            github.value.trim(),

            youtube:
            youtube.value.trim(),

            theme:
            theme.value

        })
        .eq(
            "id",
            user.id
        );


        if(error){

            throw error;

        }


        message.className =
        "success";

        message.textContent =
        "✓ Perfil guardado correctamente.";

        save.textContent =
        "Saved ✓";


        setTimeout(
        function(){

            save.textContent =
            "Save changes";

        },
        2000
        );


    }
    catch(error){

        console.error(error);

        message.className =
        "error";

        message.textContent =
        "❌ " +
        error.message;

        save.textContent =
        "Save changes";

    }


    save.disabled=false;

});


/* =========================
   LOGOUT
========================= */

document
.getElementById("logout")
.addEventListener(
"click",
async function(){

    await client.auth.signOut();

    window.location.href =
    "index.html";

});


/* =========================
   VIEW PROFILE
========================= */

document
.getElementById("viewProfile")
.addEventListener(
"click",
function(){

    alert(
        "La página pública de perfil la podemos crear en el siguiente paso."
    );

});

});

</script>

</body>
    </html>
